let PEOPLE_BUSY = false;

const ROLE_LABEL = {

function loadPeople(){
  if(typeof VFSync === 'undefined' || !VFSync.enabled() || !VFSync.signedIn()){
    PEOPLE = []; PEOPLE_ERR = 'Sign in to manage users.'; render(); return;
  }
  PEOPLE_BUSY = true;
  VFSync.listPeople().then(rows=>{
    PEOPLE = rows || []; PEOPLE_ERR = '';
  }).catch(e=>{
    PEOPLE = []; PEOPLE_ERR = e.message || 'Could not load users';
  }).then(()=>{ PEOPLE_BUSY = false; render(); });
}

function roleSelect(u, isMe){
  if(isMe) return '<span class="pill p-green">Owner</span>';
  let h = '<select onchange="changeRole(\''+u.id+'\',this.value)" style="width:auto;font-size:13px">';
  ['owner','admin','ho','shop'].forEach(r=>{
    /* a shop user cannot be re-tagged here: the row would need a shop id */
    if(r === 'shop' && u.role !== 'shop') return;
    if(u.role === 'shop' && r !== 'shop') return;
    h += '<option value="'+r+'"'+(u.role===r?' selected':'')+' title="'+esc(ROLE_LABEL[r])+'">'
       + ROLE_NAME[r]+'</option>';
  });
  return h + '</select>';
}

/* Supabase signs people in by email, and phone sign-in needs an SMS
   provider nobody has set up. Shop staff often have no email at all, so
   one is derived from their phone. It is a username, not an address:
   nothing is ever sent to it, and the account is created already
   confirmed.

   Built from the phone alone. It used to carry the shop code as well,
   which read nicely but could not be rebuilt at the gate — the person
   signing in types a phone number, not a shop. Accounts made under the
   old shape still work: VFSync.signInShop tries them too. */
function loginIdFor(role, phone, shopId){
  const digits = String(phone || '').replace(/[^0-9]/g, '');
  return 'p' + digits + '@shop.velorafresh.in';
}

function suggestPass(){
  /* no l, I, O, 0 or 1 — this gets read out over the phone */
  const a = 'abcdefghjkmnpqrstuvwxyz', A = 'ABCDEFGHJKMNPQRSTUVWXYZ', d = '23456789';
  const pool = a + A + d;
  let out = '';
  const r = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(r);
  for(let i=0;i<10;i++) out += pool.charAt(r[i] % pool.length);
  document.getElementById('npPass').value = out;
}

/* What is asked for follows the role, the same way the sign-in screen
   follows who is signing in. A shop cannot be emailed anything, so the
   email box is not there to be filled in by mistake. */
function npRoleChanged(){
  const role   = document.getElementById('npRole').value;
  const chosen = !!role;
  const shop   = role === 'shop';
  const set = (id, yes, cls) => {
    const el = document.getElementById(id);
    if(el) el.className = yes ? (cls || '') : ((cls ? cls + ' ' : '') + 'hidden');
  };
  set('npNameWrap',  chosen);
  set('npPhoneWrap', chosen);
  set('npShopWrap',  chosen && shop);
  set('npEmailWrap', chosen && !shop);
  set('npPassWrap',  chosen);
  set('npAddBtn',    chosen, 'btn pri');
  /* starred only where it is genuinely refused without: a shop signs in
     with its phone and password, an office login can be recorded as an
     invite against either an email or a phone */
  set('npPhoneReq', shop, 'req');
  set('npPassReq',  shop, 'req');
  document.getElementById('npPass').placeholder =
    shop ? 'set one and send it' : 'leave blank to email a link';
  document.getElementById('npHint').innerHTML = !chosen
    ? 'Choose the role first &mdash; what is asked for next depends on it.'
    : shop
    ? 'They sign in with the three things you type here &mdash; <b>name</b>, <b>phone</b> '
      + 'and <b>password</b>. Nothing is emailed; the panel that appears next sends them '
      + 'on WhatsApp. Use the name exactly as you want them to type it.'
    : 'Leave the password blank and an email goes to the address above with a link to set '
      + 'their own. Type one instead and the login works straight away, but nothing is sent '
      + '&mdash; you hand it over yourself.';
}

function addPerson(){
  const name  = document.getElementById('npName').value.trim();
  const phone = document.getElementById('npPhone').value.replace(/\s+/g,'');
  const role  = document.getElementById('npRole').value;
  /* the box is hidden for a shop, so anything left in it from the last
     person added is not theirs and must not decide which path is taken */
  const email = (role === 'shop') ? '' : document.getElementById('npEmail').value.trim();
  const shop  = document.getElementById('npShop').value;

  const pass = document.getElementById('npPass').value.trim();

  if(!role){ alert('Choose the role first.'); return; }
  /* a nameless row is unreadable in the list afterwards, and for a shop
     the name is one of the three things they type to get in */
  if(!name){
    alert(role === 'shop' ? 'A shop login needs a name — they sign in with it.'
                          : 'Enter the person’s name.');
    return;
  }
  if(!phone && !email){ alert('Enter a phone number or an email address.'); return; }
  if(role === 'shop' && !phone){ alert('A shop login needs a phone number.'); return; }
  if(pass && pass.length < 8){ alert('Use a password of at least 8 characters.'); return; }

  /* No email typed but a password given: derive a login id from the
     phone rather than refusing. Nothing is emailed to it. */
  let loginId = email;
  if(pass && !loginId){
    if(!phone){ alert('Enter a phone number, or an email address.'); return; }
    loginId = loginIdFor(role, phone, shop);
  }

  const common = {
    role: role, name: name, phone: phone || null, email: (email || null),
    clientId: (role === 'shop' || role === 'ho') ? VF_CONFIG.clientId : null,
    shopId:   (role === 'shop') ? shop : null,
  };

  const done = ()=>{ PEOPLE = null; loadPeople(); };
  const failed = (e)=>{
    PEOPLE_BUSY = false;
    alert('Could not add: ' + (e.message || e));
    render();
  };

  PEOPLE_BUSY = true; render();

  /* the edge function is not up yet — record an invite rather than
     leaving the owner with nothing */
  const fallback = (why)=>{
    VFSync.invitePerson(common).then(()=>{
      alert(why);
      done();
    }).catch(failed);
  };

  if(pass){
    VFSync.createUser(Object.assign({}, common, {password: pass, email: loginId}))
      .then(()=>{
        NEWLOGIN = {name: name || loginId, login: loginId, pass: pass, phone: phone,
                    shop: !email};
        done();
      })
      .catch(e=>{
        if(e.notDeployed){
          fallback('Creating logins directly is not switched on for this project yet, '
                 + 'so an invite was recorded instead. They can sign up with '
                 + email + ' and choose their own password.');
        }else failed(e);
      });
  }else if(email){
    /* No password and a real address: the account is created and Supabase
       emails them a link to choose their own first password. */
    VFSync.createUser(Object.assign({}, common, {email: email}))
      .then(()=>{
        alert('Account created for ' + email + '. They have been emailed a link '
            + 'to set their own password. It is good for 24 hours — if they miss '
            + 'it, they can use Forgot password on the sign in screen.');
        done();
      })
      .catch(e=>{
        if(e.notDeployed){
          fallback('Sending the invite email is not switched on for this project yet, '
                 + 'so an invite was recorded instead. They can sign up with '
                 + email + ' and choose their own password.');
        }else failed(e);
      });
  }else{
    /* Nothing to email to. Recorded so the role is waiting for them. */
    VFSync.invitePerson(common).then(done).catch(failed);
  }
}

function changeRole(id, role){
  VFSync.setPersonRole(id, role)
    .then(()=>{ PEOPLE = null; loadPeople(); })
    .catch(e=>{ alert(e.message || e); PEOPLE = null; loadPeople(); });
}

/* Shop staff have no email, so there is no reset link to send. The owner
   sets a new password and sends it the same way the first one went. */
function resetFor(id){
  const u = (PEOPLE || []).filter(p=>p.id === id)[0];
  if(!u) return;
  if(!confirm('Set a new password for ' + (u.full_name || 'this person') + '?\n\n'
            + 'Their old one stops working straight away.')) return;

  const a = 'abcdefghjkmnpqrstuvwxyz', A = 'ABCDEFGHJKMNPQRSTUVWXYZ', d = '23456789';
  const pool = a + A + d;
  const r = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(r);
  let pass = '';
  for(let i=0;i<10;i++) pass += pool.charAt(r[i] % pool.length);

  PEOPLE_BUSY = true; render();
  VFSync.resetPassword(id, pass)
    .then(res=>{
      NEWLOGIN = {
        name: u.full_name || 'this person',
        login: (res && res.email) || u.phone || '(their usual login)',
        pass: pass, phone: u.phone, reset: true,
        /* a derived id is not an address, and is not what they type */
        shop: /@shop\.velorafresh\.in$/.test((res && res.email) || ''),
      };
      PEOPLE = null; loadPeople();
    })
    .catch(e=>{
      PEOPLE_BUSY = false;
      alert(e.notDeployed
        ? 'Resetting needs the create-user function deployed in Supabase. '
          + 'Until then, change the password from Supabase > Authentication > Users.'
        : ('Could not reset: ' + (e.message || e)));
      render();
    });
}

function togglePerson(id, active){

/* Deleting is not the usual answer — switching somebody off keeps the
   record of who did what — so the name has to be read before it happens,
   and the wording says which of the two halves is going. If the edge
   function is not deployed the access can still be taken away from here,
   because an owner may write app_users; the sign-in itself survives that
   and the owner is told so rather than left thinking it is gone. */
function deletePerson(id, name){
  const who = name || 'this person';
  if(!confirm('Delete ' + who + '?\n\nTheir login is removed and they cannot sign in again. '
              + 'To stop someone temporarily, use Deactivate instead.')) return;
  const done = (r)=>{
    PEOPLE = null; loadPeople();
    if(r && r.accessOnly){
      alert('Deleted. They are off the list and can no longer see anything.\n\n'
            + 'The sign-in behind them is still on the server — removing that needs the '
            + 'create-user function, which this project has not been given yet '
            + '(docs/DEPLOY.md). Until it is, adding the same phone number or email '
            + 'again will say the login already exists.');
    }
  };
  VFSync.removePerson(id)
    .then(done)
    .catch(e=>{
      if(e.notDeployed){
        VFSync.removeAccess(id).then(done).catch(err=>{
          alert('Could not delete: ' + (err.message || err)); PEOPLE = null; loadPeople();
        });
        return;
      }
      alert('Could not delete: ' + (e.message || e));
      PEOPLE = null; loadPeople();
    });
}

function dropInvite(id){
  if(!confirm('Cancel this invite?')) return;
  VFSync.cancelInvite(id)
    .then(()=>{ PEOPLE = null; loadPeople(); })
    .catch(e=>{ alert(e.message || e); PEOPLE = null; loadPeople(); });
}

/* The number the pack list and the bill go to. Kept on the shop rather
   than the person, because managers change and the shop's number does
   not. */
function setShopPhone(id, v){
  const sh = shopById(id); if(!sh) return;
  sh.phone = String(v || '').replace(/\s+/g,'');
  DB.shopPhones = DB.shopPhones || {};
  DB.shopPhones[id] = sh.phone;
  save();
}

function addShop(){
  if(ROLE !== 'owner'){ alert('Only an owner may add a shop.'); return; }
  const code = document.getElementById('nsCode').value.trim().toUpperCase();
  const name = document.getElementById('nsName').value.trim();
  const comm = parseFloat(document.getElementById('nsComm').value);

  if(!/^[A-Z]{2,4}$/.test(code)){ alert('The code must be 2 to 4 letters, A to Z.'); return; }
  if(!name){ alert('Enter the shop name.'); return; }
  if(SHOPS.filter(s=>s.id===code).length){ alert(code+' already exists.'); return; }
  if(isNaN(comm) || comm < 0){ alert('Enter a commission percentage.'); return; }

  const shop = {id:code, name:name, prefix:'VF/'+code, comm:comm};
  SHOPS.push(shop);
  DB.master.comm[code] = comm;
  save();

  /* The shop must reach the shops table before anything can reference
     it — margin_comm and every indent carry a foreign key to it. */
  if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn()){
    VFSync.addShop(shop).then(()=>{ VFSync.push(); render(); })
      .catch(e=>{
        SHOPS.pop(); delete DB.master.comm[code]; save();
        alert('Could not add the shop: ' + (e.message || e));
        render();
      });
  }else{
    render();
  }
}



/* which group a screen sits under, '' for the ones that stand alone */
function grpHolding(t){
  const g = menuFor().filter(g=>!g.id && (g.kids||[]).some(k=>k.id===t))[0];
  return g ? g.t : '';
}

function drawSide(){
  const groups = menuFor();

  if(OPENGRP === null) OPENGRP = grpHolding(TAB);

         + icon(g.ic)+g.t+'</button></div>';

       Purchase screen is the one on show */

       + icon(g.ic)+g.t+'<span class="cv">&#9654;</span></button>'

                       + k.t+'</button>').join('')

/* ---------- the header on a phone ----------
   Seven controls will not sit on one line at 390px, so the header wrapped
   to four rows — and the drawer, which hangs off the header's height,
   started halfway down the screen with its first menu items behind it.
   On a phone the header keeps the menu button and the name of the
   business, and everything else moves into the drawer, where there is
   room to read it. Moved back the moment there is width for it. */
/* not every browser has matchMedia, and an old till-counter tablet
   without it must not take the whole script down with it */
const PHONE = window.matchMedia ? window.matchMedia('(max-width:720px)') : null;
function onPhone(){ return PHONE ? PHONE.matches : (window.innerWidth <= 720); }
const HEADER_ORDER = Array.prototype.slice.call(document.querySelector('header').children);
/* who you are and the day you are working on belong together at the top;
   the way out belongs at the bottom, under the menu, where it cannot be
   pressed by accident. Light or dark stays in the header on a desk and
   is left out of the drawer — the phone follows its own setting. */
const SIDE_WHO  = ['whoami','roleSel','dateSel'];   /* one line, together */
const SIDE_TOP  = ['anyBox','wipeDay','syncState'];
const SIDE_FOOT = ['signOutBtn','clock','buildId'];

function placeHeaderControls(){
  const top  = document.getElementById('sideTop');
  const who  = document.getElementById('sideWho');
  const foot = document.getElementById('sideFoot');
  const head = document.querySelector('header');
  if(onPhone()){
    SIDE_WHO.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== who) who.appendChild(el);
    });
    SIDE_TOP.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== top) top.appendChild(el);
    });
    SIDE_FOOT.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== foot) foot.appendChild(el);
    });
    top.classList.remove('hidden');
    foot.classList.remove('hidden');
  }else{
    /* appendChild moves rather than copies, so walking the original list
       puts every one of them back in the order it was written in */
    HEADER_ORDER.forEach(el=> head.appendChild(el));
    top.classList.add('hidden');
    foot.classList.add('hidden');
  }
}
if(PHONE && PHONE.addEventListener) PHONE.addEventListener('change', placeHeaderControls);
else if(PHONE && PHONE.addListener) PHONE.addListener(placeHeaderControls);
else window.addEventListener('resize', placeHeaderControls);

function toggleSide(force){
  const side = document.getElementById('side'), sc = document.getElementById('scrim');
  const open = force===undefined ? !side.classList.contains('open') : force;
  side.classList.toggle('open', open);
  sc.classList.toggle('on', open);
}

/* Every table gets something that can scroll around it.
   Most screens wrote their own, but sixteen did not, and on a phone one
   of those — packing, which is nine columns wide — pushed the whole
   page sideways instead of scrolling inside its card: the right hand
   column looked cut off rather than reachable. Done here rather than at
   sixteen call sites, so a table added later is covered too. */
function wrapTables(root){
  const tables = root.querySelectorAll('table');
  for(let i = 0; i < tables.length; i++){
    const t = tables[i], p = t.parentNode;
    if(!p || (p.className || '').indexOf('twrap') > -1) continue;
    const w = document.createElement('div');
    w.className = 'twrap';
    p.insertBefore(w, t);
    w.appendChild(t);
  }
  /* A table wider than the screen looked cut off rather than
     scrollable, which is the same thing as broken to whoever is holding
     the phone. Anything that can still be scrolled to the right is
     given a soft edge, and the edge goes away at the end of the run. */
  const wraps = root.querySelectorAll('.twrap');
  for(let i = 0; i < wraps.length; i++){
    const w = wraps[i];
    let outer = w.parentNode;
    if(!outer || (outer.className || '').indexOf('tscroll') < 0){
      outer = document.createElement('div');
      outer.className = 'tscroll';
      w.parentNode.insertBefore(outer, w);
      outer.appendChild(w);
    }
    const mark = () => outer.classList.toggle('more',
      w.scrollWidth - w.clientWidth - w.scrollLeft > 2);
    w.onscroll = mark;
    mark();
  }
}

/* What this shop has actually ordered, most often first. Read from its
   own past indents — every one it has, not a fixed window, because a
   shop that orders drumstick once a fortnight still orders drumstick.
   Ties are broken by the most recent, so something picked up last week
   sits above something dropped a month ago. */
function myUsual(shopId, exceptDate){
  const times = {}, last = {};
  Object.keys(DB.indents || {}).sort().forEach(d=>{
    if(d === exceptDate) return;
    const ind = (DB.indents[d] || {})[shopId];
    if(!ind || !ind.lines) return;
    Object.keys(ind.lines).forEach(c=>{
      if(!CAT[c] || !(Number(ind.lines[c]) > 0)) return;
      times[c] = (times[c] || 0) + 1;
      last[c] = d;
    });
  });
  return Object.keys(times).sort((a,b)=>{
    if(times[b] !== times[a]) return times[b] - times[a];
    if(last[b] !== last[a]) return last[b] < last[a] ? -1 : 1;
    return CAT[a].name.localeCompare(CAT[b].name);
  });
}

/* The last time this shop actually had this product.

   One record answers both columns, so the quantity and the price a
   shop reads always belong to the same day. The bill is the best
   source — it carries what arrived and what it was charged at, frozen
   at the time. Failing that the packing slip says what arrived but not
   at what price, and failing that there is only what they asked for,
   which is not a purchase and is marked as such by having no price. */
function myLastFor(shopId, code, beforeDate){
  const dates = {};
  Object.keys(DB.indents || {}).forEach(d=>{ dates[d] = 1; });
  Object.keys(DB.days || {}).forEach(d=>{ dates[d] = 1; });
  Object.keys(DB.invoices || {}).forEach(d=>{ dates[d] = 1; });
  const days = Object.keys(dates).filter(d=>d < beforeDate).sort();

  for(let i = days.length - 1; i >= 0; i--){
    const d = days[i];

    const inv = (DB.invoices[d] || {})[shopId];
    const line = inv && inv.saved
      && (inv.lines || []).filter(l=>String(l.code) === String(code))[0];
    if(line && Number(line.qty) > 0){
      return { date: d, qty: Number(line.qty), rate: Number(line.rate) || null, billed: true };
    }

    const packed = ((DB.days[d] || {}).packed || {})[shopId] || {};
    if(packed[code] !== undefined && Number(packed[code]) > 0){
      return { date: d, qty: Number(packed[code]), rate: null, billed: false };
    }

    const ind = (DB.indents[d] || {})[shopId];
    const q = ind && ind.lines ? ind.lines[code] : undefined;
    if(q !== undefined && Number(q) > 0){
      return { date: d, qty: Number(q), rate: null, billed: false };
    }
  }
  return null;
}

/* kg stays kg; the rest read better shortened next to a price */
const UNIT_SHORT = { piece: 'pc', pieces: 'pc', box: 'box', tray: 'tray', bunch: 'bunch' };
function unitShort(u){ return UNIT_SHORT[String(u||'').toLowerCase()] || (u || ''); }
function unitPlural(u, n){
  const s = String(u||'').toLowerCase();
  if(Number(n) === 1) return unitShort(u);
  if(s === 'piece') return 'pcs';
  if(s === 'box')   return 'boxes';
  return unitShort(u);
}

/* What the indent is likely to cost, at the last price paid for each
   product. Only lines with a price behind them are counted: a product
   never bought before has no price to use, and standing in a zero
   would quietly understate the total. How many were left out is
   returned with it, so the screen can say so rather than imply the
   figure is complete. */
function indentEstimate(shopId, date){
  const ind = indentOf(date, shopId);
  let total = 0, priced = 0, missing = 0;
  Object.keys(ind.lines || {}).forEach(c=>{
    const q = Number(ind.lines[c]) || 0;
    if(q <= 0) return;
    const l = myLastFor(shopId, c, date);
    const rate = !l ? null
               : (l.rate !== null && l.rate !== undefined) ? l.rate
               : purchaseRate(shopId, c, l.date);
    if(rate !== null && rate !== undefined){ total += q * rate; priced++; }
    else missing++;
  });
  return { total: total, priced: priced, missing: missing };
}

function estimateLine(shopId, date){
  const e = indentEstimate(shopId, date);
  if(!e.priced && !e.missing) return '';
  return '<div class="estbar"><span class="lbl">Estimated purchase value</span>'
    + '<span class="amt">&#8377;'+money(e.total)+'</span>'
    + (e.missing ? '<span class="note2">'+e.missing+' product'+(e.missing===1?'':'s')
                   + ' not counted &mdash; no earlier price for '
                   + (e.missing===1?'it':'them')+'</span>' : '')
    + '</div>';
}

/* Last order and last price, as two cells. Blank when they have never
   had it — an empty cell says "new to you" better than a dash does. */
function myLastCells(shopId, code, date){
  const e = CAT[code] || {};
  const l = myLastFor(shopId, code, date);
  if(!l){
    return '<td class="r" style="width:150px"></td><td class="r" style="width:110px"></td>';
  }
  const qty = '<span class="mono">'+num(l.qty)+'</span> '+esc(unitPlural(e.unit, l.qty))
            + '<span class="tam">'+esc(fmtDate(l.date))+'</span>';
  /* the bill's own rate if it has been raised, otherwise what they were
     charged that day, which is the same figure before it is frozen */
  const rate = (l.rate !== null && l.rate !== undefined) ? l.rate
             : purchaseRate(shopId, code, l.date);
  const price = (rate !== null && rate !== undefined)
    ? '<span class="mono">&#8377;'+money(rate)+'</span>'
      + '<span class="tam">per '+esc(unitShort(e.unit))+'</span>'
    : '';
  return '<td class="r" style="width:150px">'+qty+'</td>'
       + '<td class="r" style="width:110px">'+price+'</td>';
}

/* The last indent this shop actually sent, whatever became of it. */
function myLastIndent(shopId, exceptDate){
  const days = Object.keys(DB.indents || {}).filter(d=>{
    if(d === exceptDate) return false;
    const ind = (DB.indents[d] || {})[shopId];
    return ind && ind.status !== 'draft' && Object.keys(ind.lines || {}).length;
  }).sort();
  return days.length ? days[days.length - 1] : '';
}

/* Most days are the same order with a couple of changes, so the day
   before is a better starting point than an empty list. Never silently:
   anything already typed today would be replaced, so that is asked. */
function myRepeatLast(){
  if(indentLocked(DATE, ROLE)) return lockedNote();
  const from = myLastIndent(ROLE, DATE);
  if(!from){ alert('There is no earlier indent to copy yet.'); return; }
  const ind = indentOf(DATE, ROLE);
  const had = Object.keys(ind.lines).length;
  if(had && !confirm('Replace what you have entered today with your indent from '
                     + fmtDate(from) + '?')) return;
  const src = DB.indents[from][ROLE].lines;
  ind.lines = {};
  Object.keys(src).forEach(c=>{ if(CAT[c] && Number(src[c]) > 0) ind.lines[c] = Number(src[c]); });
  MYONLY = true;                 /* so they can see what they just got */
  save(); render();
}

/* ---------- adding from a sheet ----------
   The shop already writes the day's list somewhere — a printed sheet
   filled in by hand, a message from the branch, a spreadsheet. Typing it
   in a second time is the part they resent, so it can be handed over
   whole: a file, or the text pasted straight in.

   Nothing is taken on trust. Every line is matched against the
   catalogue and shown for checking first — what matched, what did not,
   and what quantity is about to be set — and only what is still ticked
   when Add is pressed reaches the indent.

   A photograph cannot be read here: recognising handwriting needs a
   service this app does not talk to. Both phones can copy text out of
   a picture themselves (long press, or Google Lens), and that text
   pastes in below like anything else. */
let IMPORT = null;      /* {lines:[{raw, code, qty, ok, use}], when} */

function myImportOpen(){
  if(indentLocked(DATE, ROLE)) return lockedNote();
  IMPORT = { lines: [], text: '' }; render();
}
function myImportClose(){ IMPORT = null; render(); }

/* One line of somebody's sheet: a product and a number, in any order,
   separated by anything. The last number on the line is the quantity —
   a code at the front is not mistaken for one. */
function importLine(raw){
  const line = String(raw || '').trim();
  if(!line) return null;
  const nums = line.match(/(\d+(?:\.\d+)?)/g) || [];
  let qty = null, text = line;
  if(nums.length){
    qty = parseFloat(nums[nums.length - 1]);
    const at = line.lastIndexOf(nums[nums.length - 1]);
    text = (line.slice(0, at) + ' ' + line.slice(at + nums[nums.length - 1].length));
  }
  const found = matchProducts(text);
  return { raw: line, code: found[0] || '', also: found.slice(0, 8),
           qty: (qty === null || isNaN(qty)) ? null : qty,
           use: !!(found[0] && qty) };
}

/* What a written line could be, best first.

   The name is asked first and the code only after it, because the
   number on the line is far more often a quantity than a code —
   "Potato, 12" is twelve kilos of potato, not product 12. A number at
   the front is treated as a code only once the quantity has been taken
   off the end and nothing else on the line names a product. */
function matchProducts(text){
  const tidy = s => String(s||'').toLowerCase().replace(/[^a-z0-9஀-௿]+/g, ' ').trim();
  let t = String(text || '').trim();
  let lead = '';
  const m = t.match(/^\s*(\d{1,4}[A-Za-z]?)\b[\s,;:.|\-]*/);
  if(m && CAT[m[1]]){ lead = m[1]; t = t.slice(m[0].length); }

  const q = tidy(t);
  const out = [];
  const push = c => { if(c && CAT[c] && out.indexOf(c) < 0) out.push(c); };

  const alias = ALIAS[String(t).trim().toUpperCase()];
  if(alias) push(alias);

  if(q){
    CODES.forEach(c=>{ const e = CAT[c];
      if(e && (tidy(e.name) === q || tidy(e.tamil) === q)) push(c); });
    CODES.forEach(c=>{ const e = CAT[c]; if(!e) return;
      const n = tidy(e.name), tam = tidy(e.tamil);
      if(n.indexOf(q) === 0 || (tam && tam.indexOf(q) === 0)) push(c); });
    if(q.length > 2){
      CODES.forEach(c=>{ const e = CAT[c]; if(!e) return;
        if(tidy(e.name).indexOf(q) > -1 || tidy(e.tamil).indexOf(q) > -1) push(c); });
    }
  }
  if(lead) push(lead);            /* the code, if nothing was named */
  return out;
}

function myImportText(text){
  IMPORT = IMPORT || { lines: [], text: '' };
  IMPORT.text = text;
  IMPORT.lines = String(text || '').split(/[\r\n]+/).map(importLine).filter(Boolean);
  render();
}

function myImportFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(/\.(xlsx|xls)$/i.test(f.name)){
    alert('An Excel file cannot be read here. Open it, File → Save as → CSV, '
          + 'and choose that instead. Or copy the rows and paste them in the box below.');
    input.value = '';
    return;
  }
  const r = new FileReader();
  r.onload = ()=> myImportText(String(r.result || ''));
  r.onerror = ()=> alert('That file could not be read.');
  r.readAsText(f);
}

function myImportUse(i, on){ if(IMPORT && IMPORT.lines[i]) IMPORT.lines[i].use = !!on; render(); }
function myImportQty(i, v){
  if(!IMPORT || !IMPORT.lines[i]) return;
  const q = parseFloat(v);
  IMPORT.lines[i].qty = isNaN(q) ? null : q;
  IMPORT.lines[i].use = !!(IMPORT.lines[i].code && q > 0);
  render();
}
function myImportPick(i, code){
  if(!IMPORT || !IMPORT.lines[i]) return;
  IMPORT.lines[i].code = code;
  IMPORT.lines[i].use = !!(code && IMPORT.lines[i].qty > 0);
  render();
}

function myImportApply(){
  if(!IMPORT) return;
  if(indentLocked(DATE, ROLE)){ IMPORT = null; return lockedNote(); }
  const ind = indentOf(DATE, ROLE);
  let n = 0;
  IMPORT.lines.forEach(l=>{
    if(!l.use || !l.code || !(l.qty > 0)) return;
    ind.lines[l.code] = Number(l.qty);
    n++;
  });
  IMPORT = null;
  MYONLY = true;                /* so the whole of it can be looked over */
  save(); render();
  if(!n) alert('Nothing was ticked, so nothing was added.');
}

function vImportPanel(){
  if(!IMPORT) return '';
  const ind = indentOf(DATE, ROLE);

      + '<td>'+(e
          ? ((l.also && l.also.length > 1)

   + '<div class="bar" style="margin-bottom:10px">'
   + '<input type="file" accept=".csv,.txt,.tsv,text/plain,text/csv" onchange="myImportFile(this)">'
   + '</div>'
   + '<textarea id="myImportBox" rows="4" style="width:100%" placeholder="or paste the list here" '
   + 'oninput="myImportText(this.value)">'+esc(IMPORT.text||'')+'</textarea>'
   + (IMPORT.lines.length
      ? '<div class="twrap" style="margin-top:12px"><table><thead><tr><th class="c">Add</th>'
        + '<th>Your line</th><th>Matched to</th><th class="c">Quantity</th></tr></thead>'
        + '<tbody>'+rows+'</tbody></table></div>'
        + (miss ? '<p class="sub" style="margin:10px 0 0">'+miss+' line'+(miss===1?'':'s')
                  + ' could not be matched to a product and will be left out. Add those by hand '
                  + 'from the list below.</p>' : '')
      : '')
   + '<div class="bar" style="margin-top:12px">'
   + '<button class="btn pri" onclick="myImportApply()"'+(ok?'':' disabled')+'>Add '+ok+' to my indent</button>'
   + '<button class="btn sm" onclick="myImportClose()">Cancel</button>'
   + '</div></div></div>';
}

/* What the shop is looking at: neither belongs in the saved indent, so
   both live here and are re-applied after every render. */
let MYFILT = '', MYONLY = false;

function myFind(v){ MYFILT = v; myApplyFilter(); }
function myOnlyChosen(){ MYONLY = !MYONLY; render(); }

/* Done by hiding rows rather than by re-rendering, so the box being
   typed into keeps the cursor. */
function myApplyFilter(){
  const list = document.getElementById('mylist');
  if(!list) return;
  const q = String(MYFILT || '').toLowerCase().trim();
  const shown = {};
  const rows = list.querySelectorAll('tbody tr[data-k]');
  for(let i = 0; i < rows.length; i++){
    const tr = rows[i];
    const ok = (!q || tr.getAttribute('data-k').indexOf(q) > -1)
            && (!MYONLY || tr.hasAttribute('data-has'));
    tr.style.display = ok ? '' : 'none';
    if(ok) shown[tr.getAttribute('data-grp')] = true;
  }
  /* a heading with nothing under it is just noise */
  const heads = list.querySelectorAll('tbody tr.vgrp');
  for(let i = 0; i < heads.length; i++){
    heads[i].style.display = shown[heads[i].getAttribute('data-grp')] ? '' : 'none';
  }
}
function myQty(code, v){
  if(indentLocked(DATE, ROLE)) return lockedNote();
  const ind = indentOf(DATE, ROLE);
  const q = parseFloat(v)||0;
  if(q<=0) delete ind.lines[code]; else ind.lines[code]=q;
  save(); render();
}
function myDel(code){
  if(indentLocked(DATE, ROLE)) return lockedNote();
  const ind = indentOf(DATE, ROLE); delete ind.lines[code]; save(); render();
}

/* Said once, the same way, wherever something is refused because the
   indent is closed. */
function lockedNote(){
  alert('This indent has been accepted by ' + VELORA + ' and can no longer be changed.');
  render();
}
function submitIndent(){
  if(indentLocked(DATE, ROLE)) return lockedNote();
  const ind = indentOf(DATE, ROLE);
  const w = windowState();
  if(w==='closed'){ alert('The indent window is closed.'); return; }
  ind.status = 'submitted';
  ind.submittedAt = new Date().toISOString();
  ind.late = (w==='late');
  save(); render();
}

/* product search (shared) */
function searchList(term){
  const t = (term||'').trim().toLowerCase();
  if(!t) return [];
  const out = [];
  for(let i=0;i<CODES.length && out.length<40;i++){
    const e = CAT[CODES[i]];
    if(e.code.indexOf(t)===0 || e.name.toLowerCase().indexOf(t)>=0 || e.tamil.indexOf(term.trim())>=0
       || (e.alias && e.alias.indexOf(t)===0)) out.push(e);
  }
  return out;
}
function wireSearch(onPick){
  const q = document.getElementById('q'), sug = document.getElementById('sug');
  if(!q) return;
  let hi = -1, list = [];
  function close(){ sug.style.display='none'; hi=-1; }
  function draw(){
    list = searchList(q.value);
    if(!list.length){ close(); return; }
    sug.innerHTML = list.map((e,i)=>'<div class="'+(i===hi?'hi':'')+'" data-c="'+e.code+'"><span class="mono">'+esc(e.code)+'</span> &nbsp;'+esc(e.name)+' <span style="color:var(--ink-4)">'+esc(e.tamil)+'</span></div>').join('');
    sug.style.display='block';
    Array.prototype.forEach.call(sug.children, el=>{
      el.onmousedown = ev=>{ ev.preventDefault(); onPick(el.getAttribute('data-c')); };
    });
  }
  q.oninput = draw;
  q.onblur = ()=> setTimeout(close, 150);
  q.onkeydown = ev=>{
    if(ev.key==='ArrowDown'){ hi=Math.min(hi+1,list.length-1); draw(); ev.preventDefault(); }
    else if(ev.key==='ArrowUp'){ hi=Math.max(hi-1,0); draw(); ev.preventDefault(); }
    else if(ev.key==='Enter'){
      const pick = hi>=0 ? list[hi] : (list.length?list[0]:null);
      if(pick){ onPick(pick.code); ev.preventDefault(); }
    } else if(ev.key==='Escape') close();
  };
  q.focus();
}

/* ============================================================
   SHOP — deliveries & bills
   ============================================================ */
function vMyDeliveries(){
  const day = dayOf(DATE); const st = day.ship[ROLE] || '';
  const packed = day.packed[ROLE] || {};
  const codes = Object.keys(packed).filter(c=>packed[c]>0);
  if(st!=='out' && st!=='received')
    return '<h2>Deliveries</h2><p class="sub">'+fmtDate(DATE)+' &middot; '
      + statusPill(indentOf(DATE, ROLE).status)+'</p>'
      + '<div class="card"><div class="empty">Nothing has left for you yet. This fills in as '
      + 'soon as it is out for delivery.</div></div>';

  /* the rate for these lines is not on this device — ask for it once */
  askRates(ROLE, DATE, codes);

  const ind = indentOf(DATE, ROLE);

  /* What came as asked stays where it is; what is short or over sinks to
     the bottom, so the lines needing a word with the office are together
     at the end of the note instead of scattered through it. A product
     that was never indented is not a mismatch — it came as a bonus and
     stays in its place, the same as on the packing list. */
  const delState = c => {
    const want = Number(ind.lines[c]) || 0;
    const got  = Number(packed[c]) || 0;
    if(!want) return 'extra';
    if(got === want) return 'done';
    return got < want ? 'short' : 'over';
  };
  const DRANK = { done: 0, extra: 0, short: 1, over: 1 };
  codes.sort((a,b)=> DRANK[delState(a)] - DRANK[delState(b)]);

  let rows='', tot=0, unpriced=0, off=0;
  codes.forEach((c,i)=>{
    const e=CAT[c], q=packed[c], nk=netKg(c,q,e.unit);
    const pr = purchaseRate(ROLE, c);
    /* a rate that is not in yet is said to be missing. Nothing here is
       worth nothing, and a zero on a delivery note reads as free. */
    const priced = (pr !== null && pr !== undefined);
    const amt = priced ? nk*pr : 0;
    if(priced) tot += amt; else unpriced++;

    /* what they asked for against what came. Only a difference is worth
       a word: a line that came as ordered needs nothing said about it. */
    const want = Number(ind.lines[c]) || 0;
    const state = delState(c);
    const flag = { extra: '<span class="pill p-blue">Not indented</span>',
                   over:  '<span class="pill p-blue">Over packed</span>',
                   short: '<span class="pill p-amber">Short packed</span>',
                   done:  '' }[state];
    if(DRANK[state]) off++;

    rows+='<tr><td class="c mono">'+(i+1)+'</td><td>'+esc(e.name)+'<span class="tam">'+esc(e.tamil)+'</span></td>'
      +'<td class="c mono" style="color:var(--ink-3)">'+(want?num(want)+' '+esc(e.unit):'&mdash;')+'</td>'
      +'<td class="c mono">'+num(q)+' '+esc(e.unit)+'</td><td class="r mono">'+num(nk,3)+'</td>'
      +'<td class="r mono">'+(priced?money(pr):'<span style="color:var(--ink-4)">rate not set</span>')+'</td>'
      +'<td class="r mono">'+(priced?money(amt):'&mdash;')+'</td>'
      +'<td class="c">'+flag+'</td>'
      +'<td class="r"><button class="btn sm" onclick="delEdit(\''+c+'\')">Edit</button></td></tr>';
  });
  return '<h2>Delivery for '+fmtDate(DATE)+'</h2>'
   /* the state of the day in the same words the office uses, so a shop
      can see at a glance that the lorry has left */
   +'<p class="sub">'+statusPill(st==='received'?'received':'shipped')
   +' &middot; check the weights against the crates, then confirm.</p>'
   +(st==='received'?'<div class="note" style="background:#e6f4ec;border-color:#bfe0cd;color:#14663f">Received and confirmed. The invoice can now be raised.</div>'
     :'<div class="note">If a weight or product differs, tell Velora Fresh before confirming — they will adjust it and send it again.</div>')
   +'<div class="card"><table><thead><tr><th class="c">#</th><th>Product</th>'
   +'<th class="c">Indent</th><th class="c">Delivered</th><th class="r">Net kg</th>'
   +'<th class="r">Rate/kg</th><th class="r">Amount</th><th class="c">Status</th><th></th></tr></thead>'
   +'<tbody>'+(rows||'<tr><td colspan="9" class="empty">No lines.</td></tr>')+'</tbody></table></div>'
   +(off ? '<div class="bar"><span class="sub" style="margin:0">'+off+' product'+(off===1?'':'s')
           + ' did not come as asked &mdash; short or over. They are at the bottom of the '
           + 'list.</span></div>' : '')
   +'<div class="bar"><span class="sub" style="margin:0">Total <strong class="mono">&#8377;'+money(tot)+'</strong>'
   +(unpriced ? ' <span style="color:var(--ink-3)">&middot; '+unpriced+' line'+(unpriced===1?'':'s')
                + ' not priced yet</span>' : '')+'</span><span class="spacer"></span>'
   +(st==='out'?'<button class="btn pri" onclick="confirmReceipt(\''+ROLE+'\')">Confirm receipt</button>':'')+'</div>';
}
/* The button is on every line as asked; what it opens is not decided
   yet, so it says so rather than doing something half thought out. */
function delEdit(code){
  const e = CAT[code] || {};
  alert('Telling ' + VELORA + ' what to do about ' + (e.name || code)
        + ' is not built yet.\n\nFor now, call the office \u2014 they can change the packed '
        + 'quantity and send it again.');
}

function vMyBills(){
  const mine = settled().filter(b=>b.shopId===ROLE);
  const outstanding = mine.reduce((t,b)=>t+b.due, 0);
  const rows = mine.slice().reverse().map(b=>{
    const pill = b.state==='cleared' ? '<span class="pill p-green">Cleared</span>'
               : b.state==='part' ? '<span class="pill p-amber">Part paid</span>'
               : '<span class="pill p-grey">Open</span>';
    return '<tr><td class="mono">'+esc(b.no)+'</td><td>'+fmtDate(b.date)+'</td>'
      +'<td class="r mono">&#8377;'+money(b.amount)+'</td><td>'+pill+'</td></tr>';
  });
  return '<h2>Bills</h2><p class="sub">'+esc(shopById(ROLE).name)+'</p>'
   +'<div class="kpi"><div><div class="lb">Bills raised</div><div class="vl mono">'+mine.length+'</div></div>'
   +'<div><div class="lb">Outstanding</div><div class="vl mono" style="'+(outstanding>0?'color:#8c2020':'color:#14663f')+'">&#8377;'+money(outstanding)+'</div></div></div>'
   +'<div class="card"><table><thead><tr><th>Bill no</th><th>Date</th><th class="r">Amount</th><th>Status</th></tr></thead>'
   +'<tbody>'+(rows.join('')||'<tr><td colspan="4" class="empty">No bills yet.</td></tr>')+'</tbody></table></div>';
}

/* ============================================================
   ADMIN — day board
   ============================================================ */
function statusPill(s, late){
  const map = {draft:['p-grey','Not submitted'], submitted:['p-blue','Submitted &middot; waiting for review'],
               accepted:['p-green','Accepted by '+VELORA],
               packed:['p-amber','Packed'], shipped:['p-blue','Out for delivery'], received:['p-green','Received'], billed:['p-green','Billed']};
  const m = map[s] || map.draft;
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>'+(late?' <span class="pill p-red">Late</span>':'');
}
function shopStatus(shopId){
  const day = dayOf(DATE);
  /* a draft is not a bill: the day is not billed until it is saved */
  const bill = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(bill && bill.saved) return 'billed';
  if(day.ship[shopId]==='received') return 'received';
  if(day.ship[shopId]==='out') return 'shipped';
  const ind = indentOf(DATE, shopId);
  const packed = day.packed[shopId] || {};
  if(Object.keys(packed).length) return 'packed';
  return ind.status;
}
function vBoard(){
  const day = dayOf(DATE);
  let tiles='', totVal=0, totLines=0, indented=0, supplied=0;
  SHOPS.forEach(s=>{
    const ind = indentOf(DATE, s.id);
    const packed = day.packed[s.id]||{};
    let val=0, n=0;
    Object.keys(packed).forEach(c=>{
      const q=packed[c]; if(!q) return;
      n++; const pr=purchaseRate(s.id,c); if(pr!==null) val += netKg(c,q,CAT[c].unit)*pr;
    });
    totVal+=val; totLines+=n;
    indented += Object.keys(ind.lines).filter(c=>ind.lines[c]>0).length;
    supplied += n;
    const st = shopStatus(s.id);
    tiles += '<div class="tile t-'+st+'" onclick="openShop(\''+s.id+'\')">'
      + '<div class="nm">'+esc(s.name)+'</div>'
      + '<div class="big mono">'+(val?'&#8377;'+money(val):'&mdash;')+'</div>'
      + '<div class="sub" style="margin:0 0 7px">'+Object.keys(ind.lines).length+' indented &middot; '+n+' packed</div>'
      + statusPill(st, ind.late) + '</div>';
  });
  const fill = indented ? Math.round(supplied/indented*100) : 0;
  return '<h2>Day board</h2><p class="sub">'+fmtDate(DATE)+' &middot; '+esc(CLIENT)+'</p>'
   + '<div class="kpi">'
   + '<div><div class="lb">Day value</div><div class="vl mono">&#8377;'+money(totVal)+'</div></div>'
   + '<div><div class="lb">Products packed</div><div class="vl mono">'+totLines+'</div></div>'
   + '<div><div class="lb">Rates entered</div><div class="vl mono">'+Object.keys(day.rates).filter(c=>day.rates[c]!=='').length+' / '+uniqueCodes(DATE).length+'</div></div>'
   + '<div><div class="lb">Fill rate</div><div class="vl mono">'+fill+'%</div></div>'
   + '</div><div class="grid">'+tiles+'</div>';
}
function openShop(id){ PACKSHOP = id; go('pack'); }

/* ============================================================
   ADMIN — indents (cut & accept)
   ============================================================ */
let OPENIND = null;
function vIndents(){
  if(OPENIND) return vIndentOne(OPENIND);
  let rows='';
  SHOPS.forEach(s=>{
    const ind = indentOf(DATE, s.id);
    const n = Object.keys(ind.lines).filter(c=>ind.lines[c]>0).length;
    rows += '<tr><td>'+esc(s.name)+'</td><td class="c mono">'+n+'</td>'
      + '<td>'+statusPill(ind.status, ind.late)+'</td>'
      /* One button, always the same one. Dead until the shop has sent
         something: there is nothing to review, and a button that opens
         an empty screen teaches people to distrust it. */
      + '<td class="r"><button class="btn sm'
      + (ind.status==='submitted' ? ' pri' : '')
      + (ind.status==='draft' ? '" disabled title="This shop has not submitted an indent yet' : '')
      + '" onclick="OPENIND=\''+s.id+'\';render()">'
      + (indentLocked(DATE, s.id) ? 'View' : 'Review &amp; accept')+'</button></td></tr>';
  });
  /* A shop submits for the day it is ordering for, which is not always
     the day this screen happens to be showing — and an empty list then
     reads as "nothing has come in" when in fact it has. */
  let elsewhere = '';
  const waiting = {};
  Object.keys(DB.indents || {}).forEach(d=>{
    if(d === DATE) return;
    Object.keys(DB.indents[d] || {}).forEach(sid=>{
      if((DB.indents[d][sid] || {}).status === 'submitted') waiting[d] = (waiting[d]||0) + 1;
    });
  });
  const wdays = Object.keys(waiting).sort();
  if(wdays.length){
    elsewhere = '<div class="note" style="background:var(--blue-soft);border-color:#c4d8ee;'
      + 'color:var(--blue)">Waiting on '+(wdays.length===1?'another day':'other days')+': '
      + wdays.map(d=>'<a href="#" onclick="setDate(\''+d+'\');return false"><b>'+esc(fmtDate(d))
                     + '</b></a> ('+waiting[d]+')').join(' &middot; ')
      + '</div>';
  }

  return '<h2>Indents</h2><p class="sub">'+fmtDate(DATE)+' &middot; cut what is not needed, then accept</p>'
   + elsewhere
   + '<div class="card"><table><thead><tr><th>Shop</th><th class="c">Products</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function vIndentOne(id){
  const s = shopById(id), ind = indentOf(DATE, id);
  const codes = Object.keys(ind.lines);
  const editable = !indentLocked(DATE, id);
  let rows='';
  codes.forEach(c=>{
    const e=CAT[c]; if(!e) return;
    /* the office sees exactly what the shop saw when it was written:
       what they last had, what it cost, and what they are asking for */
    rows += '<tr><td class="mono" style="width:58px">'+esc(c)+'</td><td>'+esc(e.name)+'<span class="tam">'+esc(e.tamil)+'</span></td>'
      + myLastCells(id, c, DATE)
      + '<td class="c" style="width:150px">'
      + (editable?'<input type="number" min="0" step="any" class="row-inp mono" value="'+ind.lines[c]+'" onchange="adminQty(\''+id+'\',\''+c+'\',this.value)"> <span style="font-size:12px;color:var(--ink-3)">'+esc(e.unit)+'</span>'
                 :'<span class="mono">'+num(ind.lines[c])+' '+esc(e.unit)+'</span>')
      + '</td><td class="c" style="width:44px">'
      + (editable?'<button class="rm" title="Remove" onclick="adminQty(\''+id+'\',\''+c+'\',0)">&times;</button>':'')+'</td></tr>';
  });
  return '<div class="bar"><button class="btn sm" onclick="OPENIND=null;render()">&larr; All indents</button></div>'
   + '<h2>'+esc(s.name)+'</h2><p class="sub">Indent for '+fmtDate(DATE)+' &middot; '+statusPill(ind.status, ind.late)+'</p>'
   + (ind.late?'<div class="note">This indent was submitted late.</div>':'')
   /* closed means closed for the office too — the screen says so rather
      than showing boxes that would be refused */
   + (editable ? '' :
      '<div class="note" style="background:var(--green-soft);border-color:#bfe0cd;color:var(--green)">'
      + '<b>Accepted by '+esc(VELORA)+'.</b> '
      + (ind.acceptedBy ? esc(ind.acceptedBy) : 'Accepted')
      + (ind.acceptedAt ? ' on '+esc(fmtDate(ind.acceptedAt.slice(0,10)))
                        + ' at '+esc(ind.acceptedAt.slice(11,16)) : '')
      + '. This is the record of what was ordered; it cannot be changed, here or at the '
      + 'shop.</div>')
   + estimateLine(id, DATE)
   + '<div class="card"><table><thead><tr><th>Code</th><th>Product</th>'
   + '<th class="r">Last order</th><th class="r">Last price</th>'
   + '<th class="c">Quantity</th><th></th></tr></thead>'
   + '<tbody>'+(rows||'<tr><td colspan="6" class="empty">Nothing indented.</td></tr>')+'</tbody></table></div>'
   + '<div class="bar"><span class="spacer"></span>'
   + (editable && ind.status==='submitted' && ROLE!=='ho'
      ? '<button class="btn pri" onclick="acceptIndent(\''+id+'\')">Accept indent</button>' : '')
   + '</div>';
}
function adminQty(shopId, code, v){
  /* the office is not an exception: once it is accepted it is the
     record, and the database refuses the change as well */
  if(indentLocked(DATE, shopId)){
    alert('This indent has been accepted and is closed. It cannot be changed.');
    render(); return;
  }
  const ind = indentOf(DATE, shopId);
  const q = parseFloat(v)||0;
  if(q<=0) delete ind.lines[code]; else ind.lines[code]=q;
  save(); render();
}
function acceptIndent(shopId){
  const ind = indentOf(DATE, shopId);
  if(ind.status !== 'submitted' && ind.status !== 'draft'){
    alert('That indent has already been accepted.'); render(); return;
  }
  const sh = shopById(shopId);
  const n = Object.keys(ind.lines).filter(c=>ind.lines[c] > 0).length;
  /* the last chance to look: after this nobody can change it */
  if(!confirm('Accept ' + (sh ? sh.name : shopId) + '\u2019s indent \u2014 ' + n + ' product'
              + (n===1?'':'s') + '?\n\nIt is closed after this. Neither the shop nor the office '
              + 'can change it, and the vendor orders are built from it.')) return;
  ind.status = 'accepted';
  ind.acceptedAt = new Date().toISOString();
  /* who closed it, in the words the shop will read. Either of them may
     accept and either is final, so the record has to say which. */
  ind.acceptedBy = (ME && ME.full_name)
    ? ME.full_name + ' (' + (ROLE === 'owner' ? 'Owner' : 'Manager') + ')'
    : (ROLE === 'owner' ? 'Owner' : 'Manager');
  save(); OPENIND=null; render();
}

/* ============================================================
   ADMIN — rates (unique products, clubbed by group/vendor later)
   ============================================================ */
function vRates(){
  const day = dayOf(DATE);
  const codes = uniqueCodes(DATE);
  const need = dayRequirement(DATE);
  if(!codes.length) return '<h2>Rates</h2><p class="sub">'+fmtDate(DATE)+'</p><div class="card"><div class="empty">No accepted indents for this date yet.</div></div>';
  const yest = prevRates(DATE);
  const byGroup = {};
  codes.forEach(c=>{ const g=groupOf(c); (byGroup[g]=byGroup[g]||[]).push(c); });
  const gnames = Object.keys(byGroup).sort((a,b)=>{
    if(a===UNGROUPED) return 1; if(b===UNGROUPED) return -1;
    return GROUPNAMES.indexOf(a)-GROUPNAMES.indexOf(b);
  });
  let rows='';
  gnames.forEach(g=>{
   const vn = (DB.vendors[g] && DB.vendors[g].name) || g;
   rows += '<tr class="vgrp"><td colspan="4">'+esc(vn)
     + ' &nbsp;<span style="font-weight:400;color:var(--ink-3)">'+byGroup[g].length
     + ' product'+(byGroup[g].length===1?'':'s')+'</span></td></tr>';
   byGroup[g].forEach(c=>{
    const e=CAT[c]; if(!e) return;
    const r = day.rates[c];
    const y = yest[c];
    let hint='';
    if(y!==undefined && y!==null && y!==''){
      if(r!==undefined && r!=='' && r!==null){
        const ch = ((parseFloat(r)-parseFloat(y))/parseFloat(y))*100;
        hint = 'y\'day &#8377;'+money(y)+(Math.abs(ch)>=15?' &middot; '+(ch>0?'+':'')+Math.round(ch)+'%':'');
      } else hint = 'y\'day &#8377;'+money(y);
    }
    const big = (y && r && Math.abs((parseFloat(r)-parseFloat(y))/parseFloat(y))>=0.15);
    /* what was actually bought from the vendor, so the rate is entered
       against the quantity on the bill rather than from memory */
    const bought = orderQty(DATE, c, (need[c] ? need[c].total : 0));
    rows += '<tr><td class="mono" style="width:58px">'+esc(c)+'</td>'
      + '<td>'+esc(e.name)+'<span class="tam">'+esc(e.tamil)+(hint?' &middot; '+hint:'')+'</span></td>'
      + '<td class="r mono" style="width:96px">'+(bought?num(bought):'&mdash;')
      + ' <span style="font-size:11.5px;color:var(--ink-4)">'+esc(e.unit)+'</span></td>'
      + '<td class="c" style="width:130px"><input type="number" min="0" step="any" class="row-inp mono" '
      + (big?'style="border-color:#e0a92c;background:#fdf9ef"':'')
      + ' data-rate="'+esc(c)+'"'
      + ' value="'+(RATEDRAFT[c]!==undefined ? esc(RATEDRAFT[c]) : (r===undefined||r===null?'':r))+'"'
      + ' oninput="rateDraft(\''+c+'\',this.value)"></td></tr>';
   });
  });
  const done = codes.filter(c=>day.rates[c]!==undefined && day.rates[c]!=='').length;
  const pend = Object.keys(RATEDRAFT).length;
  return '<h2>Rates &mdash; '+fmtDate(DATE)+'</h2>'
   + '<p class="sub">Market rate per kg, same for every shop. '+done+' of '+codes.length+' entered, grouped by vendor bill.</p>'
   + rateNoteHtml()
   /* nothing typed here reaches another screen until this is pressed */
   + '<div class="bar"><button class="btn pri" id="rateApply" onclick="applyRates()"'
   + (pend?'':' disabled')+'>'+(pend?('Update '+pend+' rate'+(pend===1?'':'s')):'Update rates')+'</button>'
   + '<span class="sub" id="rateCount" style="margin:0">'
   + (pend ? pend+' changed, not yet saved' : 'No changes to update')+'</span>'
   + '<span class="spacer"></span></div>'
   + '<div class="card"><table><thead><tr><th>Code</th><th>Product</th>'
   + '<th class="r">Buying</th><th class="c">Market &#8377;/kg</th></tr></thead>'
   + '<tbody>'+rows+'</tbody></table></div>';
}
/* Setting one rate outright. The screen no longer works this way — see
   rateDraft below — but a rate arriving from anywhere else, or from a
   test, still has one door to go through. */
function setRate(code, v){
  const day = dayOf(DATE);
  if(v==='' || v===null) delete day.rates[code]; else day.rates[code] = parseFloat(v)||0;
  save(); render();
}

/* Typing a rate no longer writes it. The morning's rates are read off a
   vendor's bill one after another, and a half-entered list going out to
   every screen as it is typed is how a shop ends up billed at a number
   nobody meant. They are held until Update is pressed, and then they go
   together — all of them or none. */
let RATEDRAFT = {};      /* code -> what has been typed but not applied */
let RATENOTE = '';       /* what to say about the last attempt */

function rateDraft(code, v){
  const day = dayOf(DATE);
  const now = day.rates[code];
  const same = (v === '' || v === null)
    ? (now === undefined || now === '' || now === null)
    : (parseFloat(v) === parseFloat(now));
  if(same) delete RATEDRAFT[code]; else RATEDRAFT[code] = v;
  paintRateBar();
}

/* The button and the count are repainted on their own, so the box being
   typed in keeps the cursor and the list does not jump. */
function paintRateBar(){
  const n = Object.keys(RATEDRAFT).length;
  const btn = document.getElementById('rateApply');
  const lbl = document.getElementById('rateCount');
  if(btn){
    btn.disabled = !n;
    btn.textContent = n ? ('Update ' + n + ' rate' + (n===1?'':'s')) : 'Update rates';
  }
  if(lbl) lbl.textContent = n ? (n + ' changed, not yet saved') : 'No changes to update';
  document.querySelectorAll('#main input[data-rate]').forEach(inp=>{
    inp.classList.toggle('dirty', RATEDRAFT[inp.getAttribute('data-rate')] !== undefined);
  });
}

async function applyRates(){
  const codes = Object.keys(RATEDRAFT);
  if(!codes.length) return;
  const day = dayOf(DATE);
  /* taken all at once, so a failure leaves the day as it was rather than
     half a vendor's bill */
  const before = Object.assign({}, day.rates);
  codes.forEach(c=>{
    const v = RATEDRAFT[c];
    if(v === '' || v === null) delete day.rates[c]; else day.rates[c] = parseFloat(v) || 0;
  });
  RATEDRAFT = {};
  save();
  RATENOTE = 'saving';
  render();
  try{
    if(typeof VFSync !== 'undefined' && VFSync.enabled()) await VFSync.push();
    RATENOTE = (typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.queueLength())
      ? 'queued' : 'ok';
  }catch(e){
    day.rates = before;         /* nothing half applied */
    save();
    RATENOTE = 'failed:' + (e.message || e);
  }
  render();
}

function rateNoteHtml(){
  if(!RATENOTE) return '';
  if(RATENOTE === 'saving') return '';
  if(RATENOTE === 'ok'){
    return '<div class="note" style="background:var(--green-soft);border-color:#bfe0cd;'
      + 'border-left-color:var(--green);color:var(--green)">Market rates updated successfully.</div>';
  }
  if(RATENOTE === 'queued'){
    return '<div class="note">Market rates saved on this device. The connection is down, so they '
      + 'will reach the other screens as soon as it is back.</div>';
  }
  return '<div class="note" style="background:var(--red-soft);border-color:#f2d3d1;'
    + 'border-left-color:var(--red);color:var(--red)">Could not save the rates, so nothing was '
    + 'changed: ' + esc(RATENOTE.slice(7)) + '</div>';
}
function prevRates(date){
  const ds = Object.keys(DB.days).filter(d=>d<date).sort();
  return ds.length ? (DB.days[ds[ds.length-1]].rates||{}) : {};
}

/* ============================================================
   ADMIN — packing (per shop quantities)
   ============================================================ */
let PACKSHOP = null;
function vPack(){
  const day = dayOf(DATE);
  if(!PACKSHOP) PACKSHOP = SHOPS[0].id;
  const s = shopById(PACKSHOP);
  const ind = indentOf(DATE, PACKSHOP);
  day.packed[PACKSHOP] = day.packed[PACKSHOP] || {};
  const packed = day.packed[PACKSHOP];

  const codes = [];
  Object.keys(ind.lines).forEach(c=>{ if(ind.lines[c]>0) codes.push(c); });
  Object.keys(packed).forEach(c=>{ if(codes.indexOf(c)<0) codes.push(c); });

  /* What was asked for against what was packed. What agrees stays where
     it is; what does not sinks, and what has no figure at all sinks
     below that — nothing was bought for it. Everything needing a second
     look ends up together at the bottom, in the order it needs looking
     at. */
  const packState = c => {
    const want = Number(ind.lines[c]) || 0;
    const got  = packed[c];
    if(got === undefined || got === null || got === '') return 'none';
    const g = Number(got) || 0;
    if(!want) return 'extra';                 /* packed but never indented */
    if(g === want) return 'done';
    return g < want ? 'short' : 'over';
  };
  const RANK = { done: 0, extra: 0, short: 1, over: 1, none: 2 };
  codes.sort((a,b)=> RANK[packState(a)] - RANK[packState(b)]);

  let rows='', tot=0, off=0;
  codes.forEach(c=>{
    const e=CAT[c]; if(!e) return;
    const state = packState(c);
    if(RANK[state]) off++;
    const pr = purchaseRate(PACKSHOP, c);
    const q  = packed[c];
    const has = q!==undefined && q!==null && q!=='' && parseFloat(q)>0;
    const nk = has ? netKg(c,q,e.unit) : 0;
    const amt = (has && pr!==null) ? nk*pr : 0;
    tot += amt;
    const extra = (state === 'extra');
    const skipped = (q!==undefined && parseFloat(q)===0);
    /* A line that agrees with the indent says nothing. Only what needs
       attention is labelled, so the labels mean something. */
    const flag = {
      done:  '',
      extra: '',
      short: '<span class="pill p-amber">Short packed</span>',
      over:  '<span class="pill p-blue">Over packed</span>',
      none:  '<span class="pill p-red">Not bought</span>',
    }[state] || '';
    rows += '<tr class="'+(skipped?'skipped':'')+'">'
      + '<td class="mono" style="width:58px">'+esc(c)+'</td>'
      + '<td>'+esc(e.name)+(flag?' '+flag:'')
      + '<span class="tam">'+esc(e.tamil)+(extra?' &middot; not indented':'')+'</span></td>'
      + '<td class="c mono" style="width:88px;color:var(--ink-3)">'+(ind.lines[c]>0?num(ind.lines[c])+' '+esc(e.unit):'&mdash;')+'</td>'
      + '<td class="c" style="width:120px"><input type="number" min="0" step="any" class="row-inp mono" value="'+(q===undefined?'':q)+'" onchange="setPacked(\''+c+'\',this.value)"></td>'
      + '<td class="r mono" style="width:82px">'+(has ? (nk>0?num(nk,3):'<span style="color:#a33">no weight</span>') : '&mdash;')+'</td>'
      + '<td class="r mono" style="width:92px">'+(pr!==null?money(pr):'<span style="color:#a33">no rate</span>')+'</td>'
      + '<td class="r mono" style="width:104px">'+(amt?money(amt):'&mdash;')+'</td></tr>';
  });

  const st = shopStatus(PACKSHOP);
  const canShip = (st==='packed');
  return '<h2>Packing &mdash; '+fmtDate(DATE)+'</h2>'
   + '<p class="sub">Enter what the vendor actually packed. 0 means the vendor left it. Blank means not handled yet.</p>'
   + '<div class="bar">'+SHOPS.map(x=>'<button class="btn sm'+(x.id===PACKSHOP?' pri':'')+'" onclick="PACKSHOP=\''+x.id+'\';render()">'+esc(x.name)+'</button>').join('')+'</div>'
   + '<div class="bar"><div class="srch"><input type="text" id="q" placeholder="Add a product this shop did not indent" autocomplete="off"><div class="sug" id="sug"></div></div>'
   + '<span class="spacer"></span><span class="sub" style="margin:0">'+statusPill(st, ind.late)+'</span></div>'
   + (ind.status==='draft' || ind.status==='submitted'
      ? '<div class="note">This shop\'s indent has not been accepted yet. Accept it on the Indents tab first.</div>' : '')
   + '<div class="card"><table><thead><tr><th>Code</th><th>Product</th><th class="c">Indent</th><th class="c">Packed</th><th class="r">Net kg</th><th class="r">Rate/kg</th><th class="r">Amount</th></tr></thead>'
   + '<tbody>'+(rows||'<tr><td colspan="7" class="empty">Nothing to pack for this shop.</td></tr>')+'</tbody></table></div>'
   + (off ? '<div class="bar"><span class="sub" style="margin:0">'+off+' product'+(off===1?'':'s')
            + ' still to settle &mdash; short, over or not bought. They are at the bottom of '
            + 'the list.</span></div>' : '')
   + '<div class="bar"><span class="sub" style="margin:0">Total <strong class="mono">&#8377;'+money(tot)+'</strong></span>'
   + '<span class="spacer"></span>'
   + '<button class="btn pri" onclick="markOut(\''+PACKSHOP+'\')"'+(canShip?'':' disabled')+'>Out for delivery</button></div>';
}
function setPacked(code, v){
  const day = dayOf(DATE);
  day.packed[PACKSHOP] = day.packed[PACKSHOP] || {};
  if(v===''||v===null) delete day.packed[PACKSHOP][code];
  else day.packed[PACKSHOP][code] = parseFloat(v)||0;
  save(); render();
}
function addExtra(code){
  const day = dayOf(DATE);
  day.packed[PACKSHOP] = day.packed[PACKSHOP] || {};
  if(day.packed[PACKSHOP][code]===undefined) day.packed[PACKSHOP][code] = 0;
  save(); render();
}
function markOut(shopId){
  const day = dayOf(DATE);
  day.ship[shopId] = 'out';
  save(); render();
  const sh = shopById(shopId);
  const packed = day.packed[shopId] || {};
  let t = 'Velora Fresh \u00b7 out for delivery\n'
        + sh.name + ' \u00b7 ' + fmtDate(DATE) + '\n'
        + '--------------------\n';
  Object.keys(packed).forEach(c=>{
    const q = packed[c]; if(!q) return;              /* skipped on quality */
    const e = CAT[c]; if(!e) return;
    t += e.name + '  ' + num(q,2) + ' ' + e.unit + '\n';
  });
  t += '--------------------\nPlease check against the crates and confirm.';
  waSend(sh.phone, t, sh.name + ' manager');
}

let INVSHOP = null;

/* every bill that has been saved, newest first */
function savedInvoices(){
  const out = [];
  Object.keys(DB.invoices || {}).forEach(d=>{
    Object.keys(DB.invoices[d] || {}).forEach(sh=>{
      const inv = DB.invoices[d][sh];

    });
  });
  out.sort((a,b)=> a.date === b.date ? a.shopId.localeCompare(b.shopId)
                                     : (a.date < b.date ? 1 : -1));
  return out;
}

/* opening one from the file moves the whole app to its day, or the
   screen would show a bill from July beside today's rates */
function openInvoice(date, shopId){
  DATE = date; INVSHOP = shopId; writeHash(); render();
}

function makeInvoice(shopId){
  const day = dayOf(DATE);
  const packed = day.packed[shopId] || {};
  const lines = [];
  Object.keys(packed).forEach(c=>{
    const q = parseFloat(packed[c])||0;
    if(q<=0) return;                       /* skipped lines never reach the invoice */
    const e = CAT[c]; if(!e) return;
    const pr = purchaseRate(shopId, c);
    if(pr===null) return;
    const nk = netKg(c,q,e.unit);
    lines.push({code:c, name:e.name, tamil:e.tamil, unit:e.unit, qty:q, net:nk,
                rate:pr, amount:nk*pr, sell:sellingPrice(shopId,c)});
  });
  lines.sort((a,b)=>(parseInt(a.code)||0)-(parseInt(b.code)||0));
  if(!lines.length){ alert('Nothing priced to invoice for this shop.'); return; }
  const bad = lines.filter(l=>!(l.net>0));
  if(bad.length){
    alert('These products have no unit weight set, so they would bill as zero:\n\n'
      + bad.map(l=>'  '+l.code+'  '+l.name).join('\n')
      + '\n\nSet the weight in the product list, or change the quantity, then generate again.');
    return;
  }
  const total = lines.reduce((s,l)=>s+l.amount,0);
  DB.invoices[DATE] = DB.invoices[DATE] || {};
  /* A draft. It carries no bill number: the number is issued when the
     bill is saved, so a draft that is thought better of and thrown away
     does not leave a hole in the run of numbers. */
  const inv = {no:'', saved:false, date:DATE, shopId, lines, total,
               roundOff: Math.round(total)-total,
               contactId:'', vehicle:'', driver:'', place:'', supplyDate:DATE,
               billTo:{name:'',gstin:'',address:''}};
  /* the contact this shop's bills are made out to, if there is one.
     Nothing is guessed: with two contacts and neither tied to the shop,
     it is left empty and asked for on the bill itself. */
  setInvoiceContact(inv, contactForShop(shopId));
  DB.invoices[DATE][shopId] = inv;
  save(); INVSHOP = shopId; render();
}

/* Saving is what issues the number, and the only thing that makes a
   draft a bill. Everything downstream — the day board, the accounts,
   what the shop sees — counts saved invoices and ignores drafts. */
function saveInvoice(shopId){
  if(ROLE === 'ho'){ alert('Head office reads bills; it does not raise them.'); return; }
  const inv = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(!inv || inv.saved) return;
  /* A bill with nobody to bill is almost always a slip, but not always:
     a shop that has no contact on the master yet still has to be
     invoiced, and the sheet falls back to its own name. So it asks
     rather than refuses. */
  if(!(inv.billTo && inv.billTo.name)){
    const sh = shopById(shopId);
    if(!confirm('No customer chosen.\n\nThe bill will be made out to ' + CLIENT + ' — '
        + (sh ? sh.name : shopId) + ' branch, with no GST number and no address.\n\n'
        + 'To make it out properly, type a name into the Bill To box on the sheet and pick one '
        + 'from the list.\n\nSave it as it is?')) return;
  }
  const s = shopById(shopId);
  const mk = inv.date.slice(5,7)+inv.date.slice(0,4);
  const key = shopId+'-'+mk;
  DB.serial[key] = (DB.serial[key]||0)+1;
  inv.no = s.prefix+'/'+mk+'/'+String(DB.serial[key]).padStart(4,'0');
  inv.saved = true;
  save(); render();
}

/* Back to a draft, keeping its number: the bill already went out under
   it, and a second bill under the same number is worse than a corrected
   one. */
function editInvoice(shopId){
  const inv = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(!inv) return;
  if(ROLE !== 'owner' && ROLE !== 'admin'){ alert('Only Velora may change a bill.'); return; }
  if(!confirm('Open bill ' + inv.no + ' for changes?\n\nIt keeps its number. Until it is saved '
      + 'again it does not count towards the accounts, and the shop does not see it.')) return;
  inv.saved = false;
  save(); render();
}

function deleteInvoice(shopId){
  const inv = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(!inv) return;
  if(ROLE !== 'owner' && ROLE !== 'admin'){ alert('Only Velora may delete a bill.'); return; }
  if(!confirm('Delete ' + (inv.no || 'this draft') + '?\n\n'
      + (inv.no ? 'The number is not given out again — there will be a gap in the run, which is '
                + 'what a cancelled bill looks like.\n\n' : '')
      + 'The delivery it was raised from is untouched, so it can be raised again.')) return;
  delete DB.invoices[DATE][shopId];
  INVSHOP = null;
  save(); render();
}

/* The invoice keeps its own copy of what it prints. A contact that
   moves premises in October must not quietly reprint July's bill with
   the new address, for the same reason a line keeps the rate it was
   billed at. Re-picking the customer takes a fresh copy. */
function setInvoiceContact(inv, id){
  const c = id ? DB.contacts[id] : null;
  inv.contactId = c ? id : '';
  inv.billTo = c
    ? { name: c.company || '', gstin: c.gstin || '', address: contactAddress(c),
        state: c.state || '', pincode: c.pincode || '' }
    : { name: '', gstin: '', address: '', state: '', pincode: '' };
  /* the place of supply is the customer's state unless somebody has
     already typed something else in */
  if(c && !inv.place) inv.place = c.state || '';
  return inv;
}

/* What the Bill To box does when it is left. An exact company name wins;
   failing that, one contact whose name contains what was typed — so
   "SSR" or "Kalpa" is enough. Anything else is kept as typed, because a
   customer that is not on the master yet is still a customer. */
function pickInvContact(shopId, text){
  const inv = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(!inv || inv.saved) return;
  const q = String(text||'').trim();
  const ids = contactList();
  let hit = ids.filter(id => (DB.contacts[id].company||'').toLowerCase() === q.toLowerCase());
  if(!hit.length && q){
    hit = ids.filter(id => (DB.contacts[id].company||'').toLowerCase().indexOf(q.toLowerCase()) > -1);
  }
  if(hit.length === 1){ setInvoiceContact(inv, hit[0]); save(); render(); return; }
  /* nothing matched, or too many did: keep the words, drop the link */
  inv.contactId = '';
  inv.billTo = Object.assign({}, inv.billTo || {}, {name: q});
  save();
  if(!q) render();
}

function setInvField(shopId, key, val, redraw){
  const inv = DB.invoices[DATE] && DB.invoices[DATE][shopId];
  if(!inv || inv.saved) return;
  inv[key] = val;
  save();
  /* the boxes on the sheet show what they hold, so nothing has to be
     redrawn for the change to be visible */
  if(redraw) render();
}

  if(!show) return '';

   + '<div class="twrap"><table><thead><tr><th>Code</th><th>Product</th>'
   + '<th class="r">Billed / kg</th><th class="r">Shelf / kg</th></tr></thead><tbody>'+rows
   + '</tbody></table></div></div>';

function invoiceText(inv, shop){

function waInvoice(shopId){

/* amount in words, Indian system */
function words(n){
  n = Math.round(n||0);
  if(n===0) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x){ return x<20 ? a[x] : (b[Math.floor(x/10)] + (x%10?' '+a[x%10]:'')); }
  function three(x){ return (x>99? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100? two(x%100):''); }
  let out='';
  const cr=Math.floor(n/10000000); n%=10000000;
  const la=Math.floor(n/100000);   n%=100000;
  const th=Math.floor(n/1000);     n%=1000;
  if(cr) out += three(cr)+' Crore ';
  if(la) out += three(la)+' Lakh ';
  if(th) out += three(th)+' Thousand ';
  if(n)  out += three(n);
  return out.replace(/\s+/g,' ').trim();
}



/* ============================================================
   ORDERS — accepted indents grouped by vendor group, sent per group
   ============================================================ */
/* {code: {total, byShop:{shopId:qty}}} across every accepted indent for the day */
function dayRequirement(date){
  const need = {};
  SHOPS.forEach(s=>{
    const ind = (DB.indents[date]||{})[s.id];
    if(!ind) return;
    if(['accepted','packed','shipped','received','billed'].indexOf(ind.status)<0) return;
    Object.keys(ind.lines).forEach(c=>{
      const q = parseFloat(ind.lines[c])||0; if(q<=0) return;
      if(!need[c]) need[c] = {total:0, byShop:{}};
      need[c].total += q;
      need[c].byShop[s.id] = (need[c].byShop[s.id]||0) + q;
    });
  });
  return need;
}
function groupedRequirement(date){
  const need = dayRequirement(date), out = {};
  Object.keys(need).forEach(c=>{
    const g = groupOf(c);
    (out[g] = out[g] || []).push(c);
  });
  Object.keys(out).forEach(g=> out[g].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)));
  return {need:need, groups:out};
}
/* What is actually bought from the vendor. It starts as the sum of what
   the shops asked for, and can be changed before the order goes out — a
   vendor sells by the crate, a rate is better for ten kilos than for
   seven, and something is worth buying in hand. The shops' own figures
   are never touched by this: packing still divides what arrives between
   them line by line. */
function orderQty(date, code, fallback){
  const o = (dayOf(date).order || {});
  return (o[code] === undefined || o[code] === null || o[code] === '')
    ? fallback : Number(o[code]);
}
function setOrderQty(code, v){
  const day = dayOf(DATE);
  day.order = day.order || {};
  const q = parseFloat(v);
  if(v === '' || isNaN(q) || q < 0) delete day.order[code]; else day.order[code] = q;
  save(); render();
}
function orderEdited(date, code){
  const o = (dayOf(date).order || {});
  return o[code] !== undefined && o[code] !== null && o[code] !== '';
}

function orderText(date, g, codes, need){
  const v = DB.vendors[g] || {name:g};
  let t = 'VELORA FRESH — order for ' + fmtDate(date) + '\n' + (v.name||g) + '\n';
  codes.forEach(c=>{
    const e = CAT[c]; if(!e) return;
    const q = orderQty(date, c, need[c].total);
    /* the name in both languages: the man loading the crates reads one
       of them, the man writing the bill reads the other */
    t += '\n' + c + ' ' + e.name + (e.tamil ? ' / ' + e.tamil : '')
       + ' — ' + num(q) + ' ' + e.unit + '\n   ';
    t += SHOPS.filter(s=>need[c].byShop[s.id]).map(s=> s.name+' '+num(need[c].byShop[s.id])).join(' | ');
  });
  t += '\n\n' + codes.length + ' items. Please pack shop-wise.';
  return t;
}

/* ============================================================
   WhatsApp
   ============================================================
   A wa.me link, not the Cloud API. It opens WhatsApp with the number
   and the message already typed; a person presses send. No Meta
   account, no approved templates, no per-message cost, and it works on
   a phone and on desktop WhatsApp alike.

   The trade is that it is not automatic. When the order format has
   settled, the Cloud API can replace waOpen() alone — every caller
   builds its text the same way and would not need to change.
   ============================================================ */

/* India is +91. A number saved as 9840000001 has to become 919840000001
   or wa.me silently opens a chat with nobody. */
function waNumber(raw){
  let n = String(raw || '').replace(/[^0-9]/g, '');
  if(!n) return '';
  if(n.length === 10) n = '91' + n;              /* bare Indian mobile */
  else if(n.length === 11 && n.charAt(0) === '0') n = '91' + n.slice(1);
  else if(n.length === 12 && n.slice(0,2) === '91') { /* already right */ }
  return n;
}

function waOpen(number, text){
  const n = waNumber(number);
  const url = 'https://wa.me/' + n + '?text=' + encodeURIComponent(text);
  /* opened in a new tab so a half-finished screen is never lost */
  const w = window.open(url, '_blank');
  if(!w) alert('Your browser blocked the WhatsApp window. Allow pop-ups for this site and try again.');
  return !!w;
}

/* Falls back to the clipboard when there is no number on file, so the
   message is never simply lost. */
function waSend(number, text, who){
  if(!waNumber(number)){
    copyText(text);
    alert('No WhatsApp number saved for ' + who + '.\n\n'
        + 'The message has been copied — paste it into WhatsApp, and add their '
        + 'number under Contacts > Vendors so next time it opens directly.');
    return false;
  }
  return waOpen(number, text);
}

function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  }catch(e){ return false; }
}

function markSent(g){ const day=dayOf(DATE); day.sent=day.sent||{}; day.sent[g]=true; save(); render(); }
function sendOrder(g){
  const gr = groupedRequirement(DATE);
  const v = DB.vendors[g]||{name:g,phone:''};
  const text = orderText(DATE, g, gr.groups[g]||[], gr.need);

  /* Marked as sent either way: a manual group is placed by phone, and a
     vendor with no number saved still had its order copied out. */
  if(v.manual){
    copyText(text);
    alert('This vendor is set to order by hand.\n\nThe order has been copied — '
        + 'read it out or paste it wherever you place it.');
  }else{
    waSend(v.phone, text, (v.name || g));
  }
  markSent(g);
}

/* ============================================================
   ACCOUNTS — weekly, Monday to Sunday, payment due Monday
   One chain-level payment, allocated oldest bill first.
   Owner records; head office reads.
   ============================================================ */
function weekStart(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const off = (dt.getDay() + 6) % 7;          /* Monday = 0 */
  dt.setDate(dt.getDate() - off);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function addDays(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
/* every bill ever raised, oldest first, shop order inside a day */
function allBills(){
  const out = [];
  Object.keys(DB.invoices).sort().forEach(d=>{
    SHOPS.forEach(s=>{
      const inv = DB.invoices[d][s.id];
      if(inv && inv.saved) out.push({date:d, shopId:s.id, no:inv.no,
                                     amount:Math.round(inv.total), lines:inv.lines.length});
    });
  });
  return out;
}
function totalPaid(){ return DB.payments.reduce((t,p)=>t+(parseFloat(p.amount)||0), 0); }
/* oldest-first settlement, recomputed every time so it can never drift */
function settled(){
  let pot = totalPaid();
  return allBills().map(b=>{
    const applied = Math.min(pot, b.amount);
    pot -= applied;
    return Object.assign({}, b, {paid:applied, due:b.amount-applied,
      state: applied>=b.amount ? 'cleared' : (applied>0 ? 'part' : 'open')});
  });
}
function vAccounts(){

  const inWeek  = bills.filter(b=>b.date >= ws && b.date <= we);
  const opening = before.reduce((t,b)=>t+b.due, 0);
  const billed  = inWeek.reduce((t,b)=>t+b.amount, 0);
  const paidWk  = DB.payments.filter(p=>p.date>=ws && p.date<=we).reduce((t,p)=>t+(parseFloat(p.amount)||0),0);
  const closing = bills.filter(b=>b.date <= we).reduce((t,b)=>t+b.due, 0);

  let billRows='';

    payRows += '<tr><td>'+fmtDate(p.date)+'</td><td>'+esc(p.mode)+'</td><td class="mono">'+(p.ref ? esc(p.ref) : '&mdash;')+'</td>'

  });

  const due = (closing>0);

   + '<div class="bar"><button class="btn sm" onclick="shiftWeek(-7)">&larr; Previous</button>'

   + '<span class="spacer"></span><button class="btn sm" onclick="window.print()">Print statement</button></div>'
   + '<div class="kpi">'
   + '<div><div class="lb">Opening balance</div><div class="vl mono">&#8377;'+money(opening)+'</div></div>'
   + '<div><div class="lb">Billed this week</div><div class="vl mono">&#8377;'+money(billed)+'</div></div>'
