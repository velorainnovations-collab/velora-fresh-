   + '<div><div class="lb">Balance due</div><div class="vl mono" style="'+(due?'color:#8c2020':'color:#14663f')+'">&#8377;'+money(closing)+'</div></div>'
   + '</div>'
   + '<div class="card"><h3>By shop</h3><table><thead><tr><th>Shop</th><th class="c">Bills</th><th class="r">Billed</th><th class="r">Still due</th></tr></thead>'
   + '<tbody>'+shopRows+'</tbody></table></div>'

   + '<tbody>'+(billRows||'<tr><td colspan="5" class="empty">No bills raised in this week.</td></tr>')+'</tbody></table></div>'
   /* the same form furniture as every other screen, rather than inline

  save(); render();
}

/* ============================================================
   OWNER — margin master
   ============================================================ */
let MASTERSHOP = null;
let ACCTWEEK = null;
function vMaster(){
  if(MASTERSHOP) return vMasterShop(MASTERSHOP);
  let rows='';
  SHOPS.forEach(s=>{
    const c = commOf(s.id);

      + '<td class="c mono" style="width:120px">'+n+' / '+CODES.length+'</td>'

  });

   + '<div class="note">A change here applies to invoices raised from now on. Invoices already generated keep the rate they were billed at.</div>'
   + '<div class="card"><table><thead><tr><th>Shop</th><th class="c">Commission %</th><th class="c">Selling margins set</th><th class="r">&#8377;100 becomes</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function vMasterShop(id){
  const s = shopById(id);

    const e = CAT[c];

   + '<h2>'+esc(s.name)+' &mdash; selling margins</h2>'
   + '<p class="sub">Percentage on top of the purchase price. Blank prints no selling price for that product.</p>'
   + '<div class="card"><table><thead><tr><th>Code</th><th>Product</th><th class="c">Selling margin %</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

/* ============================================================
   CONTACT MASTER  —  who a bill is made out to
   ============================================================
   The customer's own details, entered once and read off the shelf every
   time an invoice is raised: the company as it is registered, its GST
   number and the address the goods go to. There is one address, not
   two: the billing address is the delivery address, because two
   addresses that have to agree are two chances to be wrong.

   Fields are added here and nowhere else. The invoice takes a snapshot
   of the three things it prints, so a contact can grow a dozen more
   columns without the invoice workflow changing at all.
   ============================================================ */

/* a v4-shaped id, from the browser's own generator where there is one.
   Real uuids, because that is what the database column is — a local key
   hashed into one later would stop matching the moment it was read
   back from the server. */
function newId(){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch=>{
    const r = Math.random()*16|0;
    return (ch==='x' ? r : (r&0x3|0x8)).toString(16);
  });
}

/* The address as it prints: blank lines left out, so a contact with two
   address lines does not print a gap where the third would be. */
function contactAddress(c){
  return [c.addr1, c.addr2, c.addr3,
          [c.state, c.pincode].filter(Boolean).join(' - ')]
         .map(x=>String(x||'').trim()).filter(Boolean).join('\n');
}
function contactList(){
  return Object.keys(DB.contacts || {})
    .filter(id => DB.contacts[id] && DB.contacts[id].active !== false)
    .sort((a,b)=> String(DB.contacts[a].company||'').localeCompare(String(DB.contacts[b].company||'')));
}
/* The one offered first when a shop's bill is generated: its own, and
   failing that the only contact on file. Never a guess between two. */
function contactForShop(shopId){
  const ids = contactList();
  const own = ids.filter(id => DB.contacts[id].shopId === shopId);
  if(own.length) return own[0];
  return ids.length === 1 ? ids[0] : '';
}

let CONTACTOPEN = null;              /* an id being edited, or 'new' */

function vContacts(){
  if(ROLE !== 'owner') return '<h2>Contact</h2><div class="empty">Owner only.</div>';
  if(CONTACTOPEN) return vContactOne(CONTACTOPEN);
  const ids = contactList();
  let rows = '';
  ids.forEach(id=>{
    const c = DB.contacts[id];
    const sh = c.shopId ? shopById(c.shopId) : null;
    rows += '<tr><td>'+esc(c.company||'&mdash;')
      + (c.person ? '<span class="tam">'+esc(c.person)+'</span>' : '')+'</td>'
      + '<td class="mono">'+(c.gstin ? esc(c.gstin) : '&mdash;')+'</td>'
      + '<td class="mono">'+(c.mobile ? esc(c.mobile) : '&mdash;')+'</td>'
      + '<td style="font-size:12.5px;color:var(--ink-2)">'
        + esc([c.addr1, c.addr2, c.addr3].filter(Boolean).join(', ') || '—')
        + (c.pincode ? '<span class="tam">'+esc([c.state,c.pincode].filter(Boolean).join(' - '))+'</span>' : '')+'</td>'
      + '<td>'+(sh ? '<span class="pill p-grey">'+esc(sh.name)+'</span>' : '&mdash;')+'</td>'
      + '<td class="r"><button class="btn sm" onclick="CONTACTOPEN=\''+id+'\';render()">Edit</button></td></tr>';
  });
  return '<h2>Contact</h2>'
   + '<p class="sub">Who a bill is made out to. Entered once, and read off the shelf every time '
   + 'an invoice is raised.</p>'
   + '<div class="bar"><button class="btn pri" onclick="CONTACTOPEN=\'new\';render()">Add a contact</button></div>'
   + '<div class="card"><div class="twrap"><table><thead><tr><th>Company</th><th>GST number</th>'
   + '<th>Mobile</th><th>Billing address</th><th>Bills for</th><th></th></tr></thead><tbody>'
   + (rows || '<tr><td colspan="6"><div class="empty">No contacts yet. '
       + 'Add one and it can be picked from any invoice.</div></td></tr>')
   + '</tbody></table></div></div>';
}

function vContactOne(id){
  const isNew = (id === 'new');
  const c = isNew ? {bank:{}} : (DB.contacts[id] || {bank:{}});
  const b = c.bank || {};
  const f = (lbl, key, val, ph, opt) => '<div><label>'+lbl
    + (opt?' <span class="hint">optional</span>':'')+'</label>'
    + '<input type="text" id="ct_'+key+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"></div>';
  let sopts = '<option value="">Any shop</option>';
  SHOPS.forEach(s=> sopts += '<option value="'+esc(s.id)+'"'
    + (c.shopId===s.id?' selected':'')+'>'+esc(s.name)+'</option>');

  return '<div class="bar"><button class="btn sm" onclick="CONTACTOPEN=null;render()">&larr; Contact</button></div>'
   + '<h2>'+(isNew ? 'Add a contact' : esc(c.company||'Contact'))+'</h2>'
   + '<p class="sub">Everything here goes on the invoice as it is typed, so type it the way it '
   + 'should print.</p>'

   + '<div class="card"><h3>Basic details</h3><div style="padding:15px 16px"><div class="addform">'
   + f('Company name','company',c.company)
   + f('Contact person','person',c.person,'','opt')
   + f('GST number','gstin',c.gstin,'','opt')
   + f('Mobile number','mobile',c.mobile)
   + f('Email','email',c.email,'','opt')
   + '<div><label>Bills for <span class="hint">optional</span></label>'
   + '<select id="ct_shopId">'+sopts+'</select></div>'
   + '</div></div></div>'

   + '<div class="card"><h3>Billing address</h3><div style="padding:15px 16px"><div class="addform">'
   + f('Address line 1','addr1',c.addr1)
   + f('Address line 2','addr2',c.addr2)
   + f('Address line 3','addr3',c.addr3)
   + f('State','state',c.state)
   + f('Pincode','pincode',c.pincode)
   + '<p class="hintline" style="grid-column:1/-1;margin:0;font-size:12.5px;color:var(--ink-3)">'
   + 'This is the delivery address too. There is no separate shipping address &mdash; the goods '
   + 'go where the bill goes.</p>'
   + '</div></div></div>'

   + '<div class="card"><h3>Bank details &mdash; owner only</h3><div style="padding:15px 16px"><div class="addform">'
   + f('Bank name','bankName',b.bankName)
   + f('Account name','acName',b.acName)
   + f('Account number','acNo',b.acNo)
   + f('IFSC code','ifsc',b.ifsc)
   + f('Branch','branch',b.branch)
   + '</div></div></div>'

   + '<div class="bar">'
   + '<button class="btn pri" onclick="saveContact(\''+id+'\')">'
     + (isNew ? 'Add contact' : 'Save changes')+'</button>'
   + '<button class="btn" onclick="CONTACTOPEN=null;render()">Cancel</button>'
   + (isNew ? '' : '<span class="spacer"></span>'
       + '<button class="btn danger" onclick="removeContact(\''+id+'\')">Remove contact</button>')
   + '</div>';
}

function saveContact(id){
  if(ROLE !== 'owner'){ alert('Only the owner may edit a contact.'); return; }
  const v = k => { const e = document.getElementById('ct_'+k); return e ? e.value.trim() : ''; };
  const company = v('company');
  if(!company){ alert('A contact needs a company name — it is what prints on the bill.'); return; }

  const isNew = (id === 'new');
  const key = isNew ? newId() : id;
  const was = DB.contacts[key] || {};
  DB.contacts[key] = {
    id: key, active: true, shopId: (document.getElementById('ct_shopId')||{}).value || '',
    company: company, person: v('person'), gstin: v('gstin').toUpperCase(),
    mobile: v('mobile'), email: v('email'),
    addr1: v('addr1'), addr2: v('addr2'), addr3: v('addr3'),
    state: v('state'), pincode: v('pincode'),
    bank: { bankName: v('bankName'), acName: v('acName'), acNo: v('acNo'),
            ifsc: v('ifsc').toUpperCase(), branch: v('branch') },
  };
  if(was.created) DB.contacts[key].created = was.created;
  CONTACTOPEN = null;
  save();
  render();
}

/* Marked inactive rather than deleted: a bill raised last month names
   this contact, and a row an invoice points at cannot simply vanish. */
function removeContact(id){
  if(ROLE !== 'owner'){ alert('Only the owner may remove a contact.'); return; }
  const c = DB.contacts[id]; if(!c) return;
  if(!confirm('Remove “' + (c.company||'this contact') + '” from the list?\n\n'
      + 'Bills already made out to it keep the name, GST number and address exactly as they '
      + 'were printed. It simply stops being offered when a new invoice is raised.')) return;
  c.active = false;
  CONTACTOPEN = null;
  save();
  render();
}

function setAnytime(v){ DB.settings.anytime = !!v; save(); render(); }
function setComm(id, v){ DB.master.comm[id] = v===''?0:(parseFloat(v)||0); save(); render(); }
function setSell(id, code, v){
  DB.master.selling[id] = DB.master.selling[id] || {};
  if(v==='') DB.master.selling[id][code] = ''; else DB.master.selling[id][code] = parseFloat(v)||0;
  save();
}

/* ---------- test / debug hook ---------- */
function setPackShop(id){ PACKSHOP = id; render(); }
window.VF = {
  CAT:CAT, CODES:CODES, SHOPS:SHOPS,
  settled:function(){ return settled(); }, weekStart:weekStart,
  GROUPS:GROUPS, CODE2GROUP:CODE2GROUP,
  grouped:function(d){ return groupedRequirement(d); }, orderText:orderText,
  get DB(){ return DB; }, get DATE(){ return DATE; }, get ROLE(){ return ROLE; }, get TAB(){ return TAB; }
};

/* ---------- clearing a day, for testing ----------
   Wipes the date on screen everywhere: the indents and their lines, the
   rates, the packing, the lorry, the vendor orders and the bill, on
   this device and on the server. There is no undo, which is why it is
   asked twice and why it goes with TESTING_TOOLS. */
/* the tables in the words the desk uses, so the message reads like a
   sentence rather than a schema */
function keptWords(kept){
  const NAMES = { day_rates:'the market rates', packed:'the packing',
                  shipments:'the delivery', vendor_orders:'the vendor orders',
                  vendor_order_lines:'the vendor orders', invoices:'the bills',
                  indents:'the indents', indent_lines:'the indents' };
  const seen = [];
  kept.forEach(t=>{ const w = NAMES[t] || t; if(seen.indexOf(w) < 0) seen.push(w); });
  return seen.length > 1 ? seen.slice(0,-1).join(', ') + ' and ' + seen[seen.length-1]
                         : (seen[0] || 'nothing');
}

async function wipeDayAsk(){
  const d = DATE;
  if(!confirm('Delete all data for ' + fmtDate(d) + '?\n\n'
    + 'This permanently removes every record for that date — indents, rates, packing, '
    + 'delivery and any bill raised.\n\nThis is a testing feature and cannot be undone.')) return;

  const btn = document.getElementById('wipeDay');
  if(btn){ btn.disabled = true; btn.textContent = 'Clearing…'; }
  try{
    let skipped = [], kept = [];
    if(typeof VFSync !== 'undefined' && VFSync.enabled()){
      const r = await VFSync.wipeDay(d);
      skipped = (r && r.skipped) || [];
      kept    = (r && r.kept)    || [];
    }
    if(!kept.length){
      delete DB.indents[d];
      delete DB.days[d];
      delete DB.invoices[d];
    }else{
      /* the database would not let this login clear the rest, so it is
         still there and must stay on screen too — wiping it here only
         to have it come back on the next refresh would be a lie */
      const mine = (ROLE === 'ho') ? SHOPS.map(s=>s.id) : [ROLE];
      if(DB.indents[d]) mine.forEach(id=> delete DB.indents[d][id]);
      if(DB.days[d] && DB.days[d].ship && kept.indexOf('shipments') < 0)
        mine.forEach(id=> delete DB.days[d].ship[id]);
    }
    OPENIND = null; PACKSHOP = null; RATEDRAFT = {}; RATENOTE = '';
    save();
    /* read the day back, so what is on screen is what the server holds */
    try{
      if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn())
        await VFSync.refreshIndents(DB, d);
    }catch(e){ /* offline: the local clear stands */ }
    save(); render();
    alert((kept.length ? 'Your records for ' + fmtDate(d) + ' have been deleted.'
                       : 'All data for ' + fmtDate(d) + ' has been deleted.')
      + (kept.length ? '\n\n' + VELORA + ' keeps the rest — ' + keptWords(kept)
                       + '. Ask the office to clear those, or run wipe_day from '
                       + 'supabase/02_security.sql so any login can clear the whole day.' : '')
      + (skipped.length ? '\n\nNot on the server yet, so left alone: ' + skipped.join(', ') : ''));
  }catch(e){
    alert('Could not clear the day: ' + (e.message || e) + '\n\nNothing has been left half done '
      + 'on this device — reload and try again.');
  }finally{
    const b2 = document.getElementById('wipeDay');
    if(b2){ b2.disabled = false; b2.textContent = 'Clear day'; }
  }
}

/* ---------- what arrives while you are looking ----------
   A shop submits on its own phone, and the office is looking at a
   screen drawn before that happened. Nobody should have to press
   reload to find out. Only the day on screen is read, and only while
   an indent screen is open, so this costs one small request a
   half-minute and nothing at all on the other screens.

   The redraw is held back while somebody is typing: losing a
   half-entered quantity to a background refresh would be worse than
   seeing it a moment later. */
let WATCHING = false;

async function watchIndents(){
  if(WATCHING) return;
  if(typeof VFSync === 'undefined' || !VFSync.enabled() || !VFSync.signedIn()) return;
  /* the screens where somebody is waiting on somebody else: an indent
     coming in, a weight going on, a lorry leaving */
  if(['indents','myindent','pack','ship','mydel'].indexOf(TAB) < 0) return;
  WATCHING = true;
  try{
    const changed = await VFSync.refreshIndents(DB, DATE);
    if(changed){
      const a = document.activeElement;
      const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#main');
      if(!typing) render();
    }
  }catch(e){ /* offline: the screen stands, the next tick tries again */ }
  finally{ WATCHING = false; }
}

/* ---------- boot ---------- */
function tick(){
  const n = new Date();
  const w = windowState();
  const lbl = WINDOW_ON
    ? {open:'Indent window open', late:'Late window', closed:'Indent window closed'}[w] + ' · '
    : '';
  const el = document.getElementById('clock');
  if(el) el.textContent = lbl + String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
/* Restore the screen from the address bar, so a refresh comes back
   where you were instead of the first tab. This has to run after the
   declarations above: an assignment to TAB before `let TAB` throws. */
/* Held until the role is known: the first render happens before
   whoami() answers, and a screen this role cannot reach would be
   redirected away and the url rewritten before sign-in completes. */
BOOT_TAB = readHash();
if(BOOT_TAB) TAB = BOOT_TAB;
if(!TAB) TAB = tabsFor()[0].id;
paintThemeButton();
placeHeaderControls();
render();
tick();
setInterval(tick, 30000);
setInterval(watchIndents, 20000);
/* and straight away when the screen is opened, rather than up to
   twenty seconds later */
const _go = go;
go = function(t, keepHash){ _go(t, keepHash); watchIndents(); };

/* re-wire the product search after every render that needs it */
const _render = render;
render = function(){
  _render();
  /* the shop's list carries its own search now, and what it is showing
     has to survive the re-render a quantity causes */
  if(TAB==='myindent'){ myApplyFilter(); }
  if(TAB==='pack'){ wireSearch(c=>{ addExtra(c); }); }
};
render();
