<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velora Fresh — supply desk</title>
<style>
/* ============================================================
   Velora Fresh — supply desk
   Design tokens first, then components. Class names are fixed by
   the render functions below; do not rename them here alone.
   ============================================================ */
:root{
  --ink:#12100e; --ink-2:#3f3b36; --ink-3:#6f6960; --ink-4:#9b948a;
  --line:#e6e2db; --line-2:#f1eee9;
  --bg:#f6f4f0; --surface:#fff; --surface-2:#faf9f6;
  --brand:#1c6b45; --brand-dark:#175a3a; --brand-soft:#e8f2ec;
  --blue:#1c4f80; --blue-soft:#e7f0fa;
  --amber:#8a5a06; --amber-soft:#fdf2dd;
  --red:#96241f; --red-soft:#fbeae9;
  --green:#14653f; --green-soft:#e6f4ec;
  --r:9px; --r-lg:13px;
  --hover:#fcfbf8;
  /* the three measurements the frame is built from: the sidebar's width,
     the gutter the screen is written in, and the header's height. The
     header lines up with them rather than being spaced by eye — the
     brand ends where the sidebar ends, and what follows it starts where
     the writing on the screen starts. */
  --side:236px; --pad:24px; --hdr:53px;
  --sh:0 1px 2px rgba(18,16,14,.05);
  --sh-2:0 2px 4px rgba(18,16,14,.05),0 6px 16px rgba(18,16,14,.06);
}

/* ---------- dark ----------
   Only the tokens change; every component reads them, so nothing else
   needs a dark rule. Two exceptions below: the invoice stays on white
   because it is printed, and the sign-in gate is already dark.
   Follows the system unless the owner has chosen, and the choice is
   remembered per device. */
:root[data-theme="dark"]{
  --ink:#f0ece6; --ink-2:#cfc8bf; --ink-3:#a49c92; --ink-4:#7d766d;
  --line:#332f2b; --line-2:#282522;
  --bg:#141210; --surface:#1c1917; --surface-2:#232019;
  --brand:#3fa877; --brand-dark:#2f8a5f; --brand-soft:#1b3229;
  --blue:#8ab4e8; --blue-soft:#1a2836;
  --amber:#e0b169; --amber-soft:#332a18;
  --red:#e58b84; --red-soft:#3a201e;
  --green:#5cbb8c; --green-soft:#17301f;
  --hover:#232019;
  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 4px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f0ece6; --ink-2:#cfc8bf; --ink-3:#a49c92; --ink-4:#7d766d;
    --line:#332f2b; --line-2:#282522;
    --bg:#141210; --surface:#1c1917; --surface-2:#232019;
    --brand:#3fa877; --brand-dark:#2f8a5f; --brand-soft:#1b3229;
    --blue:#8ab4e8; --blue-soft:#1a2836;
    --amber:#e0b169; --amber-soft:#332a18;
    --red:#e58b84; --red-soft:#3a201e;
    --green:#5cbb8c; --green-soft:#17301f;
    --hover:#232019;
    --sh:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 2px 4px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.45);
  }
}
/* form controls follow the theme rather than the OS default */
:root[data-theme="dark"], :root[data-theme="light"]{ color-scheme: light dark; }
:root[data-theme="dark"]{ color-scheme: dark; }
:root[data-theme="light"]{ color-scheme: light; }

/* A bill is printed on white paper. Dark ink on a dark card would be
   unreadable on screen and wrong on paper, so the invoice opts out. */
:root[data-theme="dark"] #inv{ background:#fff; color:#1a1a1a; }
:root[data-theme="dark"] #inv *{ color:#1a1a1a; }
:root[data-theme="dark"] table.ibl th{ background:#f4f4f2; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #inv{ background:#fff; color:#1a1a1a; }
  :root:not([data-theme="light"]) #inv *{ color:#1a1a1a; }
  :root:not([data-theme="light"]) table.ibl th{ background:#f4f4f2; }
}

#themeBtn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
  cursor:pointer;color:var(--ink-2);display:grid;place-items:center;flex:none;padding:0}
#themeBtn:hover{background:var(--surface-2)}
#themeBtn svg{width:16px;height:16px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:9px var(--pad);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:var(--sh);
  min-height:var(--hdr);box-sizing:border-box}
/* one height for everything in the bar, so the row is a straight line
   and the header is exactly --hdr tall for the sidebar to hang off */
header select,header input[type=date],header .btn,#themeBtn{height:34px}
#burger{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
  cursor:pointer;font-size:15px;color:var(--ink-2);display:none;place-items:center;flex:none}
#burger:hover{background:var(--surface-2)}
/* the brand fills the sidebar's column exactly; the margin plus the
   header's own gap put whatever comes next on the screen's left edge */
.brand{font-size:16px;font-weight:650;letter-spacing:-.2px;line-height:1.15;
  display:flex;align-items:center;gap:9px;
  flex:0 0 calc(var(--side) - var(--pad));margin-right:calc(var(--pad) - 12px)}
.brand .mk{width:31px;height:31px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f9163,var(--brand));color:#fff;font-size:15px;font-weight:700}
.brand small{display:block;font-size:9.5px;font-weight:500;color:var(--ink-4);
  letter-spacing:.09em;text-transform:uppercase;margin-top:1px}
.spacer{margin-left:auto}
header select,header input[type=date]{width:auto;max-width:100%;min-width:0;background:var(--surface-2)}
#whoami{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);min-width:0}
#whoami b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}

/* the same controls once the drawer has them. The drawer is a column:
   who you are at the top, the menu in the middle taking the scroll, the
   way out held at the bottom. */
#side{display:flex;flex-direction:column}
#sideNav{flex:1 1 auto;overflow-y:auto}
#sideTop{padding:12px 16px 13px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;flex:none}
#sideTop>*{margin:0}
/* the day sits beside the name, always on the one line: min-width:0 lets
   a long name give way rather than push the date under it */
#sideWho{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;width:100%}
#sideWho #whoami{font-size:13.5px;flex:1 1 auto;min-width:0}
#sideWho #whoami b{max-width:none}
#sideWho select,#sideWho input[type=date]{width:auto;flex:0 0 auto;height:32px;
  font-size:12.5px;padding:5px 7px}
#sideFoot{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;background:var(--surface)}
#sideFoot .btn{width:100%;height:38px}
#sideFoot #clock{font-size:11.5px;color:var(--ink-4);text-align:center}

/* ---------- nav ---------- */
/* ---------- sidebar ---------- */
#side{position:fixed;top:var(--hdr);left:0;bottom:0;width:var(--side);background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;z-index:18;padding:8px 0 24px;
  transition:transform .22s ease}
#side::-webkit-scrollbar{width:6px}
#side::-webkit-scrollbar-thumb{background:#dcd7ce;border-radius:3px}

.grp{border-bottom:1px solid var(--line-2)}
.grp>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:11px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;text-align:left;font-family:inherit;transition:background .12s,color .12s}
.grp>button:hover{background:var(--surface-2);color:var(--ink)}
.grp>button .ic{width:17px;height:17px;color:var(--ink-4);flex:none}
.grp>button .cv{margin-left:auto;font-size:10px;color:var(--ink-4);transition:transform .18s}
.grp.open>button{color:var(--brand)}
.grp.open>button .ic{color:var(--brand)}
.grp>button:hover .ic{color:var(--ink-2)}
.grp.open>button .cv{transform:rotate(90deg)}
.grp.solo>button.on{color:var(--brand);background:var(--brand-soft)}

.kids{display:none;padding:2px 0 8px}
.grp.open .kids{display:block}
.kids button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
  padding:8px 16px 8px 45px;font:inherit;font-size:13.5px;color:var(--ink-3);cursor:pointer;
  text-align:left;font-family:inherit;border-left:2px solid transparent;transition:all .12s}
.kids button:hover{background:var(--surface-2);color:var(--ink)}
.kids button.on{color:var(--brand);font-weight:600;background:var(--brand-soft);
  border-left-color:var(--brand)}

#scrim{position:fixed;inset:52px 0 0 0;background:rgba(18,16,14,.4);z-index:17;display:none}

/* ---------- page ---------- */
/* Fill whatever is left of the window. A max-width here left a wide
   screen half empty, and the tables are the point of every screen. */
main{padding:22px var(--pad) 72px;margin-left:var(--side)}
h2{font-size:21px;font-weight:650;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 18px}

/* ---------- controls ---------- */
button,select,input{font-family:inherit;font-size:14px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 15px;
  cursor:pointer;font-weight:500;color:var(--ink-2);box-shadow:var(--sh);
  transition:background .13s,border-color .13s,color .13s}
.btn:hover{background:var(--surface-2);border-color:#d5cfc6;color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand);
  box-shadow:0 1px 2px rgba(28,107,69,.28)}
.btn.pri:hover{background:#175a3a;border-color:#175a3a;color:#fff}
/* the one that cannot be undone reads differently from the ones that can */
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
/* email, password and tel were missing here, so the sign-in boxes fell
   back to the browser's own width and sat short of the button */
input[type=text],input[type=number],input[type=date],
input[type=email],input[type=password],input[type=tel],select{border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;background:var(--surface);width:100%;color:var(--ink);transition:border-color .13s,box-shadow .13s}
input:hover,select:hover{border-color:#d5cfc6}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0;padding:12px 16px;font-size:13.5px;font-weight:650;letter-spacing:-.1px;
  background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.card>table{border-radius:0 0 var(--r-lg) var(--r-lg)}
/* few-column entry tables read badly stretched to full width */
.card.narrow{max-width:760px}

/* ---------- table ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 var(--r-lg) var(--r-lg)}
/* the soft edge that says there is more to the right — see wrapTables */
.tscroll{position:relative}
.tscroll.more::after{content:'';position:absolute;top:0;bottom:0;right:0;width:24px;
  pointer-events:none;border-radius:0 0 var(--r-lg) 0;
  background:linear-gradient(to right,rgba(0,0,0,0),var(--surface))}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4);text-align:left;
  padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
/* Only where there is a pointer to hover with. On a phone the highlight
   used to latch onto the last row touched and stay there, and it was a
   light colour with no dark counterpart, so in dark mode that row went
   white — white text on white. */
@media (hover:hover){
  tbody tr:hover td{background:var(--hover)}
  tbody tr:hover td:first-child{background:var(--hover)}
}
tr:last-child td{border-bottom:none}
.r{text-align:right}.c{text-align:center}
.tam{font-size:11.5px;color:var(--ink-4);display:block;margin-top:1px}
.vgrp{background:var(--brand-soft);font-weight:650;font-size:12.5px;color:#14563a;
  letter-spacing:.01em;border-bottom:1px solid #d3e6dc}
.vgrp td{border-bottom:1px solid #d3e6dc}
tbody tr.vgrp:hover td{background:var(--brand-soft)}
.skipped td{background:var(--red-soft);color:var(--red)}
tbody tr.skipped:hover td{background:var(--red-soft)}
.row-inp{width:86px;text-align:center;padding:6px 6px;font-variant-numeric:tabular-nums}

/* ---------- pills ---------- */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  border:1px solid transparent;letter-spacing:.01em;white-space:nowrap}
.p-grey{background:#f0eeea;color:var(--ink-3);border-color:#e3dfd8}
.p-blue{background:var(--blue-soft);color:var(--blue);border-color:#cfe0f2}
.p-green{background:var(--green-soft);color:var(--green);border-color:#c9e6d6}
.p-amber{background:var(--amber-soft);color:var(--amber);border-color:#f2e0b8}
.p-red{background:var(--red-soft);color:var(--red);border-color:#f2d3d1}

/* ---------- shop tiles ---------- */
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;
  cursor:pointer;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,transform .14s}
/* left edge carries the shop's state, so the board reads at a glance */
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ddd8d0}
.t-submitted::before{background:#4a80b8}
.t-accepted::before,.t-packed::before{background:#d9a441}
.t-shipped::before{background:#2f6ea8}
.t-received::before,.t-billed::before{background:#2f9163}
.tile:hover{border-color:#cfc9bf;box-shadow:var(--sh-2);transform:translateY(-1px)}
.tile .nm{font-weight:650;font-size:14.5px;letter-spacing:-.15px}
.tile .big{font-size:22px;font-weight:650;margin:7px 0 2px;letter-spacing:-.5px}
.tile .sub{font-size:12px}

/* ---------- kpi ---------- */
.kpi{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px}
.kpi>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 15px;box-shadow:var(--sh)}
.kpi .lb{font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .vl{font-size:23px;font-weight:650;margin-top:3px;letter-spacing:-.6px;color:var(--ink)}

/* ---------- misc ---------- */
.empty{padding:44px 16px;text-align:center;color:var(--ink-4);font-size:14px}
.note{background:var(--amber-soft);border:1px solid #f0dcb0;border-left:3px solid #d9a441;
  border-radius:var(--r);padding:11px 14px;font-size:13.5px;color:#6d4a08;margin-bottom:15px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}

/* Add forms. A flex row let the inputs stretch and squeezed the button
   against the right edge; a grid gives every field the same width and
   puts the action on its own line, so it reads the same at any size. */
/* end, not stretch: a label that wraps to two lines used to push its own
   box a line lower than the rest of the row. Sitting them on a common
   bottom edge keeps every box level whatever the labels do. */
.addform{display:grid;gap:13px 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  align-items:end}
.addform label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.addform .req{color:var(--red);font-weight:700}
/* the suggest button beside the password must not shorten the box */
.addform .pair input{flex:1 1 auto;min-width:0}
.addform .hint{font-weight:400;color:var(--ink-4)}
.addform .act{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line-2);padding-top:13px;margin-top:2px}
.addform .act .hintline{font-size:12.5px;color:var(--ink-3);margin:0;flex:1 1 240px}
.addform .chk{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.addform .chk input{width:auto}
.addform .pair{display:flex;gap:6px}
.srch{position:relative;max-width:360px;flex:1;min-width:200px}
.sug{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:0 0 var(--r) var(--r);max-height:260px;overflow:auto;z-index:30;display:none;box-shadow:var(--sh-2)}
.sug div{padding:8px 11px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line-2)}
.sug div:last-child{border-bottom:none}
.sug div:hover,.sug div.hi{background:var(--brand-soft)}
.rm{color:var(--red);cursor:pointer;border:none;background:none;font-size:16px;line-height:1;
  padding:2px 7px;border-radius:5px}
.rm:hover{background:var(--red-soft)}
.hidden{display:none!important}

/* ---------- invoice (print-faithful, do not restyle) ---------- */
#inv{background:#fff;padding:26px 30px;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.ihead{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid #1a1a1a;padding-bottom:10px}
.ihead .mid{flex:1;text-align:center}
.ihead .cn{font-size:22px;font-weight:700;letter-spacing:.5px}
.ihead .le{font-size:11px;color:#555;margin-top:2px}
.ititle{text-align:center;font-size:14px;letter-spacing:.28em;margin:12px 0;font-weight:600}
.iband{display:flex;border:1px solid #1a1a1a}
.iband>div{padding:7px 10px;font-size:13px}
.iband .lft{flex:1;border-right:1px solid #1a1a1a}
.iband .rgt{width:225px}
table.ibl{border:1px solid #1a1a1a;border-top:none;font-size:13px}
table.ibl th,table.ibl td{border-right:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;padding:5px 7px;
  background:none;color:#1a1a1a;text-transform:none;letter-spacing:0;font-size:12.5px;white-space:normal}
table.ibl th{font-weight:600;background:#f4f4f2}
table.ibl th:last-child,table.ibl td:last-child{border-right:none}
table.ibl tbody tr:hover td{background:none}
.isign{display:flex;justify-content:space-between;margin-top:44px;font-size:12.5px}

/* ---------- sign in ---------- */
#gate{position:fixed;inset:0;z-index:200;background:linear-gradient(155deg,#12100e,#1c3b2a 60%,#1c6b45);
  display:grid;place-items:center;padding:20px}
#gate .box{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.34);
  padding:26px 26px 22px;width:min(380px,100%)}
#gate .bd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#gate .mk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f9163,var(--brand));color:#fff;font-weight:700}
#gate h1{font-size:19px;margin:0;letter-spacing:-.3px}
#gate .co{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:0}
#gate p.hint{font-size:13px;color:var(--ink-3);margin:14px 0 16px}
/* the boxes on this card are all one width, button included */
#gate input,#gate select,#gate .btn{width:100%;font-size:14px}
#gate input,#gate select{padding:9px 11px}
#gate #gateWhoWrap{margin-top:16px}
#gate label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
#gate .f{margin-bottom:12px}
#gate .err{background:var(--red-soft);border:1px solid #f2d3d1;color:var(--red);
  border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:12px}
#gate .foot{margin-top:14px;font-size:11.5px;color:var(--ink-4);text-align:center}
.syncdot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.syncdot i{width:7px;height:7px;border-radius:50%;background:#2f9163;display:inline-block}
.syncdot.busy i{background:#d9a441}
.syncdot.bad i{background:#96241f}
.syncdot.off i{background:#9b948a}

/* ---------- tablet ---------- */
@media (max-width:1080px) and (min-width:721px){
  :root{--side:196px; --pad:18px}
  main{padding-top:20px;padding-bottom:64px}
  .grp>button{padding:10px 13px;font-size:13.5px}
  .kids button{padding-left:40px;font-size:13px}
}

/* ---------- mobile ---------- */
@media (max-width:720px){
  /* one row, always: 8 + 34 + 8 and the border, which is what the
     drawer hangs off */
  :root{--hdr:51px}
  header{padding:8px 13px;gap:10px;flex-wrap:nowrap}
  /* no sidebar to line up with once it becomes a drawer */
  .brand{font-size:15px;flex:0 1 auto;margin-right:0;min-width:0}
  .brand>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #side{width:min(88vw,332px)}
  header select,header input[type=date]{font-size:13px;padding:6px 8px}
  #burger{display:grid}
  #side{transform:translateX(-100%);box-shadow:var(--sh-2)}
  #side.open{transform:translateX(0)}
  #scrim.on{display:block}
  main{padding:16px 13px 64px;margin-left:0}
  h2{font-size:19px}
  .kpi{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .vl{font-size:20px}
  .grid{grid-template-columns:1fr}
  .card{border-radius:var(--r)}

  /* ---- tables on a phone ----
     A four column list — shop, lines, status, the button — was running
     a few pixels past the edge, so the button on the right was cut off
     and looked broken rather than scrollable. Everything in a row is
     tightened here so those lists fit the screen outright. The genuinely
     wide ones, packing and rates, still scroll sideways, and for those
     the first column is pinned so you can always see which product a
     figure belongs to. */
  th,td{padding:7px 7px}
  td{font-size:13px}
  th{font-size:10px;letter-spacing:.04em;padding-top:8px;padding-bottom:8px}
  /* light or dark is the phone's own setting, and the bar is for the
     menu and the name of the business */
  #themeBtn{display:none}
  .pill{font-size:10.5px;padding:2px 8px}
  td .btn,td .btn.sm{padding:5px 9px;font-size:12px}
  .tam{font-size:10.5px}
  .row-inp{width:64px;padding:5px 4px}
  .twrap table td:first-child,.twrap table th:first-child{position:sticky;left:0;z-index:1}
  .twrap table td:first-child{background:var(--surface)}
  .twrap table th:first-child{background:var(--surface-2)}
  .vgrp td:first-child{background:var(--brand-soft)}
  .skipped td:first-child{background:var(--red-soft)}

  /* the search box and whatever sits beside it get a line each */
  .srch{max-width:none;width:100%;flex:1 1 100%}

  /* the button and the line explaining it were sharing a row and the
     sentence wrapped around the button; one under the other reads */
  .addform .act{flex-direction:column;align-items:stretch;gap:10px}
  .addform .act .btn{width:100%}
  .addform .act .hintline{flex:1 1 auto}

  #inv{padding:16px 14px}
  .iband{flex-direction:column}
  .iband .lft{border-right:none;border-bottom:1px solid #1a1a1a}
  .iband .rgt{width:auto}
}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  /* nothing scrolls on paper: a wrapper must not clip a wide table */
  .twrap{overflow:visible}
  header,nav,.noprint{display:none!important}
  main{padding:0;max-width:none}
  #inv{border:none;border-radius:0;padding:0;box-shadow:none}
  @page{size:A4;margin:12mm}
}

<body>

<header>
  <button id="burger" type="button" onclick="toggleSide()" aria-label="Menu">&#9776;</button>
  <div class="brand"><span class="mk" aria-hidden="true">VF</span><span>Velora Fresh<small>Velora Innovations Pvt Ltd</small></span></div>
  <!-- no inline widths: in the header they sit at their own size, in the
       drawer on a phone they fill the width -->
  <select id="roleSel" onchange="setRole(this.value)"></select>
  <span id="whoami" class="hidden"></span>
  <input type="date" id="dateSel" onchange="setDate(this.value)">
  <span class="spacer"></span>
  <label id="anyBox" class="hidden" style="font-size:12.5px;color:#6b6b66;display:flex;align-items:center;gap:5px;cursor:pointer">
    <input type="checkbox" id="anyChk" style="width:auto" onchange="setAnytime(this.checked)"> Ignore the 6–9 pm indent window
  </label>
  <button id="themeBtn" type="button" onclick="toggleTheme()" aria-label="Light or dark"></button>
  <span id="syncState" class="syncdot hidden"><i></i><span></span></span>
  <button id="signOutBtn" class="btn sm hidden" type="button" onclick="doSignOut()">Sign out</button>
  <span id="clock" class="mono" style="font-size:13px;color:#6b6b66"></span>
</header>

<!-- sideTop holds whatever the header hands over on a phone; the menu
     itself is redrawn on every render and must not take them with it -->
<!-- sideTop and sideFoot hold whatever the header hands over on a phone;
     the menu between them is redrawn on every render and must not take
     them with it -->
<aside id="side"><div id="sideTop" class="hidden"><div id="sideWho"></div></div><div id="sideNav"></div>
  <div id="sideFoot" class="hidden"></div></aside>
<div id="scrim" onclick="toggleSide(false)"></div>
<main id="main"></main>

<!-- Shown only when a Supabase key is configured. Without one the app
     behaves exactly as before and this stays hidden. -->
<div id="gate" class="hidden">
  <form class="box" onsubmit="doSignIn(event)">
    <div class="bd"><span class="mk">VF</span>
      <div><h1>Velora Fresh</h1><p class="co">Velora Innovations Pvt Ltd</p></div>
    </div>
    <p class="hint" id="gateWelcome">Welcome. Sign in to the supply desk.</p>
    <div class="f" id="gateWhoWrap"><label for="gateWho">Who is signing in</label>
      <select id="gateWho" onchange="setGateWho(this.value)">
        <option value="">Select</option>
        <option value="shop">Shop</option>
        <option value="admin">Manager</option>
        <option value="ho">Head office</option>
        <option value="owner">Owner</option>
      </select></div>
    <p class="hint" id="gateHint">Sign in to the supply desk.</p>
    <div id="gateErr"></div>
    <div class="f hidden" id="gateNameWrap"><label for="gateName">Your name</label>
      <input id="gateName" type="text" autocomplete="name" placeholder="As the office saved it"></div>
    <div class="f hidden" id="gatePhoneWrap"><label for="gatePhone">Phone number</label>
      <input id="gatePhone" type="tel" inputmode="numeric" autocomplete="tel"
             class="mono" placeholder="98400 00000"></div>
    <div class="f" id="gateEmailWrap"><label for="gateEmail">Email</label>
      <!-- not marked required: on the reset-link screen this box is hidden,
           and a hidden required box blocks the browser from submitting at
           all. The checks in doSignIn cover every mode instead. -->
      <input id="gateEmail" type="email" autocomplete="username"></div>
    <div class="f" id="gatePassWrap"><label for="gatePass">Password</label>
      <input id="gatePass" type="password" autocomplete="current-password"></div>
    <div class="f hidden" id="gateCodeWrap"><label for="gateCode">Six digit code</label>
      <input id="gateCode" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" class="mono" placeholder="000000"></div>
    <button class="btn pri" id="gateBtn" type="submit" style="width:100%">Sign in</button>
    <p class="foot" style="margin-top:12px" id="gateLinks"></p>
    <p class="foot" style="margin-top:6px">Your access is set by the owner. Contact them if you cannot get in.</p>
  </form>
</div>

<script>
/* ============================================================
   Velora Fresh — v1 working prototype
   Single file. All data in localStorage under VF_DB.
   Flow: indent -> accept -> rates -> packing -> delivery -> invoice
   ============================================================ */

/* ---------- product catalogue ----------
   code | name (English / Tamil) | unit | unit weight kg | selling margin % | alias
   Paste replacement rows here when the master sheet changes.        */
const PRODUCTS = `
@@PRODUCTS@@
`;

/* ---------- groups ----------
   One line per group: <group name>|<code>,<code>,...
   The group name is also the vendor label until a vendor record is filled in. */
const GROUP_LIST = `
@@GROUPS@@
`;

/* ---------- shops ----------
   id, name, bill prefix, commission % (goes into the per-kg rate) */
const SHOPS = [
  {id:'KLP', name:'Kilpauk',      prefix:'VF/KLP', comm:4, phone:''},
  {id:'NGB', name:'Nungambakkam', prefix:'VF/NGB', comm:4},
  {id:'SHN', name:'Shenoy Nagar', prefix:'VF/SHN', comm:4},
  {id:'MBK', name:'Mambakkam',    prefix:'VF/MBK', comm:4},
  {id:'HRN', name:'Hiranandani',  prefix:'VF/HRN', comm:4}
];

const CLIENT = 'Kalpaviruksha Pazhamudir Nilayam';
/* The indent window: shops were meant to send between 6 and 9 pm, with
   anything up to 11:30 recorded as late.

   It is switched off. A shop sends its indent whenever it is ready, at
   any hour, and nothing is marked late. The hours below and every
   screen that reads them are left where they are — turning WINDOW_ON
   back to true restores the rule exactly as it was, and is the only
   change needed to do it. */
const WINDOW_ON = false;
const OPEN_H = 18, CLOSE_H = 21, LATE_H = 23.5;   /* 6pm / 9pm / 11:30pm */

/* ---------- catalogue parse ---------- */
const CAT = {}, ALIAS = {};
PRODUCTS.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
  const f = line.split('|');
  const code = (f[0]||'').trim();
  if(!code) return;
  const full = (f[1]||'').trim();
  const bits = full.split(' / ');
  CAT[code] = {
    code, name: bits[0].trim(), tamil: (bits[1]||'').trim(), full,
    unit: (f[2]||'kg').trim() || 'kg',
    wt: parseFloat(f[3]) || 0,
    margin: f[4]!==undefined && f[4].trim()!=='' ? parseFloat(f[4]) : null,
    alias: (f[5]||'').trim()
  };
  if(CAT[code].alias) ALIAS[CAT[code].alias.toUpperCase()] = code;
});
const CODES = Object.keys(CAT);

/* ---------- groups parse ---------- */
const GROUPS = {}, CODE2GROUP = {};
GROUP_LIST.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
  const i = line.indexOf('|'); if(i<0) return;
  const name = line.slice(0,i).trim();
  const codes = line.slice(i+1).split(',').map(c=>c.trim()).filter(Boolean);
  GROUPS[name] = codes;
  codes.forEach(c=>{ CODE2GROUP[c] = name; });
});
/* anything not listed in a group tab is a manual-order group of its own */
const UNGROUPED = 'Manual order';
GROUPS[UNGROUPED] = CODES.filter(c=>!CODE2GROUP[c]);
GROUPS[UNGROUPED].forEach(c=>{ CODE2GROUP[c] = UNGROUPED; });
const GROUPNAMES = Object.keys(GROUPS);
function groupOf(code){ return CODE2GROUP[code] || UNGROUPED; }

function unitWeight(c, unit){
  const e = CAT[c]; if(!e) return 1;
  const u = unit || e.unit;
  if(u === 'g') return 0.001;
  if(u === 'box' || u === 'tray') return e.wt || 0;
  return 1;
}
function netKg(code, qty, unit){ return (parseFloat(qty)||0) * unitWeight(code, unit); }

/* ---------- storage ---------- */
const KEY = 'VF_DB';
let DB;
function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ DB = null; }
  if(!DB) DB = {};
  DB.indents = DB.indents || {};   /* [date][shopId] = {status, lines:{code:qty}, submittedAt, late} */
  DB.days    = DB.days    || {};   /* [date] = {rates:{code:r}, packed:{shop:{code:q}}, ship:{shop:status}} */
  DB.invoices= DB.invoices|| {};   /* [date][shopId] = {no, lines:[...], total} */
  DB.master  = DB.master  || {};
  DB.master.comm    = DB.master.comm    || {};
  DB.master.selling = DB.master.selling || {};
  DB.serial   = DB.serial   || {};
  DB.settings = DB.settings || {anytime:false};
  DB.vendors  = DB.vendors  || {};
  GROUPNAMES.forEach(g=>{
    if(!DB.vendors[g]) DB.vendors[g] = {name:g, phone:'', contact:'', address:'', notes:'',
                                        manual:(g.toLowerCase()==='others' || g===UNGROUPED),
                                        bank:{acName:'',acNo:'',ifsc:'',upi:''}};
  });
  DB.payments = DB.payments || [];   /* [{id,date,amount,mode,ref}] chain-level, oldest-bill-first */
  SHOPS.forEach(s=>{ if(DB.master.comm[s.id]===undefined) DB.master.comm[s.id] = s.comm; });
  DB.shopPhones = DB.shopPhones || {};
  SHOPS.forEach(s=>{ if(DB.shopPhones[s.id]) s.phone = DB.shopPhones[s.id]; });
  return DB;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  /* Local write already done above, so the app never waits on the
     network. This only queues the changed rows. No-op when the sync
     layer is absent or unconfigured. */
  try{ if(typeof VFSync !== 'undefined' && VFSync.enabled()) VFSync.record(DB); }catch(e){}
}
load();

/* ============================================================
   Light or dark
   ============================================================
   Runs before the first render so the page never flashes the wrong
   one. No stored choice means follow the operating system. */
(function(){
  try{
    const saved = localStorage.getItem('VF_THEME');
    if(saved === 'dark' || saved === 'light')
      document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

function currentTheme(){
  const set = document.documentElement.getAttribute('data-theme');
  if(set) return set;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ? 'dark' : 'light';
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('VF_THEME', t); }catch(e){}
  paintThemeButton();
}

function toggleTheme(){ applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }

function paintThemeButton(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  const dark = currentTheme() === 'dark';
  /* shows what you would switch to, not what you are on */
  b.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round"><circle cx="12" cy="12" r="4"/>'
      + '<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4'
      + 'M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  b.title = dark ? 'Switch to light' : 'Switch to dark';
}

/* ---------- deployment config (inlined by src/build.py) ---------- */
@@CONFIG@@

/* ---------- Supabase sync (inlined by src/build.py) ---------- */
@@SYNC@@

/* ============================================================
   Sign in
   ============================================================
   With no anon key configured VFSync.enabled() is false, the gate
   never shows, and the role dropdown works as it always has. Once a
   key is present the dropdown is replaced by the role the database
   reports for the signed-in account — the browser never chooses it.
   ============================================================ */

function gateEl(){ return document.getElementById('gate'); }

function showGate(msg){
  const g = gateEl(); if(!g) return;
  g.classList.remove('hidden');
  document.getElementById('gateErr').innerHTML =
    msg ? '<div class="err">' + esc(msg) + '</div>' : '';
}
function hideGate(){ const g = gateEl(); if(g) g.classList.add('hidden'); }

/* ============================================================
   The gate
   ============================================================
   Four things happen here, and which one depends on GATE_MODE:

     in      email and password
     code    a six digit code emailed instead of a password
     forgot  ask for a reset email
     set     choose a new password, after following a reset link
     up      create an account against an invite

   Owner, admin and head office have real email addresses, so Supabase
   sends all of this itself. Shop staff do not — their login is derived
   from their phone and the owner hands the password over on WhatsApp,
   so the code and reset options simply will not reach them. That is
   why the wording says "if you have an email".
   ============================================================ */

let GATE_MODE = 'in';
let CODE_SENT_TO = '';

const GATE_TEXT = {
  in:     { hint: 'Sign in to the supply desk.',                       btn: 'Sign in' },
  code:   { hint: 'We will email you a six digit code.',               btn: 'Email me a code' },
  forgot: { hint: 'We will email you a link to set a new password.',   btn: 'Send the link' },
  set:    { hint: 'Choose a new password.',                            btn: 'Save password' },
  up:     { hint: 'Create your account with the email the owner added.',btn: 'Create account' },
};

/* the wording on the button, which for the code screen depends on
   whether the code has gone out yet */
function gateBtnLabel(){
  if(GATE_MODE === 'code' && CODE_SENT_TO) return 'Sign in with the code';
  return (GATE_TEXT[GATE_MODE] || GATE_TEXT.in).btn;
}

/* Who is signing in decides what is asked for. A shop has no email at
   all — they sign in with the three things the office gave them, name,
   phone and password — while everyone else has a real address and gets
   the emailed code and the reset link with it.

   Always blank when the page opens, on purpose and not for want of
   remembering: the card is meant to greet a person by name and one
   question, and a device left on yesterday's answer would show a shop
   form to whoever picks the phone up next.

   'office' is still accepted, from when this was two buttons. */
let GATE_WHO = '';

function isShopWho(w){ return w === 'shop'; }

function setGateWho(w){
  GATE_WHO = (w === 'office') ? 'admin' : (w || '');
  const sel = document.getElementById('gateWho');
  if(sel && sel.value !== GATE_WHO) sel.value = GATE_WHO;
  setGateMode('in');
}

function show(id, yes){
  document.getElementById(id).className = yes ? 'f' : 'f hidden';
}

function setGateMode(m){
  GATE_MODE = m;
  /* a reset link knows who it belongs to, so the question does not apply */
  const asked  = (m === 'set') || !!GATE_WHO;
  const shop   = isShopWho(GATE_WHO) && m !== 'set';
  const t = GATE_TEXT[m] || GATE_TEXT.in;
  /* the greeting belongs to the empty card only — once a role is picked
     the hint below the dropdown says what to type, and the reset screen
     writes its own welcome */
  document.getElementById('gateWelcome').className = asked ? 'hint hidden' : 'hint';
  document.getElementById('gateHint').textContent =
    !asked ? ''    /* the welcome above says it, and the dropdown is labelled */
           : shop ? 'Your name, phone number and password.' : t.hint;
  document.getElementById('gateBtn').textContent = gateBtnLabel();

  const showPass = asked && (m === 'in' || m === 'up' || m === 'set');
  const showCode = asked && (m === 'code' && CODE_SENT_TO && !shop);
  show('gateWhoWrap',   m !== 'set');
  show('gateNameWrap',  asked && shop);
  show('gatePhoneWrap', asked && shop);
  show('gateEmailWrap', asked && !shop && m !== 'set');
  show('gatePassWrap',  showPass);
  show('gateCodeWrap',  showCode);
  document.getElementById('gateBtn').className = asked ? 'btn pri' : 'btn pri hidden';
  document.getElementById('gatePass').setAttribute('autocomplete',
    (m === 'up' || m === 'set') ? 'new-password' : 'current-password');

  const links = document.getElementById('gateLinks');
  if(m === 'set' || !asked){ links.innerHTML = ''; }
  else if(shop){
    /* no code, no reset link: there is no address to send either to.
       The office resets it and sends the new one on WhatsApp. */
    links.innerHTML = '<span style="opacity:.8">Forgotten it? Ask the office to reset it '
      + 'and send you a new one on WhatsApp.</span>';
  }
  else if(m === 'in'){
    links.innerHTML = '<a href="#" id="gateCodeLink" onclick="setGateMode(\'code\');return false">Email me a code instead</a>'
      + ' &middot; <a href="#" id="gateForgot" onclick="setGateMode(\'forgot\');return false">Forgot password</a>'
      + '<br><span style="opacity:.8">First time here?</span> '
      + '<a href="#" id="gateSwap" onclick="setGateMode(\'up\');return false">Create your account</a>';
  }else{
    /* the same id, so the one link toggles both ways */
    links.innerHTML = '<a href="#" id="gateSwap" onclick="setGateMode(\'in\');return false">Back to password sign in</a>';
  }
  document.getElementById('gateErr').innerHTML = '';
}

/* kept for the older call sites */
function swapGateMode(ev){
  if(ev) ev.preventDefault();
  setGateMode(GATE_MODE === 'up' ? 'in' : 'up');
}

function gateNote(html){
  document.getElementById('gateErr').innerHTML = '<div class="notice">' + html + '</div>';
}

/* Two people can share a phone at a shop, and the office writes the name
   down its own way. Compared on the letters alone: case, spaces, dots and
   initials are not what anyone is trying to check here. */
function sameName(a, b){
  const tidy = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  return tidy(a) !== '' && tidy(a) === tidy(b);
}

async function shopSignIn(name, phone, pass){
  /* the phone finds the account, the password opens it, and the name has
     to match the one the office saved against it */
  await VFSync.signInShop(phone, pass, SHOPS.map(s => s.id));
  const me = await VFSync.whoami();
  if(!me){
    VFSync.signOut();
    showGate('That login works, but the office has not given it a shop yet. Ask them to check it.');
    return;
  }
  if(!sameName(name, me.full_name)){
    VFSync.signOut();
    showGate('That name does not match the one saved for this phone number. '
           + 'Ask the office which name they entered for you.');
    return;
  }
  await afterSignIn(me);
}

async function doSignIn(ev){
  ev.preventDefault();
  const btn   = document.getElementById('gateBtn');
  const email = document.getElementById('gateEmail').value.trim();
  const pass  = document.getElementById('gatePass').value;
  const code  = document.getElementById('gateCode').value.trim();
  const name  = document.getElementById('gateName').value.trim();
  const phone = document.getElementById('gatePhone').value.replace(/[^0-9]/g, '');
  const mode  = GATE_MODE;

  if(isShopWho(GATE_WHO) && mode !== 'set'){
    if(!name)              { showGate('Enter your name.'); return; }
    if(phone.length < 10)  { showGate('Enter the ten digit phone number the office saved.'); return; }
    if(!pass)              { showGate('Enter your password.'); return; }
    btn.disabled = true; btn.textContent = 'Please wait...';
    try{ await shopSignIn(name, phone, pass); }
    catch(e){ showGate(e.message || 'That did not work'); }
    finally{ btn.disabled = false; btn.textContent = gateBtnLabel(); }
    return;
  }

  if(mode !== 'set' && !email){ showGate('Enter your email address.'); return; }
  if((mode === 'up' || mode === 'set') && pass.length < 8){
    showGate('Choose a password of at least 8 characters.'); return;
  }
  if(mode === 'in' && !pass){ showGate('Enter your password.'); return; }

  btn.disabled = true; btn.textContent = 'Please wait...';
  try{
    if(mode === 'forgot'){
      await VFSync.sendRecovery(email);
      /* said the same way whether or not the address exists, so this
         cannot be used to find out who has an account */
      setGateMode('in');
      gateNote('If that address has an account, a reset link is on its way. '
             + 'Shop staff have no email &mdash; ask the owner to reset yours.');
      return;
    }

    if(mode === 'code'){
      if(!CODE_SENT_TO){
        await VFSync.sendLoginCode(email);
        CODE_SENT_TO = email;
        setGateMode('code');
        gateNote('Code sent to ' + esc(email) + '. It is good for a few minutes.');
        return;
      }
      if(!/^[0-9]{6}$/.test(code)){ showGate('Enter the six digit code from the email.'); return; }
      await VFSync.verifyLoginCode(CODE_SENT_TO, code);
      CODE_SENT_TO = '';
    }else if(mode === 'set'){
      await VFSync.setOwnPassword(pass);
      /* they followed an emailed link, so they are office side whatever
         the tab was set to before */
      setGateWho(GATE_WHO && !isShopWho(GATE_WHO) ? GATE_WHO : 'admin');
      gateNote('Password saved. Sign in with it.');
      return;
    }else if(mode === 'up'){
      const r = await VFSync.signUp(email, pass);
      if(!r.signedIn){
        setGateMode('in');
        gateNote('Account created. Check your email for the confirmation link, then sign in.');
        return;
      }
    }else{
      await VFSync.signIn(email, pass);
    }
    await afterSignIn();
  }catch(e){
    showGate(e.message || 'That did not work');
  }finally{
    btn.disabled = false;
    /* worked out again rather than remembered, because a successful
       reset or code request has already moved us to another screen */
    btn.textContent = gateBtnLabel();
  }
}

function doSignOut(){
  VFSync.signOut();
  location.reload();
}

async function afterSignIn(known){
  /* the shop path has already read the row to check the name against it */
  const me = known || await VFSync.whoami();
  if(!me){
    VFSync.signOut();
    BOOTING = false;
    showGate('Your account works, but the owner has not given it access yet. Ask them to add this email under Master > Users.');
    render();
    return;
  }
  ME = me;
  ROLE = me.appRole;
  BOOTING = false;   /* the role is known: the right screen can be drawn */
  /* and the sync layer stops queueing rows this role may not write —
     before this it queued the whole local blob, which the database
     refused and the badge reported as a sync problem */
  VFSync.setWho(me.role, me.shop_id);
  /* now that the role is known, honour what the url asked for */
  if(BOOT_TAB && tabsFor().filter(t=>t.id===BOOT_TAB).length) TAB = BOOT_TAB;
  BOOT_TAB = null;
  try{
    const cat = await VFSync.fetchCatalogue();
    mergeCatalogue(cat);
  }catch(e){ /* offline: the compiled catalogue still stands */ }
  try{ await VFSync.pull(DB); }catch(e){ /* offline: carry on with local data */ }
  hideGate();
  const so = document.getElementById('signOutBtn');
  if(so) so.classList.remove('hidden');
  /* The role now comes from the database, so the dropdown would be a
     lie — it cannot change what the server will allow. */
  const rs = document.getElementById('roleSel');
  if(rs) rs.classList.add('hidden');
  const who = document.getElementById('whoami');
  if(who){
    const label = {owner:'Owner', admin:'Manager', ho:'Head office'}[me.role]
                || ((shopById(me.shop_id) || {}).name || me.shop_id);
    const tone  = me.role === 'owner' ? 'p-green' : me.role === 'admin' ? 'p-blue' : 'p-grey';
    who.innerHTML = '<b>' + esc(me.full_name || 'Signed in') + '</b>'
                  + '<span class="pill ' + tone + '">' + esc(label) + '</span>';
    who.classList.remove('hidden');
  }
  render();
  VFSync.push();
}

let ME = null;

/* "Sync problem" on its own cannot be acted on, and the reason was only
   ever in the browser console — which nobody at a shop is going to open.
   The last one is kept and the badge hands it over when tapped. */
let SYNC_ERR = '';

function showSyncErr(){
  if(!SYNC_ERR){ alert('Everything has been saved to the server.'); return; }
  alert('The last thing that could not be saved:\n\n' + SYNC_ERR
        + '\n\nIt is still on this device and will be tried again. '
        + 'Read this out to whoever set the app up.');
}

function syncBadge(state, detail){
  const el = document.getElementById('syncState');
  if(!el) return;
  if(state === 'error'){ SYNC_ERR = String(detail || ''); }
  else if(state === 'synced'){ SYNC_ERR = ''; }
  el.style.cursor = 'pointer';
  el.title = state === 'error' ? String(detail || '') : '';
  el.onclick = showSyncErr;
  el.classList.remove('hidden','busy','bad','off');
  const label = el.lastElementChild;
  if(state === 'pushing'){ el.classList.add('busy'); label.textContent = 'Saving ' + detail; }
  else if(state === 'synced'){ label.textContent = 'Saved'; }
  else if(state === 'offline'){ el.classList.add('off'); label.textContent = 'Offline ' + detail + ' waiting'; }
  else if(state === 'signed-out'){ el.classList.add('bad'); label.textContent = 'Not signed in'; }
  else if(state === 'error'){ el.classList.add('bad'); label.textContent = 'Sync problem'; }
}

/* True from the moment the page opens with a session already stored,
   until whoami() has answered. The screen is held blank for that
   moment: the role is not known yet, so the first render would paint
   the dashboard — a tab every role can reach — and then jump to where
   you actually were as soon as the answer came back. */
let BOOTING = false;

if(typeof VFSync !== 'undefined' && VFSync.enabled()){
  VFSync.on(syncBadge);

  /* A reset link, or the invite sent when the owner creates an account
     without a password, lands here carrying a session in the url. It is
     good for setting a password and nothing else — afterSignIn still
     checks app_users before anyone gets in. */
  const recovered = VFSync.adoptRecoverySession();
  if(recovered === 'recovery' || recovered === 'invite' || recovered === 'signup'){
    showGate('');
    setGateMode('set');
    if(recovered !== 'recovery'){
      document.getElementById('gateHint').textContent =
        'Welcome to Velora Fresh. Choose the password you will sign in with.';
    }
  }else if(VFSync.signedIn()){
    BOOTING = true;
    afterSignIn().catch(() => {
      BOOTING = false;
      showGate('Could not reach the server. Sign in again.');
      render();
    });
  }else{
    showGate('');
    setGateWho('');
  }
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(n, dp){ dp = dp===undefined?2:dp; return (Math.round((n||0)*Math.pow(10,dp))/Math.pow(10,dp)).toString(); }
function shopById(id){ return SHOPS.filter(s=>s.id===id)[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- pricing ---------- */
function commOf(shopId){
  const v = DB.master.comm[shopId];
  return v===undefined || v===null || v==='' ? 0 : parseFloat(v)||0;
}
function purchaseRate(shopId, code){
  const mk = DB.days[DATE] && DB.days[DATE].rates ? DB.days[DATE].rates[code] : null;
  if(mk===undefined || mk===null || mk==='') return null;
  return (parseFloat(mk)||0) * (1 + commOf(shopId)/100);
}
function sellMargin(shopId, code){
  const s = DB.master.selling[shopId];
  if(s && s[code]!==undefined && s[code]!==null && s[code]!=='') return parseFloat(s[code]);
  const e = CAT[code];
  return (e && e.margin!==null && e.margin!==undefined) ? e.margin : null;
}
function sellingPrice(shopId, code){
  const p = purchaseRate(shopId, code);
  const m = sellMargin(shopId, code);
  if(p===null || m===null) return null;
  return p * (1 + m/100);
}

/* ---------- indent state helpers ---------- */
function indentOf(date, shopId){
  DB.indents[date] = DB.indents[date] || {};
  if(!DB.indents[date][shopId]) DB.indents[date][shopId] = {status:'draft', lines:{}, submittedAt:null, late:false};
  return DB.indents[date][shopId];
}
function dayOf(date){
  DB.days[date] = DB.days[date] || {rates:{}, packed:{}, ship:{}, extra:{}};
  const d = DB.days[date];
  d.rates = d.rates || {}; d.packed = d.packed || {}; d.ship = d.ship || {}; d.extra = d.extra || {};
  return d;
}
/* every product any shop has an accepted indent for, plus anything added at packing */
function uniqueCodes(date){
  const set = {};
  const day = dayOf(date);
  Object.keys(DB.indents[date]||{}).forEach(sid=>{
    const ind = DB.indents[date][sid];
    if(ind.status==='accepted' || ind.status==='packed' || ind.status==='shipped' || ind.status==='billed')
      Object.keys(ind.lines).forEach(c=>{ if(ind.lines[c]) set[c]=1; });
  });
  Object.keys(day.packed).forEach(sid=>{
    Object.keys(day.packed[sid]||{}).forEach(c=>{ set[c]=1; });
  });
  return Object.keys(set).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
}
function windowState(){
  if(!WINDOW_ON) return 'open';      /* no hours are enforced — see WINDOW_ON */
  if(DB.settings.anytime) return 'open';
  const n = new Date(); const h = n.getHours() + n.getMinutes()/60;
  if(h >= OPEN_H && h < CLOSE_H) return 'open';
  if(h >= CLOSE_H && h < LATE_H) return 'late';
  return 'closed';
}

/* The screen lives in the address bar, so a refresh comes back to the
   same place, back and forward work, and a link can be shared. The date
   rides along when it is not today, because "the rates I was looking
   at" usually means a particular day. */
function go(t, keepHash){
  TAB = t;
  /* the menu follows where you went, so a screen reached from anywhere
     else — a link, a button, the address bar — shows under its group */
  const holds = grpHolding(t);
  if(holds) OPENGRP = holds;
  toggleSide(false);
  if(!keepHash) writeHash();
  render();
}

function writeHash(){
  const d = (DATE && DATE !== todayISO()) ? '/' + DATE : '';
  const want = '#' + TAB + d;
  if(location.hash !== want){
    /* replace, not push: switching screens should not stack up entries
       the back button has to walk through */
    history.replaceState(null, '', want);
  }
}

function readHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return null;
  const bits = raw.split('/');
  const tab  = bits[0];
  const date = bits[1];
  if(date && /^\d{4}-\d{2}-\d{2}$/.test(date)) DATE = date;
  return tab || null;
}

window.addEventListener('hashchange', function(){
  const t = readHash();
  if(t && t !== TAB){ TAB = t; render(); }
});

   Product list  —  the catalogue, read-only
   ============================================================ */
/* Fold what the server holds over the compiled catalogue. The build is
   the seed; anything added later lives only in the database, so without
   this a new product would vanish on reload and never reach anyone
   else's device. */
function mergeCatalogue(cat){
  if(!cat) return 0;
  let added = 0;
  (cat.products || []).forEach(r=>{
    const known = !!CAT[r.code];
    CAT[r.code] = {
      code: r.code, name: r.name, tamil: r.tamil || '',
      full: r.name + (r.tamil ? ' / ' + r.tamil : ''),
      unit: r.unit || 'kg',
      wt: parseFloat(r.unit_weight_kg) || 0,
      margin: known ? CAT[r.code].margin : null,
      alias: r.alias || '',
    };
    if(r.alias) ALIAS[String(r.alias).toUpperCase()] = r.code;
    if(!known){ CODES.push(r.code); added++; }
  });
  (cat.groups || []).forEach(g=>{
    if(!GROUPS[g.name]) GROUPS[g.name] = [];
    /* a group added on another device has no vendor record here yet, and
       the vendor screen reads its name straight away */
    if(!DB.vendors[g.name]){
      DB.vendors[g.name] = {name:g.name, phone:'', contact:'', address:'', notes:'',
                            manual:!!g.manual, bank:{acName:'',acNo:'',ifsc:'',upi:''}};
    }
  });
  (cat.mapping || []).forEach(m=>{
    const was = CODE2GROUP[m.product_code];
    if(was === m.group_name) return;
    if(was && GROUPS[was]){
      const i = GROUPS[was].indexOf(m.product_code);
      if(i > -1) GROUPS[was].splice(i, 1);
    }
    CODE2GROUP[m.product_code] = m.group_name;
    (GROUPS[m.group_name] = GROUPS[m.group_name] || []).push(m.product_code);
  });
  /* keep the menu order stable and put anything unmapped in Manual order */
  GROUPNAMES.length = 0;
  Object.keys(GROUPS).forEach(g=> GROUPNAMES.push(g));
  CODES.forEach(c=>{
    if(!CODE2GROUP[c]){
      CODE2GROUP[c] = UNGROUPED;
      (GROUPS[UNGROUPED] = GROUPS[UNGROUPED] || []).push(c);
    }
  });
  return added;
}

function addProduct(){
  if(ROLE !== 'owner' && ROLE !== 'admin'){ alert('Only Velora may add a product.'); return; }
  const code  = document.getElementById('npCode').value.trim();
  const name  = document.getElementById('npPName').value.trim();
  const tamil = document.getElementById('npTamil').value.trim();
  const unit  = document.getElementById('npUnit').value;
  const group = document.getElementById('npGroup').value;
  const wt    = parseFloat(document.getElementById('npWt').value) || 0;

  if(!code){ alert('Enter a product code.'); return; }
  if(CAT[code]){ alert('Code '+code+' is already used by '+CAT[code].name+'.'); return; }
  if(!name){ alert('Enter the English name.'); return; }
  if((unit==='box'||unit==='tray') && !wt){
    alert('A '+unit+' needs its weight in kg, otherwise the invoice cannot price it.'); return;
  }

  const prod = {code:code, name:name, tamil:tamil, unit:unit, wt:wt, alias:'', group:group};

  const apply = ()=>{
    CAT[code] = {code:code, name:name, tamil:tamil,
                 full:name+(tamil?' / '+tamil:''), unit:unit, wt:wt, margin:null, alias:''};
    CODES.push(code);
    CODE2GROUP[code] = group;
    (GROUPS[group] = GROUPS[group] || []).push(code);
    PRODQ = '';
    render();
  };

  if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn()){
    VFSync.addProduct(prod).then(()=>{ apply(); })
      .catch(e=> alert('Could not add the product: ' + (e.message || e)));
  }else{
    /* no server configured — the app still works, but only here */
    apply();
  }
}

/* ============================================================
   Users  —  who can sign in, and as what
   ============================================================
   Owner only. Every function called here re-checks is_owner() inside
   the database, so this screen is a convenience, not the guard.

   Nobody is created here: making a login needs the service_role key,
   which must never reach a browser. The owner records an invite; the
   person signs up themselves and a trigger applies the invited role.
   ============================================================ */

let PEOPLE = null;          /* null = not fetched yet */
/* Shown once, after a login is created. Kept on screen rather than in an
   alert so the owner can read it out, copy it, or send it — an alert is
   gone the moment it is dismissed. */
let NEWLOGIN = null;
let PEOPLE_ERR = '';
let PEOPLE_BUSY = false;

const ROLE_NAME = {owner:'Owner', admin:'Manager', ho:'Head office', shop:'Shop'};

const ROLE_LABEL = {
  owner: 'Owner — full control, money and bank details',
  admin: 'Manager — runs the day, no money',
  ho:    'Head office — client side, read-only on money',
  shop:  'Shop — its own indent, deliveries and bills',
};

function loadPeople(){
  if(typeof VFSync === 'undefined' || !VFSync.enabled() || !VFSync.signedIn()){
    PEOPLE = []; PEOPLE_ERR = 'Sign in to manage users.'; render(); return;
  }
  PEOPLE_BUSY = true;
  VFSync.listPeople().then(rows=>{
    PEOPLE = rows || []; PEOPLE_ERR = '';
  }).catch(e=>{
    PEOPLE = []; PEOPLE_ERR = e.message || 'Could not load users';
  }).then(()=>{ PEOPLE_BUSY = false; render(); });
}

   + '<div class="card"><h3>Add a person</h3><div style="padding:15px 16px">'
   + '<div class="addform">'
   /* Role is asked first and alone, because every other box depends on
      the answer: a shop has no email and must have a shop, a phone and

      name and then taking the email box away under it read as a
      glitch. npRoleChanged() does the showing and hiding. */
   + '<div><label>Role <b class="req">*</b></label><select id="npRole" onchange="npRoleChanged()">'
   + '<option value="">Select</option>'

   + '<option value="ho">Head office</option>'

   + '<div class="pair"><input type="text" id="npPass" class="mono" placeholder="leave blank to email a link">'
   + '<button class="btn sm" type="button" onclick="suggestPass()" title="Suggest one">\u21bb</button></div></div>'
   /* the row itself stays, so the line telling them to pick a role has
      somewhere to sit; only the button waits for the answer */
   + '<div class="act">'
   + '<button class="btn pri hidden" id="npAddBtn" onclick="addPerson()"'
   + (PEOPLE_BUSY?' disabled':'')+'>Add</button>'
   + '<p class="hintline" id="npHint"></p>'
   + '</div></div></div></div>'

   /* ---- people ---- */
   + '<div class="card"><h3>People</h3><div class="twrap"><table><thead><tr>'
   + '<th>Name</th><th>Phone</th><th>Role</th><th>For</th><th class="c">Status</th><th></th>'
   + '</tr></thead><tbody>'
   + (rows || '<tr><td colspan="6"><div class="empty">Nobody yet.</div></td></tr>')
   + '</tbody></table></div></div>'

   + (invites.length
      ? '<div class="card"><h3>Waiting to sign up</h3><div class="twrap"><table><thead><tr>'
        + '<th>Name</th><th>Phone</th><th>Role</th><th>For</th><th></th>'
        + '</tr></thead><tbody>'+inv+'</tbody></table></div></div>'

   + 'should not exist at all &mdash; a wrong number, a test &mdash; and it cannot be undone.</div>';
}

+ (n.reset ? 'New password for ' : 'Login created for ')+esc(n.name)+'</h3>'

function newLoginMessage(){

function roleSelect(u, isMe){
  if(isMe) return '<span class="pill p-green">Owner</span>';
  let h = '<select onchange="changeRole(\''+u.id+'\',this.value)" style="width:auto;font-size:13px">';
  ['owner','admin','ho','shop'].forEach(r=>{
    /* a shop user cannot be re-tagged here: the row would need a shop id */
    if(r === 'shop' && u.role !== 'shop') return;
    if(u.role === 'shop' && r !== 'shop') return;
    h += '<option value="'+r+'"'+(u.role===r?' selected':'')+' title="'+esc(ROLE_LABEL[r])+'">'
       + ROLE_NAME[r]+'</option>';
  });
  return h + '</select>';
}

/* Supabase signs people in by email, and phone sign-in needs an SMS
   provider nobody has set up. Shop staff often have no email at all, so
   one is derived from their phone. It is a username, not an address:
   nothing is ever sent to it, and the account is created already
   confirmed.

   Built from the phone alone. It used to carry the shop code as well,
   which read nicely but could not be rebuilt at the gate — the person
   signing in types a phone number, not a shop. Accounts made under the
   old shape still work: VFSync.signInShop tries them too. */
function loginIdFor(role, phone, shopId){
  const digits = String(phone || '').replace(/[^0-9]/g, '');
  return 'p' + digits + '@shop.velorafresh.in';
}

function suggestPass(){
  /* no l, I, O, 0 or 1 — this gets read out over the phone */
  const a = 'abcdefghjkmnpqrstuvwxyz', A = 'ABCDEFGHJKMNPQRSTUVWXYZ', d = '23456789';
  const pool = a + A + d;
  let out = '';
  const r = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(r);
  for(let i=0;i<10;i++) out += pool.charAt(r[i] % pool.length);
  document.getElementById('npPass').value = out;
}

/* What is asked for follows the role, the same way the sign-in screen
   follows who is signing in. A shop cannot be emailed anything, so the
   email box is not there to be filled in by mistake. */
function npRoleChanged(){
  const role   = document.getElementById('npRole').value;
  const chosen = !!role;
  const shop   = role === 'shop';
  const set = (id, yes, cls) => {
    const el = document.getElementById(id);
    if(el) el.className = yes ? (cls || '') : ((cls ? cls + ' ' : '') + 'hidden');
  };
  set('npNameWrap',  chosen);
  set('npPhoneWrap', chosen);
  set('npShopWrap',  chosen && shop);
  set('npEmailWrap', chosen && !shop);
  set('npPassWrap',  chosen);
  set('npAddBtn',    chosen, 'btn pri');
  /* starred only where it is genuinely refused without: a shop signs in
     with its phone and password, an office login can be recorded as an
     invite against either an email or a phone */
  set('npPhoneReq', shop, 'req');
  set('npPassReq',  shop, 'req');
  document.getElementById('npPass').placeholder =
    shop ? 'set one and send it' : 'leave blank to email a link';
  document.getElementById('npHint').innerHTML = !chosen
    ? 'Choose the role first &mdash; what is asked for next depends on it.'
    : shop
    ? 'They sign in with the three things you type here &mdash; <b>name</b>, <b>phone</b> '
      + 'and <b>password</b>. Nothing is emailed; the panel that appears next sends them '
      + 'on WhatsApp. Use the name exactly as you want them to type it.'
    : 'Leave the password blank and an email goes to the address above with a link to set '
      + 'their own. Type one instead and the login works straight away, but nothing is sent '
      + '&mdash; you hand it over yourself.';
}

function addPerson(){
  const name  = document.getElementById('npName').value.trim();
  const phone = document.getElementById('npPhone').value.replace(/\s+/g,'');
  const role  = document.getElementById('npRole').value;
  /* the box is hidden for a shop, so anything left in it from the last
     person added is not theirs and must not decide which path is taken */
  const email = (role === 'shop') ? '' : document.getElementById('npEmail').value.trim();
  const shop  = document.getElementById('npShop').value;

  const pass = document.getElementById('npPass').value.trim();

  if(!role){ alert('Choose the role first.'); return; }
  /* a nameless row is unreadable in the list afterwards, and for a shop
     the name is one of the three things they type to get in */
  if(!name){
    alert(role === 'shop' ? 'A shop login needs a name — they sign in with it.'
                          : 'Enter the person’s name.');
    return;
  }
  if(!phone && !email){ alert('Enter a phone number or an email address.'); return; }
  if(role === 'shop' && !phone){ alert('A shop login needs a phone number.'); return; }
  if(pass && pass.length < 8){ alert('Use a password of at least 8 characters.'); return; }

  /* No email typed but a password given: derive a login id from the
     phone rather than refusing. Nothing is emailed to it. */
  let loginId = email;
  if(pass && !loginId){
    if(!phone){ alert('Enter a phone number, or an email address.'); return; }
    loginId = loginIdFor(role, phone, shop);
  }

  const common = {
    role: role, name: name, phone: phone || null, email: (email || null),
    clientId: (role === 'shop' || role === 'ho') ? VF_CONFIG.clientId : null,
    shopId:   (role === 'shop') ? shop : null,
  };

  const done = ()=>{ PEOPLE = null; loadPeople(); };
  const failed = (e)=>{
    PEOPLE_BUSY = false;
    alert('Could not add: ' + (e.message || e));
    render();
  };

  PEOPLE_BUSY = true; render();

  /* the edge function is not up yet — record an invite rather than
     leaving the owner with nothing */
  const fallback = (why)=>{
    VFSync.invitePerson(common).then(()=>{
      alert(why);
      done();
    }).catch(failed);
  };

  if(pass){
    VFSync.createUser(Object.assign({}, common, {password: pass, email: loginId}))
      .then(()=>{
        NEWLOGIN = {name: name || loginId, login: loginId, pass: pass, phone: phone,
                    shop: !email};
        done();
      })
      .catch(e=>{
        if(e.notDeployed){
          fallback('Creating logins directly is not switched on for this project yet, '
                 + 'so an invite was recorded instead. They can sign up with '
                 + email + ' and choose their own password.');
        }else failed(e);
      });
  }else if(email){
    /* No password and a real address: the account is created and Supabase
       emails them a link to choose their own first password. */
    VFSync.createUser(Object.assign({}, common, {email: email}))
      .then(()=>{
        alert('Account created for ' + email + '. They have been emailed a link '
            + 'to set their own password. It is good for 24 hours — if they miss '
            + 'it, they can use Forgot password on the sign in screen.');
        done();
      })
      .catch(e=>{
        if(e.notDeployed){
          fallback('Sending the invite email is not switched on for this project yet, '
                 + 'so an invite was recorded instead. They can sign up with '
                 + email + ' and choose their own password.');
        }else failed(e);
      });
  }else{
    /* Nothing to email to. Recorded so the role is waiting for them. */
    VFSync.invitePerson(common).then(done).catch(failed);
  }
}

function changeRole(id, role){
  VFSync.setPersonRole(id, role)
    .then(()=>{ PEOPLE = null; loadPeople(); })
    .catch(e=>{ alert(e.message || e); PEOPLE = null; loadPeople(); });
}

/* Shop staff have no email, so there is no reset link to send. The owner
   sets a new password and sends it the same way the first one went. */
function resetFor(id){
  const u = (PEOPLE || []).filter(p=>p.id === id)[0];
  if(!u) return;
  if(!confirm('Set a new password for ' + (u.full_name || 'this person') + '?\n\n'
            + 'Their old one stops working straight away.')) return;

  const a = 'abcdefghjkmnpqrstuvwxyz', A = 'ABCDEFGHJKMNPQRSTUVWXYZ', d = '23456789';
  const pool = a + A + d;
  const r = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(r);
  let pass = '';
  for(let i=0;i<10;i++) pass += pool.charAt(r[i] % pool.length);

  PEOPLE_BUSY = true; render();
  VFSync.resetPassword(id, pass)
    .then(res=>{
      NEWLOGIN = {
        name: u.full_name || 'this person',
        login: (res && res.email) || u.phone || '(their usual login)',
        pass: pass, phone: u.phone, reset: true,
        /* a derived id is not an address, and is not what they type */
        shop: /@shop\.velorafresh\.in$/.test((res && res.email) || ''),
      };
      PEOPLE = null; loadPeople();
    })
    .catch(e=>{
      PEOPLE_BUSY = false;
      alert(e.notDeployed
        ? 'Resetting needs the create-user function deployed in Supabase. '
          + 'Until then, change the password from Supabase > Authentication > Users.'
        : ('Could not reset: ' + (e.message || e)));
      render();
    });
}

function togglePerson(id, active){
  VFSync.setPersonActive(id, active)
    .then(()=>{ PEOPLE = null; loadPeople(); })
    .catch(e=>{ alert(e.message || e); PEOPLE = null; loadPeople(); });
}

/* Deleting is not the usual answer — switching somebody off keeps the
   record of who did what — so the name has to be read before it happens,
   and the wording says which of the two halves is going. If the edge
   function is not deployed the access can still be taken away from here,
   because an owner may write app_users; the sign-in itself survives that
   and the owner is told so rather than left thinking it is gone. */
function deletePerson(id, name){
  const who = name || 'this person';
  if(!confirm('Delete ' + who + '?\n\nTheir login is removed and they cannot sign in again. '
              + 'To stop someone temporarily, use Deactivate instead.')) return;
  const done = (r)=>{
    PEOPLE = null; loadPeople();
    if(r && r.accessOnly){
      alert('Deleted. They are off the list and can no longer see anything.\n\n'
            + 'The sign-in behind them is still on the server — removing that needs the '
            + 'create-user function, which this project has not been given yet '
            + '(docs/DEPLOY.md). Until it is, adding the same phone number or email '
            + 'again will say the login already exists.');
    }
  };
  VFSync.removePerson(id)
    .then(done)
    .catch(e=>{
      if(e.notDeployed){
        VFSync.removeAccess(id).then(done).catch(err=>{
          alert('Could not delete: ' + (err.message || err)); PEOPLE = null; loadPeople();
        });
        return;
      }
      alert('Could not delete: ' + (e.message || e));
      PEOPLE = null; loadPeople();
    });
}

function dropInvite(id){
  if(!confirm('Cancel this invite?')) return;
  VFSync.cancelInvite(id)
    .then(()=>{ PEOPLE = null; loadPeople(); })
    .catch(e=>{ alert(e.message || e); PEOPLE = null; loadPeople(); });
}

/* The number the pack list and the bill go to. Kept on the shop rather
   than the person, because managers change and the shop's number does
   not. */
function setShopPhone(id, v){
  const sh = shopById(id); if(!sh) return;
  sh.phone = String(v || '').replace(/\s+/g,'');
  DB.shopPhones = DB.shopPhones || {};
  DB.shopPhones[id] = sh.phone;
  save();
}

function addShop(){
  if(ROLE !== 'owner'){ alert('Only an owner may add a shop.'); return; }
  const code = document.getElementById('nsCode').value.trim().toUpperCase();
  const name = document.getElementById('nsName').value.trim();
  const comm = parseFloat(document.getElementById('nsComm').value);

  if(!/^[A-Z]{2,4}$/.test(code)){ alert('The code must be 2 to 4 letters, A to Z.'); return; }
  if(!name){ alert('Enter the shop name.'); return; }
  if(SHOPS.filter(s=>s.id===code).length){ alert(code+' already exists.'); return; }
  if(isNaN(comm) || comm < 0){ alert('Enter a commission percentage.'); return; }

  const shop = {id:code, name:name, prefix:'VF/'+code, comm:comm};
  SHOPS.push(shop);
  DB.master.comm[code] = comm;
  save();

  /* The shop must reach the shops table before anything can reference
     it — margin_comm and every indent carry a foreign key to it. */
  if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn()){
    VFSync.addShop(shop).then(()=>{ VFSync.push(); render(); })
      .catch(e=>{
        SHOPS.pop(); delete DB.master.comm[code]; save();
        alert('Could not add the shop: ' + (e.message || e));
        render();
      });
  }else{
    render();
  }
}



/* which group a screen sits under, '' for the ones that stand alone */
function grpHolding(t){
  const g = menuFor().filter(g=>!g.id && (g.kids||[]).some(k=>k.id===t))[0];
  return g ? g.t : '';
}

function drawSide(){
  const groups = menuFor();
  /* first draw of the day: open the group holding the current screen */
  if(OPENGRP === null) OPENGRP = grpHolding(TAB);
  let h = '';
  groups.forEach(g=>{
    if(g.id){
      h += '<div class="grp solo"><button class="'+(TAB===g.id?'on':'')+'" onclick="go(\''+g.id+'\')">'
         + icon(g.ic)+g.t+'</button></div>';
      return;
    }
    /* only the one: opening Delivery shuts Purchase, even while a
       Purchase screen is the one on show */
    const open = (OPENGRP===g.t);
    h += '<div class="grp'+(open?' open':'')+'">'
       + '<button onclick="toggleGrp(\''+g.t.replace(/'/g,"\\'")+'\')">'
       + icon(g.ic)+g.t+'<span class="cv">&#9654;</span></button>'
       + '<div class="kids">'
       + g.kids.map(k=>'<button class="'+(TAB===k.id?'on':'')+'" onclick="go(\''+k.id+'\')">'
                       + k.t+'</button>').join('')
       + '</div></div>';
  });
  document.getElementById('sideNav').innerHTML = h;
}

function toggleGrp(name){
  OPENGRP = (OPENGRP===name) ? '' : name;
  drawSide();
}

/* ---------- the header on a phone ----------
   Seven controls will not sit on one line at 390px, so the header wrapped
   to four rows — and the drawer, which hangs off the header's height,
   started halfway down the screen with its first menu items behind it.
   On a phone the header keeps the menu button and the name of the
   business, and everything else moves into the drawer, where there is
   room to read it. Moved back the moment there is width for it. */
/* not every browser has matchMedia, and an old till-counter tablet
   without it must not take the whole script down with it */
const PHONE = window.matchMedia ? window.matchMedia('(max-width:720px)') : null;
function onPhone(){ return PHONE ? PHONE.matches : (window.innerWidth <= 720); }
const HEADER_ORDER = Array.prototype.slice.call(document.querySelector('header').children);
/* who you are and the day you are working on belong together at the top;
   the way out belongs at the bottom, under the menu, where it cannot be
   pressed by accident. Light or dark stays in the header on a desk and
   is left out of the drawer — the phone follows its own setting. */
const SIDE_WHO  = ['whoami','roleSel','dateSel'];   /* one line, together */
const SIDE_TOP  = ['anyBox','syncState'];
const SIDE_FOOT = ['signOutBtn','clock'];

function placeHeaderControls(){
  const top  = document.getElementById('sideTop');
  const who  = document.getElementById('sideWho');
  const foot = document.getElementById('sideFoot');
  const head = document.querySelector('header');
  if(onPhone()){
    SIDE_WHO.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== who) who.appendChild(el);
    });
    SIDE_TOP.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== top) top.appendChild(el);
    });
    SIDE_FOOT.forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode !== foot) foot.appendChild(el);
    });
    top.classList.remove('hidden');
    foot.classList.remove('hidden');
  }else{
    /* appendChild moves rather than copies, so walking the original list
       puts every one of them back in the order it was written in */
    HEADER_ORDER.forEach(el=> head.appendChild(el));
    top.classList.add('hidden');
    foot.classList.add('hidden');
  }
}
if(PHONE && PHONE.addEventListener) PHONE.addEventListener('change', placeHeaderControls);
else if(PHONE && PHONE.addListener) PHONE.addListener(placeHeaderControls);
else window.addEventListener('resize', placeHeaderControls);

function toggleSide(force){
  const side = document.getElementById('side'), sc = document.getElementById('scrim');
  const open = force===undefined ? !side.classList.contains('open') : force;
  side.classList.toggle('open', open);
  sc.classList.toggle('on', open);
}

/* Every table gets something that can scroll around it.
   Most screens wrote their own, but sixteen did not, and on a phone one
   of those — packing, which is nine columns wide — pushed the whole
   page sideways instead of scrolling inside its card: the right hand
   column looked cut off rather than reachable. Done here rather than at
   sixteen call sites, so a table added later is covered too. */
function wrapTables(root){
  const tables = root.querySelectorAll('table');
  for(let i = 0; i < tables.length; i++){
    const t = tables[i], p = t.parentNode;
    if(!p || (p.className || '').indexOf('twrap') > -1) continue;
    const w = document.createElement('div');
    w.className = 'twrap';
    p.insertBefore(w, t);
    w.appendChild(t);
  }
  /* A table wider than the screen looked cut off rather than
     scrollable, which is the same thing as broken to whoever is holding
     the phone. Anything that can still be scrolled to the right is
     given a soft edge, and the edge goes away at the end of the run. */
  const wraps = root.querySelectorAll('.twrap');
  for(let i = 0; i < wraps.length; i++){
    const w = wraps[i];
    let outer = w.parentNode;
    if(!outer || (outer.className || '').indexOf('tscroll') < 0){
      outer = document.createElement('div');
      outer.className = 'tscroll';
      w.parentNode.insertBefore(outer, w);
      outer.appendChild(w);
    }
    const mark = () => outer.classList.toggle('more',
      w.scrollWidth - w.clientWidth - w.scrollLeft > 2);
    w.onscroll = mark;
    mark();
  }
}

          + '<option value="ho">Head office — '+esc(CLIENT)+'</option>';

  const tabs = tabsFor();
  /* a tab this role has no claim to falls back to its first screen */
  if(!tabs.filter(t=>t.id===TAB).length) TAB = tabs[0].id;

  }[TAB];
  m.innerHTML = fn ? fn() : '';
