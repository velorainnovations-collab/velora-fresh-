/* What the shop is looking at: neither belongs in the saved indent, so
   both live here and are re-applied after every render. */
let MYFILT = '', MYONLY = false;

function myFind(v){ MYFILT = v; myApplyFilter(); }
function myOnlyChosen(){ MYONLY = !MYONLY; render(); }

/* Done by hiding rows rather than by re-rendering, so the box being
   typed into keeps the cursor. */
function myApplyFilter(){
  const list = document.getElementById('mylist');
  if(!list) return;
  const q = String(MYFILT || '').toLowerCase().trim();
  const shown = {};
  const rows = list.querySelectorAll('tbody tr[data-k]');
  for(let i = 0; i < rows.length; i++){
    const tr = rows[i];
    const ok = (!q || tr.getAttribute('data-k').indexOf(q) > -1)
            && (!MYONLY || tr.hasAttribute('data-has'));
    tr.style.display = ok ? '' : 'none';
    if(ok) shown[tr.getAttribute('data-grp')] = true;
  }
  /* a heading with nothing under it is just noise */
  const heads = list.querySelectorAll('tbody tr.vgrp');
  for(let i = 0; i < heads.length; i++){
    heads[i].style.display = shown[heads[i].getAttribute('data-grp')] ? '' : 'none';
  }
}
function myQty(code, v){
  const ind = indentOf(DATE, ROLE);
  const q = parseFloat(v)||0;
  if(q<=0) delete ind.lines[code]; else ind.lines[code]=q;
  save(); render();
}
function myDel(code){ const ind = indentOf(DATE, ROLE); delete ind.lines[code]; save(); render(); }
function submitIndent(){
  const ind = indentOf(DATE, ROLE);
  const w = windowState();
  if(w==='closed'){ alert('The indent window is closed.'); return; }
  ind.status = 'submitted';
  ind.submittedAt = new Date().toISOString();
  ind.late = (w==='late');

}

/* product search (shared) */
function searchList(term){
  const t = (term||'').trim().toLowerCase();
  if(!t) return [];
  const out = [];
  for(let i=0;i<CODES.length && out.length<40;i++){
    const e = CAT[CODES[i]];
    if(e.code.indexOf(t)===0 || e.name.toLowerCase().indexOf(t)>=0 || e.tamil.indexOf(term.trim())>=0
       || (e.alias && e.alias.indexOf(t)===0)) out.push(e);
  }
  return out;
}
function wireSearch(onPick){
  const q = document.getElementById('q'), sug = document.getElementById('sug');
  if(!q) return;
  let hi = -1, list = [];
  function close(){ sug.style.display='none'; hi=-1; }
  function draw(){
    list = searchList(q.value);
    if(!list.length){ close(); return; }
    sug.innerHTML = list.map((e,i)=>'<div class="'+(i===hi?'hi':'')+'" data-c="'+e.code+'"><span class="mono">'+esc(e.code)+'</span> &nbsp;'+esc(e.name)+' <span style="color:#9a9a94">'+esc(e.tamil)+'</span></div>').join('');
    sug.style.display='block';
    Array.prototype.forEach.call(sug.children, el=>{
      el.onmousedown = ev=>{ ev.preventDefault(); onPick(el.getAttribute('data-c')); };
    });
  }
  q.oninput = draw;
  q.onblur = ()=> setTimeout(close, 150);
  q.onkeydown = ev=>{
    if(ev.key==='ArrowDown'){ hi=Math.min(hi+1,list.length-1); draw(); ev.preventDefault(); }
    else if(ev.key==='ArrowUp'){ hi=Math.max(hi-1,0); draw(); ev.preventDefault(); }
    else if(ev.key==='Enter'){
      const pick = hi>=0 ? list[hi] : (list.length?list[0]:null);
      if(pick){ onPick(pick.code); ev.preventDefault(); }
    } else if(ev.key==='Escape') close();
  };
  q.focus();
}

/* ============================================================
   ADMIN — day board
   ============================================================ */
function statusPill(s, late){
  const map = {draft:['p-grey','Not submitted'], submitted:['p-blue','Submitted'], accepted:['p-amber','Accepted'],
               packed:['p-amber','Packed'], shipped:['p-blue','Out for delivery'], received:['p-green','Received'], billed:['p-green','Billed']};
  const m = map[s] || map.draft;
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>'+(late?' <span class="pill p-red">Late</span>':'');
}
function shopStatus(shopId){
  const day = dayOf(DATE);
  if(DB.invoices[DATE] && DB.invoices[DATE][shopId]) return 'billed';
  if(day.ship[shopId]==='received') return 'received';
  if(day.ship[shopId]==='out') return 'shipped';
  const ind = indentOf(DATE, shopId);
  const packed = day.packed[shopId] || {};
  if(Object.keys(packed).length) return 'packed';
  return ind.status;
}
function vBoard(){
  const day = dayOf(DATE);
  let tiles='', totVal=0, totLines=0, indented=0, supplied=0;
  SHOPS.forEach(s=>{
    const ind = indentOf(DATE, s.id);
    const packed = day.packed[s.id]||{};
    let val=0, n=0;
    Object.keys(packed).forEach(c=>{
      const q=packed[c]; if(!q) return;
      n++; const pr=purchaseRate(s.id,c); if(pr!==null) val += netKg(c,q,CAT[c].unit)*pr;
    });
    totVal+=val; totLines+=n;
    indented += Object.keys(ind.lines).filter(c=>ind.lines[c]>0).length;
    supplied += n;
    const st = shopStatus(s.id);
    tiles += '<div class="tile t-'+st+'" onclick="openShop(\''+s.id+'\')">'
      + '<div class="nm">'+esc(s.name)+'</div>'
      + '<div class="big mono">'+(val?'&#8377;'+money(val):'&mdash;')+'</div>'
      + '<div class="sub" style="margin:0 0 7px">'+Object.keys(ind.lines).length+' indented &middot; '+n+' packed</div>'
      + statusPill(st, ind.late) + '</div>';
  });
  const fill = indented ? Math.round(supplied/indented*100) : 0;
  return '<h2>Day board</h2><p class="sub">'+fmtDate(DATE)+' &middot; '+esc(CLIENT)+'</p>'
   + '<div class="kpi">'

function vRates(){

  if(!codes.length) return '<h2>Rates</h2><p class="sub">'+fmtDate(DATE)+'</p><div class="card"><div class="empty">No accepted indents for this date yet.</div></div>';
  const yest = prevRates(DATE);
  const byGroup = {};
  codes.forEach(c=>{ const g=groupOf(c); (byGroup[g]=byGroup[g]||[]).push(c); });
  const gnames = Object.keys(byGroup).sort((a,b)=>{
    if(a===UNGROUPED) return 1; if(b===UNGROUPED) return -1;
    return GROUPNAMES.indexOf(a)-GROUPNAMES.indexOf(b);
  });
  let rows='';
  gnames.forEach(g=>{
   const vn = (DB.vendors[g] && DB.vendors[g].name) || g;
   rows += '<tr class="vgrp"><td colspan="4">'+esc(vn)+' &nbsp;<span style="font-weight:400;color:#7a7a74">'+byGroup[g].length+' items</span></td></tr>';
   byGroup[g].forEach(c=>{
    const e=CAT[c]; if(!e) return;
    const r = day.rates[c];
    const y = yest[c];
    let hint='';
    if(y!==undefined && y!==null && y!==''){
      if(r!==undefined && r!=='' && r!==null){
        const ch = ((parseFloat(r)-parseFloat(y))/parseFloat(y))*100;
        hint = 'y\'day &#8377;'+money(y)+(Math.abs(ch)>=15?' &middot; '+(ch>0?'+':'')+Math.round(ch)+'%':'');
      } else hint = 'y\'day &#8377;'+money(y);
    }
    const big = (y && r && Math.abs((parseFloat(r)-parseFloat(y))/parseFloat(y))>=0.15);
    /* what was actually bought from the vendor, so the rate is entered
       against the quantity on the bill rather than from memory */
    const bought = orderQty(DATE, c, (need[c] ? need[c].total : 0));
    rows += '<tr><td class="mono" style="width:58px">'+esc(c)+'</td>'
      + '<td>'+esc(e.name)+'<span class="tam">'+esc(e.tamil)+(hint?' &middot; '+hint:'')+'</span></td>'
      + '<td class="r mono" style="width:96px">'+(bought?num(bought):'&mdash;')
      + ' <span style="font-size:11.5px;color:var(--ink-4)">'+esc(e.unit)+'</span></td>'
      + '<td class="c" style="width:130px"><input type="number" min="0" step="any" class="row-inp mono" '
      + (big?'style="border-color:#e0a92c;background:#fdf9ef"':'')
      + ' value="'+(r===undefined||r===null?'':r)+'" onchange="setRate(\''+c+'\',this.value)"></td></tr>';
   });
  });
  const done = codes.filter(c=>day.rates[c]!==undefined && day.rates[c]!=='').length;
  return '<h2>Rates &mdash; '+fmtDate(DATE)+'</h2>'
   + '<p class="sub">Market rate per kg, same for every shop. '+done+' of '+codes.length+' entered, grouped by vendor bill.</p>'
   + '<div class="card narrow"><table><thead><tr><th>Code</th><th>Product</th>'
   + '<th class="r">Buying</th><th class="c">Market &#8377;/kg</th></tr></thead>'
   + '<tbody>'+rows+'</tbody></table></div>';

function makeInvoice(shopId){
  const day = dayOf(DATE);
  const packed = day.packed[shopId] || {};
  const lines = [];
  Object.keys(packed).forEach(c=>{
    const q = parseFloat(packed[c])||0;
    if(q<=0) return;                       /* skipped lines never reach the invoice */
    const e = CAT[c]; if(!e) return;
    const pr = purchaseRate(shopId, c);
    if(pr===null) return;
    const nk = netKg(c,q,e.unit);
    lines.push({code:c, name:e.name, tamil:e.tamil, unit:e.unit, qty:q, net:nk,
                rate:pr, amount:nk*pr, sell:sellingPrice(shopId,c)});
  });
  lines.sort((a,b)=>(parseInt(a.code)||0)-(parseInt(b.code)||0));
  if(!lines.length){ alert('Nothing priced to invoice for this shop.'); return; }
  const bad = lines.filter(l=>!(l.net>0));
  if(bad.length){
    alert('These products have no unit weight set, so they would bill as zero:\n\n'
      + bad.map(l=>'  '+l.code+'  '+l.name).join('\n')
      + '\n\nSet the weight in the product list, or change the quantity, then generate again.');
    return;
  }
  const total = lines.reduce((s,l)=>s+l.amount,0);
  const s = shopById(shopId);
  const mk = DATE.slice(5,7)+DATE.slice(0,4);
  const key = shopId+'-'+mk;
  DB.serial[key] = (DB.serial[key]||0)+1;
  const no = s.prefix+'/'+mk+'/'+String(DB.serial[key]).padStart(4,'0');
  DB.invoices[DATE] = DB.invoices[DATE] || {};
  DB.invoices[DATE][shopId] = {no, date:DATE, shopId, lines, total, roundOff: Math.round(total)-total};
  save(); INVSHOP = shopId; render();
}

/* amount in words, Indian system */
function words(n){
  n = Math.round(n||0);
  if(n===0) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x){ return x<20 ? a[x] : (b[Math.floor(x/10)] + (x%10?' '+a[x%10]:'')); }
  function three(x){ return (x>99? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100? two(x%100):''); }
  let out='';
  const cr=Math.floor(n/10000000); n%=10000000;
  const la=Math.floor(n/100000);   n%=100000;
  const th=Math.floor(n/1000);     n%=1000;
  if(cr) out += three(cr)+' Crore ';
  if(la) out += three(la)+' Lakh ';
  if(th) out += three(th)+' Thousand ';
  if(n)  out += three(n);
  return out.replace(/\s+/g,' ').trim();
}



/* ============================================================
   ORDERS — accepted indents grouped by vendor group, sent per group
   ============================================================ */
/* {code: {total, byShop:{shopId:qty}}} across every accepted indent for the day */
function dayRequirement(date){
  const need = {};
  SHOPS.forEach(s=>{
    const ind = (DB.indents[date]||{})[s.id];
    if(!ind) return;
    if(['accepted','packed','shipped','received','billed'].indexOf(ind.status)<0) return;
    Object.keys(ind.lines).forEach(c=>{
      const q = parseFloat(ind.lines[c])||0; if(q<=0) return;
      if(!need[c]) need[c] = {total:0, byShop:{}};
      need[c].total += q;
      need[c].byShop[s.id] = (need[c].byShop[s.id]||0) + q;
    });
  });
  return need;
}
function groupedRequirement(date){
  const need = dayRequirement(date), out = {};
  Object.keys(need).forEach(c=>{
    const g = groupOf(c);
    (out[g] = out[g] || []).push(c);
  });
  Object.keys(out).forEach(g=> out[g].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)));
  return {need:need, groups:out};
}
/* What is actually bought from the vendor. It starts as the sum of what
   the shops asked for, and can be changed before the order goes out — a
   vendor sells by the crate, a rate is better for ten kilos than for
   seven, and something is worth buying in hand. The shops' own figures
   are never touched by this: packing still divides what arrives between
   them line by line. */
function orderQty(date, code, fallback){
  const o = (dayOf(date).order || {});
  return (o[code] === undefined || o[code] === null || o[code] === '')
    ? fallback : Number(o[code]);
}
function setOrderQty(code, v){
  const day = dayOf(DATE);
  day.order = day.order || {};
  const q = parseFloat(v);
  if(v === '' || isNaN(q) || q < 0) delete day.order[code]; else day.order[code] = q;
  save(); render();
}
function orderEdited(date, code){
  const o = (dayOf(date).order || {});
  return o[code] !== undefined && o[code] !== null && o[code] !== '';
}

function orderText(date, g, codes, need){
  const v = DB.vendors[g] || {name:g};
  let t = 'VELORA FRESH — order for ' + fmtDate(date) + '\n' + (v.name||g) + '\n';
  codes.forEach(c=>{
    const e = CAT[c]; if(!e) return;
    const q = orderQty(date, c, need[c].total);
    t += '\n' + c + ' ' + e.name + ' — ' + num(q) + ' ' + e.unit + '\n   ';
    t += SHOPS.filter(s=>need[c].byShop[s.id]).map(s=> s.name+' '+num(need[c].byShop[s.id])).join(' | ');
  });
  t += '\n\n' + codes.length + ' items. Please pack shop-wise.';
  return t;
}

/* ============================================================
   WhatsApp
   ============================================================
   A wa.me link, not the Cloud API. It opens WhatsApp with the number
   and the message already typed; a person presses send. No Meta
   account, no approved templates, no per-message cost, and it works on
   a phone and on desktop WhatsApp alike.

   The trade is that it is not automatic. When the order format has
   settled, the Cloud API can replace waOpen() alone — every caller
   builds its text the same way and would not need to change.
   ============================================================ */

/* India is +91. A number saved as 9840000001 has to become 919840000001
   or wa.me silently opens a chat with nobody. */
function waNumber(raw){
  let n = String(raw || '').replace(/[^0-9]/g, '');
  if(!n) return '';
  if(n.length === 10) n = '91' + n;              /* bare Indian mobile */
  else if(n.length === 11 && n.charAt(0) === '0') n = '91' + n.slice(1);
  else if(n.length === 12 && n.slice(0,2) === '91') { /* already right */ }
  return n;
}

function waOpen(number, text){
  const n = waNumber(number);
  const url = 'https://wa.me/' + n + '?text=' + encodeURIComponent(text);
  /* opened in a new tab so a half-finished screen is never lost */
  const w = window.open(url, '_blank');
  if(!w) alert('Your browser blocked the WhatsApp window. Allow pop-ups for this site and try again.');
  return !!w;
}

/* Falls back to the clipboard when there is no number on file, so the
   message is never simply lost. */
function waSend(number, text, who){
  if(!waNumber(number)){
    copyText(text);
    alert('No WhatsApp number saved for ' + who + '.\n\n'
        + 'The message has been copied — paste it into WhatsApp, and add their '
        + 'number under Contacts > Vendors so next time it opens directly.');
    return false;
  }
  return waOpen(number, text);
}

function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  }catch(e){ return false; }
}

function markSent(g){ const day=dayOf(DATE); day.sent=day.sent||{}; day.sent[g]=true; save(); render(); }
function sendOrder(g){
  const gr = groupedRequirement(DATE);
  const v = DB.vendors[g]||{name:g,phone:''};
  const text = orderText(DATE, g, gr.groups[g]||[], gr.need);

  /* Marked as sent either way: a manual group is placed by phone, and a
     vendor with no number saved still had its order copied out. */
  if(v.manual){
    copyText(text);
    alert('This vendor is set to order by hand.\n\nThe order has been copied — '
        + 'read it out or paste it wherever you place it.');
  }else{
    waSend(v.phone, text, (v.name || g));
  }
  markSent(g);
}

/* ============================================================
   ACCOUNTS — weekly, Monday to Sunday, payment due Monday
   One chain-level payment, allocated oldest bill first.
   Owner records; head office reads.
   ============================================================ */
function weekStart(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const off = (dt.getDay() + 6) % 7;          /* Monday = 0 */
  dt.setDate(dt.getDate() - off);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function addDays(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
/* every bill ever raised, oldest first, shop order inside a day */
function allBills(){
  const out = [];
  Object.keys(DB.invoices).sort().forEach(d=>{
    SHOPS.forEach(s=>{
      const inv = DB.invoices[d][s.id];
      if(inv) out.push({date:d, shopId:s.id, no:inv.no, amount:Math.round(inv.total), lines:inv.lines.length});
    });
  });
  return out;
}
function totalPaid(){ return DB.payments.reduce((t,p)=>t+(parseFloat(p.amount)||0), 0); }
/* oldest-first settlement, recomputed every time so it can never drift */
function settled(){
  let pot = totalPaid();
  return allBills().map(b=>{
    const applied = Math.min(pot, b.amount);
    pot -= applied;
    return Object.assign({}, b, {paid:applied, due:b.amount-applied,
      state: applied>=b.amount ? 'cleared' : (applied>0 ? 'part' : 'open')});
  });
}
function vAccounts(){
  const canEdit = (ROLE==='owner');
  if(!ACCTWEEK) ACCTWEEK = weekStart(DATE);
  const ws = ACCTWEEK, we = addDays(ws, 6);
  const bills = settled();
  const before  = bills.filter(b=>b.date <  ws);
  const inWeek  = bills.filter(b=>b.date >= ws && b.date <= we);
  const opening = before.reduce((t,b)=>t+b.due, 0);
  const billed  = inWeek.reduce((t,b)=>t+b.amount, 0);
  const paidWk  = DB.payments.filter(p=>p.date>=ws && p.date<=we).reduce((t,p)=>t+(parseFloat(p.amount)||0),0);
  const closing = bills.filter(b=>b.date <= we).reduce((t,b)=>t+b.due, 0);

  /* per shop for the week */
  let shopRows='';
  SHOPS.forEach(s=>{
    const bs = inWeek.filter(b=>b.shopId===s.id);
    if(!bs.length){ shopRows += '<tr><td>'+esc(s.name)+'</td><td class="c mono">0</td><td class="r mono">&mdash;</td><td class="r mono">&mdash;</td></tr>'; return; }
    const amt = bs.reduce((t,b)=>t+b.amount,0), due = bs.reduce((t,b)=>t+b.due,0);
    shopRows += '<tr><td>'+esc(s.name)+'</td><td class="c mono">'+bs.length+'</td>'
      + '<td class="r mono">&#8377;'+money(amt)+'</td><td class="r mono">'+(due?'&#8377;'+money(due):'<span style="color:#14663f">cleared</span>')+'</td></tr>';
  });

  let billRows='';
  inWeek.forEach(b=>{
    const pill = b.state==='cleared' ? '<span class="pill p-green">Cleared</span>'
               : b.state==='part' ? '<span class="pill p-amber">Part &#8377;'+money(b.paid)+'</span>'
               : '<span class="pill p-grey">Open</span>';
    billRows += '<tr><td class="mono">'+esc(b.no)+'</td><td>'+fmtDate(b.date)+'</td><td>'+esc(shopById(b.shopId).name)+'</td>'
      + '<td class="r mono">&#8377;'+money(b.amount)+'</td><td>'+pill+'</td></tr>';
  });

  let payRows='';
  DB.payments.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(p=>{
    payRows += '<tr><td>'+fmtDate(p.date)+'</td><td>'+esc(p.mode)+'</td><td class="mono">'+(p.ref ? esc(p.ref) : '&mdash;')+'</td>'
      + '<td class="r mono">&#8377;'+money(p.amount)+'</td>'
      + (canEdit?'<td class="r"><button class="rm" onclick="delPay(\''+p.id+'\')">&times;</button></td>':'') + '</tr>';
  });

  const due = (closing>0);
  return '<h2>Accounts</h2><p class="sub">'+esc(CLIENT)+' &middot; week Monday to Sunday, payment due Monday</p>'
   + '<div class="bar"><button class="btn sm" onclick="shiftWeek(-7)">&larr; Previous</button>'
   + '<strong>'+fmtDate(ws)+' &ndash; '+fmtDate(we)+'</strong>'
   + '<button class="btn sm" onclick="shiftWeek(7)">Next &rarr;</button>'
   + '<span class="spacer"></span><button class="btn sm" onclick="window.print()">Print statement</button></div>'
   + '<div class="kpi">'
   + '<div><div class="lb">Opening balance</div><div class="vl mono">&#8377;'+money(opening)+'</div></div>'
   + '<div><div class="lb">Billed this week</div><div class="vl mono">&#8377;'+money(billed)+'</div></div>'
   + '<div><div class="lb">Received this week</div><div class="vl mono">&#8377;'+money(paidWk)+'</div></div>'
   + '<div><div class="lb">Balance due</div><div class="vl mono" style="'+(due?'color:#8c2020':'color:#14663f')+'">&#8377;'+money(closing)+'</div></div>'
   + '</div>'
   + '<div class="card"><h3>By shop</h3><table><thead><tr><th>Shop</th><th class="c">Bills</th><th class="r">Billed</th><th class="r">Still due</th></tr></thead>'
   + '<tbody>'+shopRows+'</tbody></table></div>'
   + '<div class="card"><h3>Bills this week</h3><table><thead><tr><th>Bill no</th><th>Date</th><th>Shop</th><th class="r">Amount</th><th>Status</th></tr></thead>'
   + '<tbody>'+(billRows||'<tr><td colspan="5" class="empty">No bills raised in this week.</td></tr>')+'</tbody></table></div>'
   /* the same form furniture as every other screen, rather than inline
      styles of its own: labels that follow the theme, boxes that line
      up, and a button that takes the width on a phone instead of having
      the sentence beside it wrap around it */
   + (canEdit ? '<div class="card noprint"><h3>Record a payment</h3><div style="padding:15px 16px">'
       + '<div class="addform">'
       + '<div><label>Date</label><input type="date" id="pDate" value="'+DATE+'"></div>'
       + '<div><label>Amount</label><input type="number" id="pAmt" min="0" step="any" placeholder="0.00"></div>'
       + '<div><label>Mode</label><select id="pMode"><option>NEFT</option><option>RTGS</option><option>UPI</option><option>Cheque</option><option>Cash</option></select></div>'
       + '<div><label>Reference</label><input type="text" id="pRef" placeholder="UTR / cheque no"></div>'
       + '<div class="act"><button class="btn pri" onclick="addPay()">Record payment</button>'
       + '<p class="hintline">Applied to the oldest unpaid bill first.</p></div>'
       + '</div></div></div>' : '')
   + '<div class="card"><h3>Payments received</h3><table><thead><tr><th>Date</th><th>Mode</th><th>Reference</th><th class="r">Amount</th>'
   + (canEdit?'<th></th>':'')+'</tr></thead>'
   + '<tbody>'+(payRows||'<tr><td colspan="'+(canEdit?5:4)+'" class="empty">Nothing received yet.</td></tr>')+'</tbody></table></div>';
}

}

   + '<div class="card"><table><thead><tr><th>Shop</th><th class="c">Commission %</th><th class="c">Selling margins set</th><th class="r">&#8377;100 becomes</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function vMasterShop(id){
  const s = shopById(id);
  DB.master.selling[id] = DB.master.selling[id] || {};
  const set = DB.master.selling[id];
  let rows='';
  CODES.forEach(c=>{
    const e = CAT[c];
    const v = set[c]!==undefined ? set[c] : (e.margin===null?'':e.margin);
    rows += '<tr><td class="mono" style="width:58px">'+esc(c)+'</td><td>'+esc(e.name)+'<span class="tam">'+esc(e.tamil)+'</span></td>'
      + '<td class="c" style="width:120px"><input type="number" min="0" step="0.01" class="row-inp mono" value="'+v+'" onchange="setSell(\''+id+'\',\''+c+'\',this.value)"></td></tr>';
  });
  return '<div class="bar"><button class="btn sm" onclick="MASTERSHOP=null;render()">&larr; Margin master</button></div>'
   + '<h2>'+esc(s.name)+' &mdash; selling margins</h2>'
   + '<p class="sub">Percentage on top of the purchase price. Blank prints no selling price for that product.</p>'
   + '<div class="card"><table><thead><tr><th>Code</th><th>Product</th><th class="c">Selling margin %</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function setAnytime(v){ DB.settings.anytime = !!v; save(); render(); }
function setComm(id, v){ DB.master.comm[id] = v===''?0:(parseFloat(v)||0); save(); render(); }
function setSell(id, code, v){
  DB.master.selling[id] = DB.master.selling[id] || {};
  if(v==='') DB.master.selling[id][code] = ''; else DB.master.selling[id][code] = parseFloat(v)||0;
  save();
}

/* ---------- test / debug hook ---------- */
function setPackShop(id){ PACKSHOP = id; render(); }
window.VF = {
  CAT:CAT, CODES:CODES, SHOPS:SHOPS,
  settled:function(){ return settled(); }, weekStart:weekStart,
  GROUPS:GROUPS, CODE2GROUP:CODE2GROUP,
  grouped:function(d){ return groupedRequirement(d); }, orderText:orderText,
  get DB(){ return DB; }, get DATE(){ return DATE; }, get ROLE(){ return ROLE; }, get TAB(){ return TAB; }
};

/* ---------- boot ---------- */
function tick(){
  const n = new Date();
  const w = windowState();
  const lbl = WINDOW_ON
    ? {open:'Indent window open', late:'Late window', closed:'Indent window closed'}[w] + ' · '
    : '';
  const el = document.getElementById('clock');
  if(el) el.textContent = lbl + String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
/* Restore the screen from the address bar, so a refresh comes back
   where you were instead of the first tab. This has to run after the
   declarations above: an assignment to TAB before `let TAB` throws. */
/* Held until the role is known: the first render happens before
   whoami() answers, and a screen this role cannot reach would be
   redirected away and the url rewritten before sign-in completes. */
BOOT_TAB = readHash();
if(BOOT_TAB) TAB = BOOT_TAB;
if(!TAB) TAB = tabsFor()[0].id;
paintThemeButton();
placeHeaderControls();
render();
tick();
setInterval(tick, 30000);

/* re-wire the product search after every render that needs it */
const _render = render;
render = function(){
  _render();
  /* the shop's list carries its own search now, and what it is showing
     has to survive the re-render a quantity causes */
  if(TAB==='myindent'){ myApplyFilter(); }
  if(TAB==='pack'){ wireSearch(c=>{ addExtra(c); }); }
};
render();
</script>
</body>
