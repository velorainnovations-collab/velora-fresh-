<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velora Fresh — supply desk</title>
<style>
/* ============================================================
   Velora Fresh — supply desk
   Design tokens first, then components. Class names are fixed by
   the render functions below; do not rename them here alone.
   ============================================================ */
:root{
  --ink:#12100e; --ink-2:#3f3b36; --ink-3:#6f6960; --ink-4:#9b948a;
  --line:#e6e2db; --line-2:#f1eee9;
  --bg:#f6f4f0; --surface:#fff; --surface-2:#faf9f6;
  --brand:#1c6b45; --brand-dark:#175a3a; --brand-soft:#e8f2ec;
  --blue:#1c4f80; --blue-soft:#e7f0fa;
  --amber:#8a5a06; --amber-soft:#fdf2dd;
  --red:#96241f; --red-soft:#fbeae9;
  --green:#14653f; --green-soft:#e6f4ec;
  --r:9px; --r-lg:13px;
  --sh:0 1px 2px rgba(18,16,14,.05);
  --sh-2:0 2px 4px rgba(18,16,14,.05),0 6px 16px rgba(18,16,14,.06);
}

/* ---------- dark ----------
   Only the tokens change; every component reads them, so nothing else
   needs a dark rule. Two exceptions below: the invoice stays on white
   because it is printed, and the sign-in gate is already dark.
   Follows the system unless the owner has chosen, and the choice is
   remembered per device. */
:root[data-theme="dark"]{
  --ink:#f0ece6; --ink-2:#cfc8bf; --ink-3:#a49c92; --ink-4:#7d766d;
  --line:#332f2b; --line-2:#282522;
  --bg:#141210; --surface:#1c1917; --surface-2:#232019;
  --brand:#3fa877; --brand-dark:#2f8a5f; --brand-soft:#1b3229;
  --blue:#8ab4e8; --blue-soft:#1a2836;
  --amber:#e0b169; --amber-soft:#332a18;
  --red:#e58b84; --red-soft:#3a201e;
  --green:#5cbb8c; --green-soft:#17301f;
  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 4px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f0ece6; --ink-2:#cfc8bf; --ink-3:#a49c92; --ink-4:#7d766d;
    --line:#332f2b; --line-2:#282522;
    --bg:#141210; --surface:#1c1917; --surface-2:#232019;
    --brand:#3fa877; --brand-dark:#2f8a5f; --brand-soft:#1b3229;
    --blue:#8ab4e8; --blue-soft:#1a2836;
    --amber:#e0b169; --amber-soft:#332a18;
    --red:#e58b84; --red-soft:#3a201e;
    --green:#5cbb8c; --green-soft:#17301f;
    --sh:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 2px 4px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.45);
  }
}
/* form controls follow the theme rather than the OS default */
:root[data-theme="dark"], :root[data-theme="light"]{ color-scheme: light dark; }
:root[data-theme="dark"]{ color-scheme: dark; }
:root[data-theme="light"]{ color-scheme: light; }

/* A bill is printed on white paper. Dark ink on a dark card would be
   unreadable on screen and wrong on paper, so the invoice opts out. */
:root[data-theme="dark"] #inv{ background:#fff; color:#1a1a1a; }
:root[data-theme="dark"] #inv *{ color:#1a1a1a; }
:root[data-theme="dark"] table.ibl th{ background:#f4f4f2; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #inv{ background:#fff; color:#1a1a1a; }
  :root:not([data-theme="light"]) #inv *{ color:#1a1a1a; }
  :root:not([data-theme="light"]) table.ibl th{ background:#f4f4f2; }
}

#themeBtn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
  cursor:pointer;color:var(--ink-2);display:grid;place-items:center;flex:none;padding:0}
#themeBtn:hover{background:var(--surface-2)}
#themeBtn svg{width:16px;height:16px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:9px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:var(--sh)}
#burger{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
  cursor:pointer;font-size:15px;color:var(--ink-2);display:none;place-items:center;flex:none}
#burger:hover{background:var(--surface-2)}
.brand{font-size:16px;font-weight:650;letter-spacing:-.2px;line-height:1.15;
  display:flex;align-items:center;gap:9px;padding-right:4px}
.brand .mk{width:31px;height:31px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f9163,var(--brand));color:#fff;font-size:15px;font-weight:700}
.brand small{display:block;font-size:9.5px;font-weight:500;color:var(--ink-4);
  letter-spacing:.09em;text-transform:uppercase;margin-top:1px}
.spacer{margin-left:auto}
header select,header input[type=date]{width:auto;max-width:100%;min-width:0;background:var(--surface-2)}
#whoami{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);min-width:0}
#whoami b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}

/* ---------- nav ---------- */
/* ---------- sidebar ---------- */
#side{position:fixed;top:52px;left:0;bottom:0;width:236px;background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;z-index:18;padding:8px 0 24px;
  transition:transform .22s ease}
#side::-webkit-scrollbar{width:6px}
#side::-webkit-scrollbar-thumb{background:#dcd7ce;border-radius:3px}

.grp{border-bottom:1px solid var(--line-2)}
.grp>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:11px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;text-align:left;font-family:inherit;transition:background .12s,color .12s}
.grp>button:hover{background:var(--surface-2);color:var(--ink)}
.grp>button .ic{width:17px;height:17px;color:var(--ink-4);flex:none}
.grp>button .cv{margin-left:auto;font-size:10px;color:var(--ink-4);transition:transform .18s}
.grp.open>button{color:var(--brand)}
.grp.open>button .ic{color:var(--brand)}
.grp>button:hover .ic{color:var(--ink-2)}
.grp.open>button .cv{transform:rotate(90deg)}
.grp.solo>button.on{color:var(--brand);background:var(--brand-soft)}

.kids{display:none;padding:2px 0 8px}
.grp.open .kids{display:block}
.kids button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
  padding:8px 16px 8px 45px;font:inherit;font-size:13.5px;color:var(--ink-3);cursor:pointer;
  text-align:left;font-family:inherit;border-left:2px solid transparent;transition:all .12s}
.kids button:hover{background:var(--surface-2);color:var(--ink)}
.kids button.on{color:var(--brand);font-weight:600;background:var(--brand-soft);
  border-left-color:var(--brand)}

#scrim{position:fixed;inset:52px 0 0 0;background:rgba(18,16,14,.4);z-index:17;display:none}

/* ---------- page ---------- */
/* Fill whatever is left of the window. A max-width here left a wide
   screen half empty, and the tables are the point of every screen. */
main{padding:22px 24px 72px;margin-left:236px}
h2{font-size:21px;font-weight:650;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 18px}

/* ---------- controls ---------- */
button,select,input{font-family:inherit;font-size:14px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 15px;
  cursor:pointer;font-weight:500;color:var(--ink-2);box-shadow:var(--sh);
  transition:background .13s,border-color .13s,color .13s}
.btn:hover{background:var(--surface-2);border-color:#d5cfc6;color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand);
  box-shadow:0 1px 2px rgba(28,107,69,.28)}
.btn.pri:hover{background:#175a3a;border-color:#175a3a;color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;background:var(--surface);width:100%;color:var(--ink);transition:border-color .13s,box-shadow .13s}
input:hover,select:hover{border-color:#d5cfc6}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0;padding:12px 16px;font-size:13.5px;font-weight:650;letter-spacing:-.1px;
  background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.card>table{border-radius:0 0 var(--r-lg) var(--r-lg)}
/* few-column entry tables read badly stretched to full width */
.card.narrow{max-width:760px}

/* ---------- table ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 var(--r-lg) var(--r-lg)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4);text-align:left;
  padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tbody tr:hover td{background:#fcfbf8}
tr:last-child td{border-bottom:none}
.r{text-align:right}.c{text-align:center}
.tam{font-size:11.5px;color:var(--ink-4);display:block;margin-top:1px}
.vgrp{background:var(--brand-soft);font-weight:650;font-size:12.5px;color:#14563a;
  letter-spacing:.01em;border-bottom:1px solid #d3e6dc}
.vgrp td{border-bottom:1px solid #d3e6dc}
tbody tr.vgrp:hover td{background:var(--brand-soft)}
.skipped td{background:var(--red-soft);color:var(--red)}
tbody tr.skipped:hover td{background:#f7dedc}
.row-inp{width:86px;text-align:center;padding:6px 6px;font-variant-numeric:tabular-nums}

/* ---------- pills ---------- */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  border:1px solid transparent;letter-spacing:.01em;white-space:nowrap}
.p-grey{background:#f0eeea;color:var(--ink-3);border-color:#e3dfd8}
.p-blue{background:var(--blue-soft);color:var(--blue);border-color:#cfe0f2}
.p-green{background:var(--green-soft);color:var(--green);border-color:#c9e6d6}
.p-amber{background:var(--amber-soft);color:var(--amber);border-color:#f2e0b8}
.p-red{background:var(--red-soft);color:var(--red);border-color:#f2d3d1}

/* ---------- shop tiles ---------- */
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;
  cursor:pointer;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,transform .14s}
/* left edge carries the shop's state, so the board reads at a glance */
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ddd8d0}
.t-submitted::before{background:#4a80b8}
.t-accepted::before,.t-packed::before{background:#d9a441}
.t-shipped::before{background:#2f6ea8}
.t-received::before,.t-billed::before{background:#2f9163}
.tile:hover{border-color:#cfc9bf;box-shadow:var(--sh-2);transform:translateY(-1px)}
.tile .nm{font-weight:650;font-size:14.5px;letter-spacing:-.15px}
.tile .big{font-size:22px;font-weight:650;margin:7px 0 2px;letter-spacing:-.5px}
.tile .sub{font-size:12px}

/* ---------- kpi ---------- */
.kpi{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px}
.kpi>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 15px;box-shadow:var(--sh)}
.kpi .lb{font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .vl{font-size:23px;font-weight:650;margin-top:3px;letter-spacing:-.6px;color:var(--ink)}

/* ---------- misc ---------- */
.empty{padding:44px 16px;text-align:center;color:var(--ink-4);font-size:14px}
.note{background:var(--amber-soft);border:1px solid #f0dcb0;border-left:3px solid #d9a441;
  border-radius:var(--r);padding:11px 14px;font-size:13.5px;color:#6d4a08;margin-bottom:15px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}

/* Add forms. A flex row let the inputs stretch and squeezed the button
   against the right edge; a grid gives every field the same width and
   puts the action on its own line, so it reads the same at any size. */
.addform{display:grid;gap:13px 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.addform label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.addform .hint{font-weight:400;color:var(--ink-4)}
.addform .act{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line-2);padding-top:13px;margin-top:2px}
.addform .act .hintline{font-size:12.5px;color:var(--ink-3);margin:0;flex:1 1 240px}
.addform .chk{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.addform .chk input{width:auto}
.addform .pair{display:flex;gap:6px}
.srch{position:relative;max-width:360px;flex:1;min-width:200px}
.sug{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:0 0 var(--r) var(--r);max-height:260px;overflow:auto;z-index:30;display:none;box-shadow:var(--sh-2)}
.sug div{padding:8px 11px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line-2)}
.sug div:last-child{border-bottom:none}
.sug div:hover,.sug div.hi{background:var(--brand-soft)}
.rm{color:var(--red);cursor:pointer;border:none;background:none;font-size:16px;line-height:1;
  padding:2px 7px;border-radius:5px}
.rm:hover{background:var(--red-soft)}
.hidden{display:none!important}

/* ---------- invoice (print-faithful, do not restyle) ---------- */
#inv{background:#fff;padding:26px 30px;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.ihead{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid #1a1a1a;padding-bottom:10px}
.ihead .mid{flex:1;text-align:center}
.ihead .cn{font-size:22px;font-weight:700;letter-spacing:.5px}
.ihead .le{font-size:11px;color:#555;margin-top:2px}
.ititle{text-align:center;font-size:14px;letter-spacing:.28em;margin:12px 0;font-weight:600}
.iband{display:flex;border:1px solid #1a1a1a}
.iband>div{padding:7px 10px;font-size:13px}
.iband .lft{flex:1;border-right:1px solid #1a1a1a}
.iband .rgt{width:225px}
table.ibl{border:1px solid #1a1a1a;border-top:none;font-size:13px}
table.ibl th,table.ibl td{border-right:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;padding:5px 7px;
  background:none;color:#1a1a1a;text-transform:none;letter-spacing:0;font-size:12.5px;white-space:normal}
table.ibl th{font-weight:600;background:#f4f4f2}
table.ibl th:last-child,table.ibl td:last-child{border-right:none}
table.ibl tbody tr:hover td{background:none}
.isign{display:flex;justify-content:space-between;margin-top:44px;font-size:12.5px}

/* ---------- sign in ---------- */
#gate{position:fixed;inset:0;z-index:200;background:linear-gradient(155deg,#12100e,#1c3b2a 60%,#1c6b45);
  display:grid;place-items:center;padding:20px}
#gate .box{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.34);
  padding:26px 26px 22px;width:min(380px,100%)}
#gate .bd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#gate .mk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f9163,var(--brand));color:#fff;font-weight:700}
#gate h1{font-size:19px;margin:0;letter-spacing:-.3px}
#gate .co{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:0}
#gate p.hint{font-size:13px;color:var(--ink-3);margin:14px 0 16px}
#gate label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
#gate .f{margin-bottom:12px}
#gate .err{background:var(--red-soft);border:1px solid #f2d3d1;color:var(--red);
  border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:12px}
#gate .foot{margin-top:14px;font-size:11.5px;color:var(--ink-4);text-align:center}
.syncdot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.syncdot i{width:7px;height:7px;border-radius:50%;background:#2f9163;display:inline-block}
.syncdot.busy i{background:#d9a441}
.syncdot.bad i{background:#96241f}
.syncdot.off i{background:#9b948a}

/* ---------- tablet ---------- */
@media (max-width:1080px) and (min-width:721px){
  #side{width:196px}
  main{margin-left:196px;padding:20px 18px 64px}
  .grp>button{padding:10px 13px;font-size:13.5px}
  .kids button{padding-left:40px;font-size:13px}
}

/* ---------- mobile ---------- */
@media (max-width:720px){
  header{padding:8px 13px;gap:9px;row-gap:7px}
  .brand{font-size:15px}
  header select,header input[type=date]{font-size:13px;padding:6px 8px}
  #burger{display:grid}
  #side{transform:translateX(-100%);box-shadow:var(--sh-2)}
  #side.open{transform:translateX(0)}
  #scrim.on{display:block}
  main{padding:16px 13px 64px;margin-left:0}
  h2{font-size:19px}
  .kpi{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .vl{font-size:20px}
  .grid{grid-template-columns:1fr}
  .card{border-radius:var(--r)}
  th,td{padding:8px 10px}
  #inv{padding:16px 14px}
  .iband{flex-direction:column}
  .iband .lft{border-right:none;border-bottom:1px solid #1a1a1a}
  .iband .rgt{width:auto}
}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  header,nav,.noprint{display:none!important}
  main{padding:0;max-width:none}
  #inv{border:none;border-radius:0;padding:0;box-shadow:none}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<header>
  <button id="burger" type="button" onclick="toggleSide()" aria-label="Menu">&#9776;</button>
  <div class="brand"><span class="mk" aria-hidden="true">VF</span><span>Velora Fresh<small>Velora Innovations Pvt Ltd</small></span></div>
  <select id="roleSel" style="width:auto" onchange="setRole(this.value)"></select>
  <span id="whoami" class="hidden"></span>
  <input type="date" id="dateSel" style="width:auto" onchange="setDate(this.value)">
  <span class="spacer"></span>
  <label id="anyBox" class="hidden" style="font-size:12.5px;color:#6b6b66;display:flex;align-items:center;gap:5px;cursor:pointer">
    <input type="checkbox" id="anyChk" style="width:auto" onchange="setAnytime(this.checked)"> Ignore the 6–9 pm indent window
  </label>
  <button id="themeBtn" type="button" onclick="toggleTheme()" aria-label="Light or dark"></button>
  <span id="syncState" class="syncdot hidden"><i></i><span></span></span>
  <button id="signOutBtn" class="btn sm hidden" type="button" onclick="doSignOut()">Sign out</button>
  <span id="clock" class="mono" style="font-size:13px;color:#6b6b66"></span>
</header>

<aside id="side"></aside>
<div id="scrim" onclick="toggleSide(false)"></div>
<main id="main"></main>

<!-- Shown only when a Supabase key is configured. Without one the app
     behaves exactly as before and this stays hidden. -->
<div id="gate" class="hidden">
  <form class="box" onsubmit="doSignIn(event)">
    <div class="bd"><span class="mk">VF</span>
      <div><h1>Velora Fresh</h1><p class="co">Velora Innovations Pvt Ltd</p></div>
    </div>
    <p class="hint" id="gateHint">Sign in to the supply desk.</p>
    <div id="gateErr"></div>
    <div class="f"><label for="gateEmail">Email</label>
      <input id="gateEmail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="gatePass">Password</label>
      <input id="gatePass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" id="gateBtn" type="submit" style="width:100%">Sign in</button>
    <p class="foot" style="margin-top:12px">
      <span id="gateSwapText">First time here?</span>

/* ---------- catalogue parse ---------- */
const CAT = {}, ALIAS = {};
PRODUCTS.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
  const f = line.split('|');
  const code = (f[0]||'').trim();
  if(!code) return;
  const full = (f[1]||'').trim();
  const bits = full.split(' / ');
  CAT[code] = {
    code, name: bits[0].trim(), tamil: (bits[1]||'').trim(), full,
    unit: (f[2]||'kg').trim() || 'kg',
    wt: parseFloat(f[3]) || 0,
    margin: f[4]!==undefined && f[4].trim()!=='' ? parseFloat(f[4]) : null,
    alias: (f[5]||'').trim()
  };
  if(CAT[code].alias) ALIAS[CAT[code].alias.toUpperCase()] = code;
});
const CODES = Object.keys(CAT);

/* ---------- groups parse ---------- */
const GROUPS = {}, CODE2GROUP = {};
GROUP_LIST.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
  const i = line.indexOf('|'); if(i<0) return;
  const name = line.slice(0,i).trim();
  const codes = line.slice(i+1).split(',').map(c=>c.trim()).filter(Boolean);
  GROUPS[name] = codes;
  codes.forEach(c=>{ CODE2GROUP[c] = name; });
});
/* anything not listed in a group tab is a manual-order group of its own */
const UNGROUPED = 'Manual order';
GROUPS[UNGROUPED] = CODES.filter(c=>!CODE2GROUP[c]);
GROUPS[UNGROUPED].forEach(c=>{ CODE2GROUP[c] = UNGROUPED; });
const GROUPNAMES = Object.keys(GROUPS);
function groupOf(code){ return CODE2GROUP[code] || UNGROUPED; }

function unitWeight(c, unit){
  const e = CAT[c]; if(!e) return 1;
  const u = unit || e.unit;
  if(u === 'g') return 0.001;
  if(u === 'box' || u === 'tray') return e.wt || 0;
  return 1;
}
function netKg(code, qty, unit){ return (parseFloat(qty)||0) * unitWeight(code, unit); }

/* ---------- storage ---------- */
const KEY = 'VF_DB';
let DB;
function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ DB = null; }
  if(!DB) DB = {};
  DB.indents = DB.indents || {};   /* [date][shopId] = {status, lines:{code:qty}, submittedAt, late} */
  DB.days    = DB.days    || {};   /* [date] = {rates:{code:r}, packed:{shop:{code:q}}, ship:{shop:status}} */
  DB.invoices= DB.invoices|| {};   /* [date][shopId] = {no, lines:[...], total} */
  DB.master  = DB.master  || {};
  DB.master.comm    = DB.master.comm    || {};
  DB.master.selling = DB.master.selling || {};
  DB.serial   = DB.serial   || {};
  DB.settings = DB.settings || {anytime:false};
  DB.vendors  = DB.vendors  || {};
  GROUPNAMES.forEach(g=>{
    if(!DB.vendors[g]) DB.vendors[g] = {name:g, phone:'', contact:'', address:'', notes:'',
                                        manual:(g.toLowerCase()==='others' || g===UNGROUPED),
                                        bank:{acName:'',acNo:'',ifsc:'',upi:''}};
  });
  DB.payments = DB.payments || [];   /* [{id,date,amount,mode,ref}] chain-level, oldest-bill-first */
  SHOPS.forEach(s=>{ if(DB.master.comm[s.id]===undefined) DB.master.comm[s.id] = s.comm; });
  DB.shopPhones = DB.shopPhones || {};
  SHOPS.forEach(s=>{ if(DB.shopPhones[s.id]) s.phone = DB.shopPhones[s.id]; });
  return DB;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  /* Local write already done above, so the app never waits on the
     network. This only queues the changed rows. No-op when the sync
     layer is absent or unconfigured. */
  try{ if(typeof VFSync !== 'undefined' && VFSync.enabled()) VFSync.record(DB); }catch(e){}
}
load();

/* ============================================================
   Light or dark
   ============================================================
   Runs before the first render so the page never flashes the wrong
   one. No stored choice means follow the operating system. */
(function(){
  try{
    const saved = localStorage.getItem('VF_THEME');
    if(saved === 'dark' || saved === 'light')
      document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

function currentTheme(){
  const set = document.documentElement.getAttribute('data-theme');
  if(set) return set;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ? 'dark' : 'light';
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('VF_THEME', t); }catch(e){}
  paintThemeButton();
}

function toggleTheme(){ applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }

function paintThemeButton(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  const dark = currentTheme() === 'dark';
  /* shows what you would switch to, not what you are on */
  b.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round"><circle cx="12" cy="12" r="4"/>'
      + '<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4'
      + 'M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  b.title = dark ? 'Switch to light' : 'Switch to dark';
}

/* ---------- Supabase sync (inlined by src/build.py) ---------- */
/* ============================================================
   Velora Fresh — Supabase sync
   Inlined into index.html by src/build.py.

   Local-first. Every read and write still goes through the same
   localStorage blob the app has always used, so the admin entering
   rates at Koyambedu at 4 am on bad signal never waits for a network
   round trip. Changes are diffed into row operations, queued, and
   pushed when the connection allows.

   Talks to PostgREST with fetch rather than loading supabase-js from a
   CDN: the app stays one file and works with no network at all.
   ============================================================ */

const VFSync = (function () {
  'use strict';

  const QKEY  = 'VF_QUEUE';      // pending row operations
  const SKEY  = 'VF_SYNCED';     // last snapshot known to be on the server
  const AKEY  = 'VF_AUTH';       // session tokens

  /* ---------- configuration ----------
     Filled in by the deployer. With no url the app runs exactly as it
     did before: pure localStorage, no network, nothing to break. */
  const CFG = window.VF_CONFIG || { url: '', anonKey: '', clientId: 'KPN' };

  const enabled = () => !!(CFG.url && CFG.anonKey);

  /* ============================================================
     1. Flatten the nested blob into rows
     ============================================================
     The app stores one nested object keyed by date. The database is
     normalised. Rather than diff the nesting, both sides are flattened
     to `table -> key -> row` and compared as flat maps. Diffing then
     falls out as a set comparison, and a change to one product's rate
     produces exactly one row operation.                              */

  function flatten(DB) {
    const out = {
      indents: {}, indent_lines: {}, day_rates: {}, packed: {},
      shipments: {}, vendor_orders: {}, invoices: {}, invoice_lines: {},
      payments: {}, vendors: {}, vendor_bank: {}, margin_comm: {},
      margin_selling: {}, settings: {},
    };
    if (!DB) return out;

    // ---- indents ----
    Object.keys(DB.indents || {}).forEach(date => {
      Object.keys(DB.indents[date] || {}).forEach(shop => {
        const ind = DB.indents[date][shop] || {};
        // an untouched draft with no lines is not worth a row
        const lines = ind.lines || {};
        if (ind.status === 'draft' && !Object.keys(lines).length) return;

        out.indents[date + '|' + shop] = {
          trade_date: date, shop_id: shop,
          status: ind.status || 'draft',
          submitted_at: ind.submittedAt || null,
          late: !!ind.late,
        };
        Object.keys(lines).forEach(code => {
          out.indent_lines[date + '|' + shop + '|' + code] = {
            trade_date: date, shop_id: shop,
            product_code: code, qty: Number(lines[code]) || 0,
          };
        });
      });
    });

    // ---- the trading day ----
    Object.keys(DB.days || {}).forEach(date => {
      const day = DB.days[date] || {};

      Object.keys(day.rates || {}).forEach(code => {
        const r = day.rates[code];
        if (r === '' || r === null || r === undefined) return;
        out.day_rates[date + '|' + code] = {
          trade_date: date, product_code: code, rate: Number(r) || 0,
        };
      });

      Object.keys(day.packed || {}).forEach(shop => {
        const p = day.packed[shop] || {};
        Object.keys(p).forEach(code => {
          // 0 is meaningful — the vendor skipped it on quality — so it
          // is stored, not dropped
          out.packed[date + '|' + shop + '|' + code] = {
            trade_date: date, shop_id: shop,
            product_code: code, qty: Number(p[code]) || 0,
          };
        });
      });

      Object.keys(day.ship || {}).forEach(shop => {
        const st = day.ship[shop];
        if (!st) return;
        out.shipments[date + '|' + shop] = {
          trade_date: date, shop_id: shop,
          state: st === 'received' ? 'received' : 'out',
        };
      });

      Object.keys(day.sent || {}).forEach(g => {
        if (!day.sent[g]) return;
        out.vendor_orders[date + '|' + g] = { trade_date: date, group_name: g };
      });
    });

    // ---- invoices ----
    Object.keys(DB.invoices || {}).forEach(date => {
      Object.keys(DB.invoices[date] || {}).forEach(shop => {
        const inv = DB.invoices[date][shop];
        if (!inv) return;
        const id = inv.id || uuidFor(date + '|' + shop);
        out.invoices[date + '|' + shop] = {
          id: id, bill_no: inv.no, trade_date: date, shop_id: shop,
          total: round2(inv.total), round_off: round2(inv.roundOff || 0),
          net_amount: round2((inv.total || 0) + (inv.roundOff || 0)),
        };
        (inv.lines || []).forEach((l, i) => {
          out.invoice_lines[date + '|' + shop + '|' + (i + 1)] = {
            invoice_id: id, line_no: i + 1,
            product_code: l.code, name: l.name, tamil: l.tamil || '',
            unit: l.unit, qty: Number(l.qty) || 0, net_kg: Number(l.net) || 0,
            // frozen values — never recomputed from the current master
            rate: Number(l.rate) || 0,
            amount: round2(l.amount),
            sell: Number(l.sell) || 0,
          };
        });
      });
    });

    // ---- money ----
    (DB.payments || []).forEach(p => {
      if (!p || !p.id) return;
      out.payments[p.id] = {
        id: uuidFor(p.id), client_id: CFG.clientId,
        paid_on: p.date, amount: round2(p.amount),
        mode: p.mode || 'NEFT', ref: p.ref || '',
      };
    });

    // ---- vendors ----
    Object.keys(DB.vendors || {}).forEach(g => {
      const v = DB.vendors[g] || {};
      out.vendors[g] = {
        group_name: g, name: v.name || '', phone: v.phone || '',
        contact: v.contact || '', address: v.address || '', notes: v.notes || '',
      };
      const b = v.bank || {};
      // only send a bank row once something has been entered; an empty
      // one would be refused for any role but owner
      if (b.acName || b.acNo || b.ifsc || b.upi) {
        out.vendor_bank[g] = {
          group_name: g, ac_name: b.acName || '', ac_no: b.acNo || '',
          ifsc: b.ifsc || '', upi: b.upi || '',
        };
      }
    });

    // ---- margins ----
    const m = DB.master || {};
    Object.keys(m.comm || {}).forEach(shop => {
      out.margin_comm[shop] = { shop_id: shop, pct: Number(m.comm[shop]) || 0 };
    });
    Object.keys(m.selling || {}).forEach(shop => {
      Object.keys(m.selling[shop] || {}).forEach(code => {
        out.margin_selling[shop + '|' + code] = {
          shop_id: shop, product_code: code,
          pct: Number(m.selling[shop][code]) || 0,
        };
      });
    });

    // ---- settings ----
    out.settings[CFG.clientId] = {
      client_id: CFG.clientId, anytime: !!(DB.settings || {}).anytime,
    };

    return out;
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  /* Stable uuid from a string, so the same logical record keeps the same
     id on every device without a server round trip. Not a real v5 hash —
     it only has to be deterministic and collision-free over our keys. */
  function uuidFor(str) {
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str)) return str;
    let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x9e3779b9, h4 = 0x85ebca6b;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 + c, 2654435761) >>> 0;
      h3 = Math.imul(h3 ^ (c + i), 2246822519) >>> 0;
      h4 = Math.imul(h4 + (c * (i + 1)), 3266489917) >>> 0;
    }
    const hex = n => ('00000000' + n.toString(16)).slice(-8);
    const s = hex(h1) + hex(h2) + hex(h3) + hex(h4);
    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-5' + s.slice(13, 16) + '-a'
         + s.slice(17, 20) + '-' + s.slice(20, 32);
  }

  /* ============================================================
     2. Diff two flat maps into row operations
     ============================================================ */

  // Natural keys, so a row can be upserted or deleted without knowing
  // the surrogate id the database assigned.
  const CONFLICT = {
    indents:        'trade_date,shop_id',
    indent_lines:   'trade_date,shop_id,product_code',
    day_rates:      'trade_date,product_code',
    packed:         'trade_date,shop_id,product_code',
    shipments:      'trade_date,shop_id',
    vendor_orders:  'trade_date,group_name',
    invoices:       'trade_date,shop_id',
    invoice_lines:  'invoice_id,line_no',
    payments:       'id',
    vendors:        'group_name',
    vendor_bank:    'group_name',
    margin_comm:    'shop_id',
    margin_selling: 'shop_id,product_code',
    settings:       'client_id',
  };

  function diff(before, after) {
    const ops = [];
    Object.keys(CONFLICT).forEach(table => {
      const a = before[table] || {}, b = after[table] || {};
      Object.keys(b).forEach(k => {
        if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) {
          ops.push({ table: table, op: 'upsert', key: k, row: b[k] });
        }
      });
      Object.keys(a).forEach(k => {
        if (!(k in b)) ops.push({ table: table, op: 'delete', key: k, row: a[k] });
      });
    });
    return ops;
  }

  /* Later operations on the same row supersede earlier ones. Without
     this, typing a rate four times would send four requests. */
  function collapse(ops) {
    const seen = {};
    ops.forEach(o => { seen[o.table + '\u0000' + o.key] = o; });
    // preserve insertion order of the surviving ops
    const out = [], done = {};
    ops.forEach(o => {
      const k = o.table + '\u0000' + o.key;
      if (done[k]) return;
      done[k] = true;
      out.push(seen[k]);
    });
    return out;
  }

  /* Parents before children, so a line never arrives before its header.
     Deletes run in reverse for the same reason. */
  const ORDER = ['settings', 'vendors', 'vendor_bank', 'margin_comm', 'margin_selling',
                 'indents', 'indent_lines', 'day_rates', 'packed', 'shipments',
                 'vendor_orders', 'invoices', 'invoice_lines', 'payments'];

  function sortOps(ops) {
    return ops.slice().sort((x, y) => {
      if (x.op !== y.op) return x.op === 'upsert' ? -1 : 1;
      const ix = ORDER.indexOf(x.table), iy = ORDER.indexOf(y.table);
      return x.op === 'upsert' ? ix - iy : iy - ix;
    });
  }

  /* ============================================================
     3. Queue — survives reload and offline
     ============================================================ */

  function readJSON(k, dflt) {
    try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; }
  }
  function writeJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full or private mode */ }
  }

  let queue = readJSON(QKEY, []);
  let synced = readJSON(SKEY, null);

  function record(DB) {
    if (!enabled()) return 0;
    const now = flatten(DB);
    const ops = diff(synced || {}, now);
    if (!ops.length) return 0;
    queue = collapse(queue.concat(ops));
    writeJSON(QKEY, queue);
    synced = now;          // optimistic: rolled back if the push fails
    writeJSON(SKEY, synced);
    schedule();
    return ops.length;
  }

  /* ============================================================
     4. Auth
     ============================================================ */

  let auth = readJSON(AKEY, null);

  function headers(extra) {
    const h = Object.assign({
      'apikey': CFG.anonKey,
      'Content-Type': 'application/json',
    }, extra || {});
    if (auth && auth.access_token) h['Authorization'] = 'Bearer ' + auth.access_token;
    return h;
  }

  async function signIn(email, password) {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email, password: password }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || 'Sign in failed');
    auth = j; writeJSON(AKEY, auth);
    return j;
  }

  /* Creating the account. Safe to leave open: an account with no
     invite gets no app_users row, and every policy then resolves to
     false — it can sign in and see nothing at all. The invite, not the
     signup, is what grants access. */
  async function signUp(email, password) {
    const r = await fetch(CFG.url + '/auth/v1/signup', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email, password: password }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Could not create the account');
    // a session comes back only when email confirmation is switched off
    if (j.access_token) { auth = j; writeJSON(AKEY, auth); return { signedIn: true }; }
    return { signedIn: false, needsConfirmation: true };
  }

  async function refresh() {
    if (!auth || !auth.refresh_token) return false;
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ refresh_token: auth.refresh_token }),
    });
    if (!r.ok) { auth = null; writeJSON(AKEY, null); return false; }
    auth = await r.json(); writeJSON(AKEY, auth);
    return true;
  }

  function signOut() {
    auth = null; writeJSON(AKEY, null);
  }

  const signedIn = () => !!(auth && auth.access_token);

  /* ============================================================
     5. Push
     ============================================================ */

  let pushing = false, timer = null;
  const listeners = [];

  function on(fn) { listeners.push(fn); }
  function emit(state, detail) { listeners.forEach(f => { try { f(state, detail); } catch (e) {} }); }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(push, ms === undefined ? 800 : ms);
  }

  async function send(table, rows, isDelete, keyCols) {
    if (isDelete) {
      // one request per row: the filter is a conjunction of its key columns
      for (const row of rows) {
        const qs = keyCols.map(c => c + '=eq.' + encodeURIComponent(row[c])).join('&');
        const r = await fetch(CFG.url + '/rest/v1/' + table + '?' + qs, {
          method: 'DELETE', headers: headers(),
        });
        if (!r.ok && r.status !== 404) throw await httpError(r, table);
      }
      return;
    }
    // Postgres refuses to let ON CONFLICT DO UPDATE touch the same row
    // twice in one statement — it raises cardinality_violation, which
    // PostgREST returns as 409. collapse() dedupes by operation key,
    // which is not always the same thing as the database conflict key,
    // so the payload is deduped again here on the columns that actually
    // decide the conflict. Later rows win, matching last-write-wins.
    const byKey = new Map();
    rows.forEach(row => byKey.set(keyCols.map(c => String(row[c])).join('\u0000'), row));
    const unique = Array.from(byKey.values());

    const r = await fetch(
      CFG.url + '/rest/v1/' + table + '?on_conflict=' + encodeURIComponent(keyCols.join(',')),
      {
        method: 'POST',
        headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(unique),
      });
    if (!r.ok) throw await httpError(r, table);
  }

  async function httpError(r, table) {
    let body = null;
    try { body = await r.json(); } catch (e) { /* empty or non-JSON */ }
    // PostgREST puts the real cause in message/details/hint; without it a
    // failure is just a number and cannot be diagnosed from a screenshot
    const detail = body
      ? [body.message, body.details, body.hint].filter(Boolean).join(' — ')
      : r.statusText;
    const e = new Error((table ? table + ': ' : '') + 'HTTP ' + r.status + ' ' + detail);
    e.status = r.status;
    e.table = table;
    e.body = body;
    if (typeof console !== 'undefined') console.error('[VFSync]', e.message, body || '');
    return e;
  }

  async function push() {
    if (!enabled() || pushing || !queue.length) return;
    if (!navigator.onLine) { emit('offline', queue.length); return; }
    if (!signedIn()) { emit('signed-out', queue.length); return; }

    pushing = true;
    emit('pushing', queue.length);
    const batch = sortOps(queue);

    try {
      // group consecutive ops of the same table and direction
      let i = 0;
      while (i < batch.length) {
        const t = batch[i].table, isDel = batch[i].op === 'delete';
        const rows = [];
        while (i < batch.length && batch[i].table === t && (batch[i].op === 'delete') === isDel) {
          rows.push(batch[i].row); i++;
        }
        await send(t, rows, isDel, CONFLICT[t].split(','));
      }
      queue = []; writeJSON(QKEY, queue);
      emit('synced', 0);
    } catch (err) {
      if (err.status === 401 && await refresh()) { pushing = false; return push(); }
      // keep the queue; the next attempt retries it
      emit('error', err.message);
      schedule(15000);
    } finally {
      pushing = false;
    }
  }

  /* ============================================================
     6. Pull
     ============================================================
     Rebuilds the nested blob from the server. Used on first sign-in and
     when a device has been away. Anything still queued locally is
     pushed afterwards, so unsent local work is never lost. */

  async function get(table, select) {
    const r = await fetch(CFG.url + '/rest/v1/' + table + '?select=' + (select || '*'),
                          { headers: headers() });
    if (!r.ok) throw await httpError(r, table);
    return r.json();
  }

  async function pull(DB) {
    if (!enabled() || !signedIn()) return DB;

    const [inds, ilines, rates, pk, ship, vo, invs, ivl, pays, vend, vbank, mc, ms, st] =
      await Promise.all(['indents', 'indent_lines', 'day_rates', 'packed', 'shipments',
                         'vendor_orders', 'invoices', 'invoice_lines', 'payments',
                         'vendors', 'vendor_bank', 'margin_comm', 'margin_selling',
                         'settings'].map(t => get(t).catch(() => [])));

    const indById = {};
    inds.forEach(i => {
      indById[i.id] = i;
      const d = DB.indents[i.trade_date] = DB.indents[i.trade_date] || {};
      d[i.shop_id] = { status: i.status, lines: {},
                       submittedAt: i.submitted_at, late: !!i.late };
    });
    ilines.forEach(l => {
      const hdr = indById[l.indent_id];
      if (!hdr) return;
      const rec = (DB.indents[hdr.trade_date] || {})[hdr.shop_id];
      if (rec) rec.lines[l.product_code] = Number(l.qty);
    });

    const day = d => (DB.days[d] = DB.days[d] ||
                      { rates: {}, packed: {}, ship: {}, sent: {} });
    rates.forEach(r => { day(r.trade_date).rates[r.product_code] = Number(r.rate); });
    pk.forEach(p => {
      const D = day(p.trade_date);
      (D.packed[p.shop_id] = D.packed[p.shop_id] || {})[p.product_code] = Number(p.qty);
    });
    ship.forEach(s => { day(s.trade_date).ship[s.shop_id] = s.state; });
    vo.forEach(o => { day(o.trade_date).sent[o.group_name] = true; });

    const invById = {};
    invs.forEach(v => {
      invById[v.id] = v;
      const d = DB.invoices[v.trade_date] = DB.invoices[v.trade_date] || {};
      d[v.shop_id] = { id: v.id, no: v.bill_no, date: v.trade_date, shopId: v.shop_id,
                       total: Number(v.total), roundOff: Number(v.round_off), lines: [] };
    });
    ivl.sort((a, b) => a.line_no - b.line_no).forEach(l => {
      const h = invById[l.invoice_id];
      if (!h) return;
      const rec = (DB.invoices[h.trade_date] || {})[h.shop_id];
      if (!rec) return;
      rec.lines.push({ code: l.product_code, name: l.name, tamil: l.tamil, unit: l.unit,
                       qty: Number(l.qty), net: Number(l.net_kg), rate: Number(l.rate),
                       amount: Number(l.amount), sell: Number(l.sell) });
    });

    DB.payments = pays.map(p => ({ id: p.id, date: p.paid_on, amount: Number(p.amount),
                                   mode: p.mode, ref: p.ref }));

    vend.forEach(v => {
      const rec = DB.vendors[v.group_name] = DB.vendors[v.group_name] ||
        { bank: { acName: '', acNo: '', ifsc: '', upi: '' } };
      rec.name = v.name; rec.phone = v.phone; rec.contact = v.contact;
      rec.address = v.address; rec.notes = v.notes;
    });
    // empty for every role but owner — RLS returns no rows rather than an error
    vbank.forEach(b => {
      const rec = DB.vendors[b.group_name];
      if (rec) rec.bank = { acName: b.ac_name, acNo: b.ac_no, ifsc: b.ifsc, upi: b.upi };
    });

    mc.forEach(m => { DB.master.comm[m.shop_id] = Number(m.pct); });
    ms.forEach(m => {
      (DB.master.selling[m.shop_id] = DB.master.selling[m.shop_id] || {})[m.product_code] =
        Number(m.pct);
    });
    if (st.length) DB.settings.anytime = !!st[0].anytime;

    // the server is now the baseline; anything still queued is local work
    synced = flatten(DB);
    writeJSON(SKEY, synced);
    return DB;
  }

  /* ============================================================
     7. Who is signed in
     ============================================================
     The role comes from the database, never from the browser. The
     read_self policy returns exactly one row — the caller's own — so
     nobody can ask for somebody else's tag. A signed-in account with
     no app_users row returns nothing, which is the intended default
     for an uninvited signup. */

  async function whoami() {
    if (!enabled() || !signedIn()) return null;
    const r = await fetch(
      CFG.url + '/rest/v1/app_users?select=id,full_name,role,client_id,shop_id,active',
      { headers: headers() });
    if (r.status === 401 && await refresh()) return whoami();
    if (!r.ok) throw await httpError(r, 'app_users');
    const rows = await r.json();
    const me = rows.filter(u => u.active)[0];
    if (!me) return null;
    // the app's own notion of a role: a shop user *is* their shop
    me.appRole = me.role === 'shop' ? me.shop_id : me.role;
    return me;
  }

  /* ============================================================
     8. People
     ============================================================
     Thin wrappers over the functions in supabase/06_users.sql. Every
     one of them re-checks is_owner() server side, so a browser that
     calls them without the right role is refused by the database
     rather than by the interface. */

  async function rpc(fn, args) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: headers(),
      body: JSON.stringify(args || {}),
    });
    if (r.status === 401 && await refresh()) return rpc(fn, args);
    if (!r.ok) throw await httpError(r, fn);
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  const listPeople      = ()             => rpc('list_people');

  /* Create the login outright, password and all, instead of waiting for
     the person to sign up. Runs in an edge function because it needs the
     service_role key. Throws NOT_DEPLOYED if the function is not there,
     so the caller can fall back to an invite. */
  async function createUser(o) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    let r;
    try {
      r = await fetch(CFG.url + '/functions/v1/create-user', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({
          email: o.email, password: o.password, full_name: o.name || '',
          role: o.role, phone: o.phone || null,
          client_id: o.clientId || null, shop_id: o.shopId || null,
        }),
      });
    } catch (e) {
      const err = new Error('NOT_DEPLOYED'); err.notDeployed = true; throw err;
    }
    if (r.status === 404) { const e = new Error('NOT_DEPLOYED'); e.notDeployed = true; throw e; }
    if (r.status === 401 && await refresh()) return createUser(o);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ('Could not create the login (' + r.status + ')'));
    return body;
  }

  /* A new branch. Written straight through rather than queued: every
     indent, packed line and margin row carries a foreign key to shops,
     so the shop has to exist on the server before anything referencing
     it can be pushed. RLS lets only an owner do this. */
  async function addShop(shop) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/shops?on_conflict=id', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ id: shop.id, client_id: CFG.clientId,
                              name: shop.name, prefix: shop.prefix }]),
    });
    if (r.status === 401 && await refresh()) return addShop(shop);
    if (!r.ok) throw await httpError(r, 'shops');
    return true;
  }
  const setPersonRole   = (id, role)     => rpc('set_person_role',   { p_user: id, p_role: role });
  const setPersonActive = (id, active)   => rpc('set_person_active', { p_user: id, p_active: active });
  const cancelInvite    = (id)           => rpc('cancel_invite',     { p_invite: id });
  const invitePerson    = (o) => rpc('invite_person', {
    p_role: o.role, p_full_name: o.name || '',
    p_phone: o.phone || null, p_email: o.email || null,
    p_client_id: o.clientId || null, p_shop_id: o.shopId || null,
  });

  /* ============================================================
     9. Catalogue
     ============================================================
     The 241 products are compiled into index.html, which is the right
     default: the app opens fully stocked with no network. But a product
     added later must outlive a reload and reach every device, so the
     database is the truth and the build is only the seed.             */

  async function addProduct(p) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/products?on_conflict=code', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ code: p.code, name: p.name, tamil: p.tamil || '',
                              unit: p.unit, unit_weight_kg: p.wt || null,
                              alias: p.alias || '' }]),
    });
    if (r.status === 401 && await refresh()) return addProduct(p);
    if (!r.ok) throw await httpError(r, 'products');

    // the group mapping is a second row, and the product must exist first
    const g = await fetch(CFG.url + '/rest/v1/product_groups?on_conflict=product_code', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ product_code: p.code, group_name: p.group }]),
    });
    if (!g.ok) throw await httpError(g, 'product_groups');
    return true;
  }

  /* A new vendor. The group row has to land before the vendor row —
     vendors.group_name references it — and before any product can be
     mapped to it. Queued writes would not hold that order, so both go
     straight through. */
  async function addVendorGroup(g) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const grp = await fetch(CFG.url + '/rest/v1/vendor_groups?on_conflict=name', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ name: g.name, manual: !!g.manual, sort_ord: g.sort || 50 }]),
    });
    if (grp.status === 401 && await refresh()) return addVendorGroup(g);
    if (!grp.ok) throw await httpError(grp, 'vendor_groups');

    const ven = await fetch(CFG.url + '/rest/v1/vendors?on_conflict=group_name', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ group_name: g.name, name: g.vendorName || g.name,
                              phone: g.phone || '', contact: '', address: '', notes: '' }]),
    });
    if (!ven.ok) throw await httpError(ven, 'vendors');
    return true;
  }

  /* Everything the catalogue is made of, for merging over the build. */
  async function fetchCatalogue() {
    if (!enabled() || !signedIn()) return null;
    const [products, groups, mapping] = await Promise.all([
      get('products', 'code,name,tamil,unit,unit_weight_kg,alias').catch(() => []),
      get('vendor_groups', 'name,manual,sort_ord').catch(() => []),
      get('product_groups', 'product_code,group_name').catch(() => []),
    ]);
    return { products: products, groups: groups, mapping: mapping };
  }

  /* ============================================================
     10. Bill numbers — issued by the database, never locally
     ============================================================ */

  async function nextBillNo(shopId, date) {
    if (!enabled() || !signedIn()) return null;
    const r = await fetch(CFG.url + '/rest/v1/rpc/next_bill_no', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ p_shop: shopId, p_date: date }),
    });
    if (!r.ok) throw await httpError(r, 'next_bill_no');
    return r.json();
  }

  /* ---------- retry when the connection comes back ---------- */
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', () => schedule(300));
  }

  return {
    enabled, signIn, signUp, signOut, signedIn, refresh, pull, push, record,
    whoami, nextBillNo, on, queueLength: () => queue.length,
    listPeople, invitePerson, createUser, setPersonRole, setPersonActive, cancelInvite,
    addShop, addProduct, addVendorGroup, fetchCatalogue,
    // exported for the tests
    _flatten: flatten, _diff: diff, _collapse: collapse, _sortOps: sortOps,
    _uuidFor: uuidFor, _reset: function () { queue = []; synced = null; },
  };
})();

/* Inlined into the app's single script block, so `const` alone would keep
   this out of reach of the tests and the console. */
if (typeof window !== 'undefined') window.VFSync = VFSync;


/* ============================================================
   Sign in
   ============================================================
   With no anon key configured VFSync.enabled() is false, the gate
   never shows, and the role dropdown works as it always has. Once a
   key is present the dropdown is replaced by the role the database
   reports for the signed-in account — the browser never chooses it.
   ============================================================ */

function gateEl(){ return document.getElementById('gate'); }

function showGate(msg){
  const g = gateEl(); if(!g) return;
  g.classList.remove('hidden');
  document.getElementById('gateErr').innerHTML =
    msg ? '<div class="err">' + esc(msg) + '</div>' : '';
}
function hideGate(){ const g = gateEl(); if(g) g.classList.add('hidden'); }

let GATE_MODE = 'in';        /* 'in' | 'up' */

function swapGateMode(ev){
  if(ev) ev.preventDefault();
  GATE_MODE = (GATE_MODE === 'in') ? 'up' : 'in';
  const up = (GATE_MODE === 'up');
  document.getElementById('gateHint').textContent = up
    ? 'Create your account with the email the owner added.'
    : 'Sign in to the supply desk.';
  document.getElementById('gateBtn').textContent = up ? 'Create account' : 'Sign in';
  document.getElementById('gateSwapText').textContent = up ? 'Already have an account?' : 'First time here?';
  document.getElementById('gateSwap').textContent = up ? 'Sign in' : 'Create your account';
  document.getElementById('gatePass').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
  document.getElementById('gateErr').innerHTML = '';
}

async function doSignIn(ev){
  ev.preventDefault();
  const btn   = document.getElementById('gateBtn');
  const email = document.getElementById('gateEmail').value.trim();
  const pass  = document.getElementById('gatePass').value;
  const up    = (GATE_MODE === 'up');
  const label = btn.textContent;

  if(up && pass.length < 8){
    showGate('Choose a password of at least 8 characters.');
    return;
  }

  btn.disabled = true; btn.textContent = up ? 'Creating...' : 'Signing in...';
  try{
    if(up){
      const r = await VFSync.signUp(email, pass);
      if(!r.signedIn){
        showGate('');
        document.getElementById('gateErr').innerHTML =
          '<div class="notice">Account created. Check your email for the confirmation link, '
          + 'then come back and sign in.</div>';
        GATE_MODE = 'in'; swapGateMode(null);
        /* swapGateMode cleared the message, so put it back */
        document.getElementById('gateErr').innerHTML =
          '<div class="notice">Account created. Check your email for the confirmation link, '
          + 'then come back and sign in.</div>';
        return;
      }
    }else{
      await VFSync.signIn(email, pass);
    }
    await afterSignIn();
  }catch(e){
    showGate(e.message || (up ? 'Could not create the account' : 'Could not sign in'));
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

function doSignOut(){
  VFSync.signOut();
  location.reload();
}

async function afterSignIn(){
  const me = await VFSync.whoami();
  if(!me){
    VFSync.signOut();
    showGate('Your account works, but the owner has not given it access yet. Ask them to add this email under Master > Users.');
    return;
  }
  ME = me;
  ROLE = me.appRole;
  /* now that the role is known, honour what the url asked for */
  if(BOOT_TAB && tabsFor().filter(t=>t.id===BOOT_TAB).length) TAB = BOOT_TAB;
  BOOT_TAB = null;
  try{
    const cat = await VFSync.fetchCatalogue();
    mergeCatalogue(cat);
  }catch(e){ /* offline: the compiled catalogue still stands */ }
  try{ await VFSync.pull(DB); }catch(e){ /* offline: carry on with local data */ }
  hideGate();
  const so = document.getElementById('signOutBtn');
  if(so) so.classList.remove('hidden');
  /* The role now comes from the database, so the dropdown would be a
     lie — it cannot change what the server will allow. */
  const rs = document.getElementById('roleSel');
  if(rs) rs.classList.add('hidden');
  const who = document.getElementById('whoami');
  if(who){
    const label = {owner:'Owner', admin:'Manager', ho:'Head office'}[me.role]
                || ((shopById(me.shop_id) || {}).name || me.shop_id);
    const tone  = me.role === 'owner' ? 'p-green' : me.role === 'admin' ? 'p-blue' : 'p-grey';
    who.innerHTML = '<b>' + esc(me.full_name || 'Signed in') + '</b>'
                  + '<span class="pill ' + tone + '">' + esc(label) + '</span>';
    who.classList.remove('hidden');
  }
  render();
  VFSync.push();
}

let ME = null;

function syncBadge(state, detail){
  const el = document.getElementById('syncState');
  if(!el) return;
  el.classList.remove('hidden','busy','bad','off');
  const label = el.lastElementChild;
  if(state === 'pushing'){ el.classList.add('busy'); label.textContent = 'Saving ' + detail; }
  else if(state === 'synced'){ label.textContent = 'Saved'; }
  else if(state === 'offline'){ el.classList.add('off'); label.textContent = 'Offline ' + detail + ' waiting'; }
  else if(state === 'signed-out'){ el.classList.add('bad'); label.textContent = 'Not signed in'; }
  else if(state === 'error'){ el.classList.add('bad'); label.textContent = 'Sync problem'; }
}

if(typeof VFSync !== 'undefined' && VFSync.enabled()){
  VFSync.on(syncBadge);
  if(VFSync.signedIn()){
    afterSignIn().catch(() => showGate('Could not reach the server. Sign in again.'));
  }else{
    showGate('');
  }
}



/* ---------- session ---------- */
let ROLE = 'admin';        /* 'owner' | 'admin' | shopId */
let DATE = todayISO();
let TAB  = '';   /* set from the url on boot, see readHash() */
let BOOT_TAB = null;   /* what the url asked for, before the role is known */

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(n, dp){ dp = dp===undefined?2:dp; return (Math.round((n||0)*Math.pow(10,dp))/Math.pow(10,dp)).toString(); }
function shopById(id){ return SHOPS.filter(s=>s.id===id)[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- pricing ---------- */
function commOf(shopId){
  const v = DB.master.comm[shopId];
  return v===undefined || v===null || v==='' ? 0 : parseFloat(v)||0;
}
function purchaseRate(shopId, code){
  const mk = DB.days[DATE] && DB.days[DATE].rates ? DB.days[DATE].rates[code] : null;
  if(mk===undefined || mk===null || mk==='') return null;
  return (parseFloat(mk)||0) * (1 + commOf(shopId)/100);
}
function sellMargin(shopId, code){
  const s = DB.master.selling[shopId];
  if(s && s[code]!==undefined && s[code]!==null && s[code]!=='') return parseFloat(s[code]);
  const e = CAT[code];
  return (e && e.margin!==null && e.margin!==undefined) ? e.margin : null;
}
function sellingPrice(shopId, code){
  const p = purchaseRate(shopId, code);
  const m = sellMargin(shopId, code);
  if(p===null || m===null) return null;
  return p * (1 + m/100);
}

/* ---------- indent state helpers ---------- */
function indentOf(date, shopId){
  DB.indents[date] = DB.indents[date] || {};
  if(!DB.indents[date][shopId]) DB.indents[date][shopId] = {status:'draft', lines:{}, submittedAt:null, late:false};
  return DB.indents[date][shopId];
}
function dayOf(date){
  DB.days[date] = DB.days[date] || {rates:{}, packed:{}, ship:{}, extra:{}};
  const d = DB.days[date];
  d.rates = d.rates || {}; d.packed = d.packed || {}; d.ship = d.ship || {}; d.extra = d.extra || {};
  return d;
}
/* every product any shop has an accepted indent for, plus anything added at packing */
function uniqueCodes(date){
  const set = {};
  const day = dayOf(date);
  Object.keys(DB.indents[date]||{}).forEach(sid=>{
    const ind = DB.indents[date][sid];
    if(ind.status==='accepted' || ind.status==='packed' || ind.status==='shipped' || ind.status==='billed')
      Object.keys(ind.lines).forEach(c=>{ if(ind.lines[c]) set[c]=1; });
  });
  Object.keys(day.packed).forEach(sid=>{
    Object.keys(day.packed[sid]||{}).forEach(c=>{ set[c]=1; });
  });
  return Object.keys(set).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
}
function windowState(){
  if(DB.settings.anytime) return 'open';
  const n = new Date(); const h = n.getHours() + n.getMinutes()/60;
  if(h >= OPEN_H && h < CLOSE_H) return 'open';
  if(h >= CLOSE_H && h < LATE_H) return 'late';
  return 'closed';
}

/* ---------- shell ---------- */
function setRole(r){ ROLE = r; TAB = tabsFor()[0].id; render(); }
function setDate(d){ DATE = d; writeHash(); render(); }
/* The screen lives in the address bar, so a refresh comes back to the
   same place, back and forward work, and a link can be shared. The date
   rides along when it is not today, because "the rates I was looking
   at" usually means a particular day. */
function go(t, keepHash){
  TAB = t;
  toggleSide(false);
  if(!keepHash) writeHash();
  render();
}

function writeHash(){
  const d = (DATE && DATE !== todayISO()) ? '/' + DATE : '';
  const want = '#' + TAB + d;
  if(location.hash !== want){
    /* replace, not push: switching screens should not stack up entries
       the back button has to walk through */
    history.replaceState(null, '', want);
  }
}

function readHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return null;
  const bits = raw.split('/');
  const tab  = bits[0];
  const date = bits[1];
  if(date && /^\d{4}-\d{2}-\d{2}$/.test(date)) DATE = date;
  return tab || null;
}

window.addEventListener('hashchange', function(){
  const t = readHash();
  if(t && t !== TAB){ TAB = t; render(); }
});

   Product list  —  the catalogue, read-only
   ============================================================ */
/* Fold what the server holds over the compiled catalogue. The build is
   the seed; anything added later lives only in the database, so without
   this a new product would vanish on reload and never reach anyone
   else's device. */
function mergeCatalogue(cat){
  if(!cat) return 0;
  let added = 0;
  (cat.products || []).forEach(r=>{
    const known = !!CAT[r.code];
    CAT[r.code] = {
      code: r.code, name: r.name, tamil: r.tamil || '',
      full: r.name + (r.tamil ? ' / ' + r.tamil : ''),
      unit: r.unit || 'kg',
      wt: parseFloat(r.unit_weight_kg) || 0,
      margin: known ? CAT[r.code].margin : null,
      alias: r.alias || '',
    };
    if(r.alias) ALIAS[String(r.alias).toUpperCase()] = r.code;
    if(!known){ CODES.push(r.code); added++; }
  });
  (cat.groups || []).forEach(g=>{
    if(!GROUPS[g.name]) GROUPS[g.name] = [];
    /* a group added on another device has no vendor record here yet, and
       the vendor screen reads its name straight away */
    if(!DB.vendors[g.name]){
      DB.vendors[g.name] = {name:g.name, phone:'', contact:'', address:'', notes:'',
                            manual:!!g.manual, bank:{acName:'',acNo:'',ifsc:'',upi:''}};
    }
  });
  (cat.mapping || []).forEach(m=>{
    const was = CODE2GROUP[m.product_code];
    if(was === m.group_name) return;
    if(was && GROUPS[was]){
      const i = GROUPS[was].indexOf(m.product_code);
      if(i > -1) GROUPS[was].splice(i, 1);
    }
    CODE2GROUP[m.product_code] = m.group_name;
    (GROUPS[m.group_name] = GROUPS[m.group_name] || []).push(m.product_code);
  });
  /* keep the menu order stable and put anything unmapped in Manual order */
  GROUPNAMES.length = 0;
  Object.keys(GROUPS).forEach(g=> GROUPNAMES.push(g));
  CODES.forEach(c=>{
    if(!CODE2GROUP[c]){
      CODE2GROUP[c] = UNGROUPED;
      (GROUPS[UNGROUPED] = GROUPS[UNGROUPED] || []).push(c);
    }
  });
  return added;
}

function addProduct(){
  if(ROLE !== 'owner' && ROLE !== 'admin'){ alert('Only Velora may add a product.'); return; }
  const code  = document.getElementById('npCode').value.trim();
  const name  = document.getElementById('npPName').value.trim();
  const tamil = document.getElementById('npTamil').value.trim();
  const unit  = document.getElementById('npUnit').value;
  const group = document.getElementById('npGroup').value;
  const wt    = parseFloat(document.getElementById('npWt').value) || 0;

  if(!code){ alert('Enter a product code.'); return; }
  if(CAT[code]){ alert('Code '+code+' is already used by '+CAT[code].name+'.'); return; }
  if(!name){ alert('Enter the English name.'); return; }
  if((unit==='box'||unit==='tray') && !wt){
    alert('A '+unit+' needs its weight in kg, otherwise the invoice cannot price it.'); return;
  }

  const prod = {code:code, name:name, tamil:tamil, unit:unit, wt:wt, alias:'', group:group};

  const apply = ()=>{
    CAT[code] = {code:code, name:name, tamil:tamil,
                 full:name+(tamil?' / '+tamil:''), unit:unit, wt:wt, margin:null, alias:''};
    CODES.push(code);
    CODE2GROUP[code] = group;
    (GROUPS[group] = GROUPS[group] || []).push(code);
    PRODQ = '';
    render();
  };

  if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn()){
    VFSync.addProduct(prod).then(()=>{ apply(); })
      .catch(e=> alert('Could not add the product: ' + (e.message || e)));
  }else{
    /* no server configured — the app still works, but only here */
    apply();
  }
}

/* Supabase signs people in by email, and phone sign-in needs an SMS
   provider nobody has set up. Shop staff often have no email at all, so
   one is derived from their phone. It is a username, not an address:
   nothing is ever sent to it, and the account is created already
   confirmed. */
function loginIdFor(role, phone, shopId){
  const digits = String(phone || '').replace(/[^0-9]/g, '');
  const who = (role === 'shop' && shopId) ? shopId.toLowerCase() : role;
  return who + '.' + digits + '@shop.velorafresh.in';
}

function suggestPass(){
  /* no l, I, O, 0 or 1 — this gets read out over the phone */
  const a = 'abcdefghjkmnpqrstuvwxyz', A = 'ABCDEFGHJKMNPQRSTUVWXYZ', d = '23456789';
  const pool = a + A + d;
  let out = '';
  const r = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(r);
  for(let i=0;i<10;i++) out += pool.charAt(r[i] % pool.length);
  document.getElementById('npPass').value = out;
}

function npRoleChanged(){

function addPerson(){
  const name  = document.getElementById('npName').value.trim();
  const phone = document.getElementById('npPhone').value.replace(/\s+/g,'');
  const email = document.getElementById('npEmail').value.trim();
  const role  = document.getElementById('npRole').value;
  const shop  = document.getElementById('npShop').value;

  const pass = document.getElementById('npPass').value.trim();

  if(!phone && !email){ alert('Enter a phone number or an email address.'); return; }
  if(role === 'shop' && !phone){ alert('A shop login needs a phone number.'); return; }
  if(pass && pass.length < 8){ alert('Use a password of at least 8 characters.'); return; }

  /* No email typed but a password given: derive a login id from the
     phone rather than refusing. Nothing is emailed to it. */
  let loginId = email;
  if(pass && !loginId){
    if(!phone){ alert('Enter a phone number, or an email address.'); return; }
    loginId = loginIdFor(role, phone, shop);
  }

  const common = {
    role: role, name: name, phone: phone || null, email: (email || null),
    clientId: (role === 'shop' || role === 'ho') ? VF_CONFIG.clientId : null,
    shopId:   (role === 'shop') ? shop : null,
  };

  const done = ()=>{ PEOPLE = null; loadPeople(); };
  const failed = (e)=>{
    PEOPLE_BUSY = false;
    alert('Could not add: ' + (e.message || e));
    render();
  };

  PEOPLE_BUSY = true; render();

  if(pass){
    VFSync.createUser(Object.assign({}, common, {password: pass, email: loginId}))
      .then(()=>{
        NEWLOGIN = {name: name || loginId, login: loginId, pass: pass, phone: phone};
        done();
      })
      .catch(e=>{
        if(e.notDeployed){
          /* the edge function is not up yet — fall back rather than
             leaving the owner with nothing */
          VFSync.invitePerson(common).then(()=>{
            alert('Creating logins directly is not switched on for this project yet, '
                + 'so an invite was recorded instead. They can sign up with '
                + email + ' and choose their own password.');
            done();
          }).catch(failed);
        }else failed(e);
      });
  }else{
    VFSync.invitePerson(common).then(done).catch(failed);
  }
}

   than the person, because managers change and the shop's number does

function setShopPhone(id, v){
  const sh = shopById(id); if(!sh) return;
  sh.phone = String(v || '').replace(/\s+/g,'');
  DB.shopPhones = DB.shopPhones || {};
  DB.shopPhones[id] = sh.phone;
  save();

function addShop(){
  if(ROLE !== 'owner'){ alert('Only an owner may add a shop.'); return; }
  const code = document.getElementById('nsCode').value.trim().toUpperCase();
  const name = document.getElementById('nsName').value.trim();
  const comm = parseFloat(document.getElementById('nsComm').value);

  if(!/^[A-Z]{2,4}$/.test(code)){ alert('The code must be 2 to 4 letters, A to Z.'); return; }
  if(!name){ alert('Enter the shop name.'); return; }
  if(SHOPS.filter(s=>s.id===code).length){ alert(code+' already exists.'); return; }
  if(isNaN(comm) || comm < 0){ alert('Enter a commission percentage.'); return; }

  const shop = {id:code, name:name, prefix:'VF/'+code, comm:comm};
  SHOPS.push(shop);
  DB.master.comm[code] = comm;
  save();

  /* The shop must reach the shops table before anything can reference
     it — margin_comm and every indent carry a foreign key to it. */
  if(typeof VFSync !== 'undefined' && VFSync.enabled() && VFSync.signedIn()){
    VFSync.addShop(shop).then(()=>{ VFSync.push(); render(); })
      .catch(e=>{
        SHOPS.pop(); delete DB.master.comm[code]; save();
        alert('Could not add the shop: ' + (e.message || e));
        render();
      });
  }else{
    render();
  }
}

/* product search (shared) */
function searchList(term){
  const t = (term||'').trim().toLowerCase();
  if(!t) return [];
  const out = [];
  for(let i=0;i<CODES.length && out.length<40;i++){
    const e = CAT[CODES[i]];
    if(e.code.indexOf(t)===0 || e.name.toLowerCase().indexOf(t)>=0 || e.tamil.indexOf(term.trim())>=0
       || (e.alias && e.alias.indexOf(t)===0)) out.push(e);
  }
  return out;
}
function wireSearch(onPick){
  const q = document.getElementById('q'), sug = document.getElementById('sug');
  if(!q) return;
  let hi = -1, list = [];
  function close(){ sug.style.display='none'; hi=-1; }
  function draw(){
    list = searchList(q.value);
    if(!list.length){ close(); return; }
    sug.innerHTML = list.map((e,i)=>'<div class="'+(i===hi?'hi':'')+'" data-c="'+e.code+'"><span class="mono">'+esc(e.code)+'</span> &nbsp;'+esc(e.name)+' <span style="color:#9a9a94">'+esc(e.tamil)+'</span></div>').join('');
    sug.style.display='block';
    Array.prototype.forEach.call(sug.children, el=>{
      el.onmousedown = ev=>{ ev.preventDefault(); onPick(el.getAttribute('data-c')); };
    });
  }
  q.oninput = draw;
  q.onblur = ()=> setTimeout(close, 150);
  q.onkeydown = ev=>{
    if(ev.key==='ArrowDown'){ hi=Math.min(hi+1,list.length-1); draw(); ev.preventDefault(); }
    else if(ev.key==='ArrowUp'){ hi=Math.max(hi-1,0); draw(); ev.preventDefault(); }
    else if(ev.key==='Enter'){
      const pick = hi>=0 ? list[hi] : (list.length?list[0]:null);
      if(pick){ onPick(pick.code); ev.preventDefault(); }
    } else if(ev.key==='Escape') close();
  };
  q.focus();
}

function statusPill(s, late){
  const map = {draft:['p-grey','Not submitted'], submitted:['p-blue','Submitted'], accepted:['p-amber','Accepted'],
               packed:['p-amber','Packed'], shipped:['p-blue','Out for delivery'], received:['p-green','Received'], billed:['p-green','Billed']};
  const m = map[s] || map.draft;
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>'+(late?' <span class="pill p-red">Late</span>':'');
}
function shopStatus(shopId){
  const day = dayOf(DATE);
  if(DB.invoices[DATE] && DB.invoices[DATE][shopId]) return 'billed';
  if(day.ship[shopId]==='received') return 'received';
  if(day.ship[shopId]==='out') return 'shipped';
  const ind = indentOf(DATE, shopId);
  const packed = day.packed[shopId] || {};
  if(Object.keys(packed).length) return 'packed';
  return ind.status;
}
function vBoard(){
  const day = dayOf(DATE);
  let tiles='', totVal=0, totLines=0, indented=0, supplied=0;
  SHOPS.forEach(s=>{
    const ind = indentOf(DATE, s.id);
    const packed = day.packed[s.id]||{};
    let val=0, n=0;
    Object.keys(packed).forEach(c=>{
      const q=packed[c]; if(!q) return;
      n++; const pr=purchaseRate(s.id,c); if(pr!==null) val += netKg(c,q,CAT[c].unit)*pr;
    });
    totVal+=val; totLines+=n;
    indented += Object.keys(ind.lines).filter(c=>ind.lines[c]>0).length;
    supplied += n;
    const st = shopStatus(s.id);
    tiles += '<div class="tile t-'+st+'" onclick="openShop(\''+s.id+'\')">'
      + '<div class="nm">'+esc(s.name)+'</div>'
      + '<div class="big mono">'+(val?'&#8377;'+money(val):'&mdash;')+'</div>'
      + '<div class="sub" style="margin:0 0 7px">'+Object.keys(ind.lines).length+' indented &middot; '+n+' packed</div>'
      + statusPill(st, ind.late) + '</div>';
  });
  const fill = indented ? Math.round(supplied/indented*100) : 0;
  return '<h2>Day board</h2><p class="sub">'+fmtDate(DATE)+' &middot; '+esc(CLIENT)+'</p>'
   + '<div class="kpi">'
   + '<div><div class="lb">Day value</div><div class="vl mono">&#8377;'+money(totVal)+'</div></div>'
   + '<div><div class="lb">Lines packed</div><div class="vl mono">'+totLines+'</div></div>'
   + '<div><div class="lb">Rates entered</div><div class="vl mono">'+Object.keys(day.rates).filter(c=>day.rates[c]!=='').length+' / '+uniqueCodes(DATE).length+'</div></div>'
   + '<div><div class="lb">Fill rate</div><div class="vl mono">'+fill+'%</div></div>'
   + '</div><div class="grid">'+tiles+'</div>';

function vRates(){
  const day = dayOf(DATE);
