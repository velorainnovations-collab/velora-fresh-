/* ---------- Supabase sync (inlined by src/build.py) ---------- */
/* ============================================================
   Velora Fresh — Supabase sync
   Inlined into index.html by src/build.py.

   Local-first. Every read and write still goes through the same
   localStorage blob the app has always used, so the admin entering
   rates at Koyambedu at 4 am on bad signal never waits for a network
   round trip. Changes are diffed into row operations, queued, and
   pushed when the connection allows.

   Talks to PostgREST with fetch rather than loading supabase-js from a
   CDN: the app stays one file and works with no network at all.
   ============================================================ */

const VFSync = (function () {
  'use strict';

  const QKEY  = 'VF_QUEUE';      // pending row operations
  const SKEY  = 'VF_SYNCED';     // last snapshot known to be on the server
  const AKEY  = 'VF_AUTH';       // session tokens

  /* ---------- configuration ----------
     Filled in by the deployer. With no url the app runs exactly as it
     did before: pure localStorage, no network, nothing to break. */
  const CFG = window.VF_CONFIG || { url: '', anonKey: '', clientId: 'KPN' };

  const enabled = () => !!(CFG.url && CFG.anonKey);

  /* ============================================================
     1. Flatten the nested blob into rows
     ============================================================
     The app stores one nested object keyed by date. The database is
     normalised. Rather than diff the nesting, both sides are flattened
     to `table -> key -> row` and compared as flat maps. Diffing then
     falls out as a set comparison, and a change to one product's rate
     produces exactly one row operation.                              */

  function flatten(DB) {
    const out = {
      indents: {}, indent_lines: {}, day_rates: {}, packed: {},
      shipments: {}, vendor_orders: {}, vendor_order_lines: {},
      invoices: {}, invoice_lines: {},
      payments: {}, vendors: {}, vendor_bank: {}, margin_comm: {},
      margin_selling: {}, settings: {},
    };
    if (!DB) return out;

    // ---- indents ----
    Object.keys(DB.indents || {}).forEach(date => {
      Object.keys(DB.indents[date] || {}).forEach(shop => {
        const ind = DB.indents[date][shop] || {};
        // an untouched draft with no lines is not worth a row
        const lines = ind.lines || {};
        if (ind.status === 'draft' && !Object.keys(lines).length) return;

        out.indents[date + '|' + shop] = {
          trade_date: date, shop_id: shop,
          status: ind.status || 'draft',
          submitted_at: ind.submittedAt || null,
          accepted_at: ind.acceptedAt || null,
          accepted_by_name: ind.acceptedBy || null,
          late: !!ind.late,
        };
        Object.keys(lines).forEach(code => {
          out.indent_lines[date + '|' + shop + '|' + code] = {
            trade_date: date, shop_id: shop,
            product_code: code, qty: Number(lines[code]) || 0,
          };
        });
      });
    });

    // ---- the trading day ----
    Object.keys(DB.days || {}).forEach(date => {
      const day = DB.days[date] || {};

      Object.keys(day.rates || {}).forEach(code => {
        const r = day.rates[code];
        if (r === '' || r === null || r === undefined) return;
        out.day_rates[date + '|' + code] = {
          trade_date: date, product_code: code, rate: Number(r) || 0,
        };
      });

      Object.keys(day.packed || {}).forEach(shop => {
        const p = day.packed[shop] || {};
        Object.keys(p).forEach(code => {
          // 0 is meaningful — the vendor skipped it on quality — so it
          // is stored, not dropped
          out.packed[date + '|' + shop + '|' + code] = {
            trade_date: date, shop_id: shop,
            product_code: code, qty: Number(p[code]) || 0,
          };
        });
      });

      Object.keys(day.ship || {}).forEach(shop => {
        const st = day.ship[shop];
        if (!st) return;
        out.shipments[date + '|' + shop] = {
          trade_date: date, shop_id: shop,
          state: st === 'received' ? 'received' : 'out',
        };
      });

      Object.keys(day.sent || {}).forEach(g => {
        if (!day.sent[g]) return;
        out.vendor_orders[date + '|' + g] = { trade_date: date, group_name: g };
      });

      /* only what was changed from the sum of the indents: no row means
         buy exactly what the shops asked for */
      Object.keys(day.order || {}).forEach(code => {
        const q = day.order[code];
        if (q === '' || q === null || q === undefined) return;
        const g = groupNameFor(code);
        if (!g) return;
        out.vendor_order_lines[date + '|' + code] = {
          trade_date: date, group_name: g,
          product_code: code, qty: Number(q) || 0,
        };
      });
    });

    // ---- invoices ----
    Object.keys(DB.invoices || {}).forEach(date => {
      Object.keys(DB.invoices[date] || {}).forEach(shop => {
        const inv = DB.invoices[date][shop];
        if (!inv) return;
        const id = inv.id || uuidFor(date + '|' + shop);
        out.invoices[date + '|' + shop] = {
          id: id, bill_no: inv.no, trade_date: date, shop_id: shop,
          total: round2(inv.total), round_off: round2(inv.roundOff || 0),
          net_amount: round2((inv.total || 0) + (inv.roundOff || 0)),
        };
        (inv.lines || []).forEach((l, i) => {
          out.invoice_lines[date + '|' + shop + '|' + (i + 1)] = {
            invoice_id: id, line_no: i + 1,
            product_code: l.code, name: l.name, tamil: l.tamil || '',
            unit: l.unit, qty: Number(l.qty) || 0, net_kg: Number(l.net) || 0,
            // frozen values — never recomputed from the current master
            rate: Number(l.rate) || 0,
            amount: round2(l.amount),
            sell: Number(l.sell) || 0,
          };
        });
      });
    });

    // ---- money ----
    (DB.payments || []).forEach(p => {
      if (!p || !p.id) return;
      out.payments[p.id] = {
        id: uuidFor(p.id), client_id: CFG.clientId,
        paid_on: p.date, amount: round2(p.amount),
        mode: p.mode || 'NEFT', ref: p.ref || '',
      };
    });

    // ---- vendors ----
    Object.keys(DB.vendors || {}).forEach(g => {
      const v = DB.vendors[g] || {};
      out.vendors[g] = {
        group_name: g, name: v.name || '', phone: v.phone || '',
        contact: v.contact || '', address: v.address || '', notes: v.notes || '',
      };
      const b = v.bank || {};
      // only send a bank row once something has been entered; an empty
      // one would be refused for any role but owner
      if (b.acName || b.acNo || b.ifsc || b.upi) {
        out.vendor_bank[g] = {
          group_name: g, ac_name: b.acName || '', ac_no: b.acNo || '',
          ifsc: b.ifsc || '', upi: b.upi || '',
        };
      }
    });

    // ---- margins ----
    const m = DB.master || {};
    Object.keys(m.comm || {}).forEach(shop => {
      out.margin_comm[shop] = { shop_id: shop, pct: Number(m.comm[shop]) || 0 };
    });
    Object.keys(m.selling || {}).forEach(shop => {
      Object.keys(m.selling[shop] || {}).forEach(code => {
        out.margin_selling[shop + '|' + code] = {
          shop_id: shop, product_code: code,
          pct: Number(m.selling[shop][code]) || 0,
        };
      });
    });

    // ---- settings ----
    out.settings[CFG.clientId] = {
      client_id: CFG.clientId, anytime: !!(DB.settings || {}).anytime,
    };

    return out;
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  /* which vendor's bill a product belongs to. The mapping lives in the
     app, which is inlined into the same script; if it is not there the
     row is dropped rather than guessed at. */
  function groupNameFor(code) {
    try { return (typeof groupOf === 'function') ? (groupOf(code) || '') : ''; }
    catch (e) { return ''; }
  }

  /* Stable uuid from a string, so the same logical record keeps the same
     id on every device without a server round trip. Not a real v5 hash —
     it only has to be deterministic and collision-free over our keys. */
  function uuidFor(str) {
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str)) return str;
    let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x9e3779b9, h4 = 0x85ebca6b;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 + c, 2654435761) >>> 0;
      h3 = Math.imul(h3 ^ (c + i), 2246822519) >>> 0;
      h4 = Math.imul(h4 + (c * (i + 1)), 3266489917) >>> 0;
    }
    const hex = n => ('00000000' + n.toString(16)).slice(-8);
    const s = hex(h1) + hex(h2) + hex(h3) + hex(h4);
    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-5' + s.slice(13, 16) + '-a'
         + s.slice(17, 20) + '-' + s.slice(20, 32);
  }

  /* ============================================================
     2. Diff two flat maps into row operations
     ============================================================ */

  // Natural keys, so a row can be upserted or deleted without knowing
  // the surrogate id the database assigned.
  const CONFLICT = {
    indents:        'trade_date,shop_id',
    indent_lines:   'trade_date,shop_id,product_code',
    day_rates:      'trade_date,product_code',
    packed:         'trade_date,shop_id,product_code',
    shipments:      'trade_date,shop_id',
    vendor_orders:  'trade_date,group_name',
    vendor_order_lines: 'trade_date,group_name,product_code',
    invoices:       'trade_date,shop_id',
    invoice_lines:  'invoice_id,line_no',
    payments:       'id',
    vendors:        'group_name',
    vendor_bank:    'group_name',
    margin_comm:    'shop_id',
    margin_selling: 'shop_id,product_code',
    settings:       'client_id',
  };

  function diff(before, after) {
    const ops = [];
    Object.keys(CONFLICT).forEach(table => {
      const a = before[table] || {}, b = after[table] || {};
      Object.keys(b).forEach(k => {
        if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) {
          ops.push({ table: table, op: 'upsert', key: k, row: b[k] });
        }
      });
      Object.keys(a).forEach(k => {
        if (!(k in b)) ops.push({ table: table, op: 'delete', key: k, row: a[k] });
      });
    });
    return ops;
  }

  /* Later operations on the same row supersede earlier ones. Without
     this, typing a rate four times would send four requests. */
  function collapse(ops) {
    const seen = {};
    ops.forEach(o => { seen[o.table + '\u0000' + o.key] = o; });
    // preserve insertion order of the surviving ops
    const out = [], done = {};
    ops.forEach(o => {
      const k = o.table + '\u0000' + o.key;
      if (done[k]) return;
      done[k] = true;
      out.push(seen[k]);
    });
    return out;
  }

  /* Parents before children, so a line never arrives before its header.
     Deletes run in reverse for the same reason. */
  const ORDER = ['settings', 'vendors', 'vendor_bank', 'margin_comm', 'margin_selling',
                 'indents', 'indent_lines', 'day_rates', 'packed', 'shipments',
                 'vendor_orders', 'vendor_order_lines', 'invoices', 'invoice_lines',
                 'payments'];

  function sortOps(ops) {
    return ops.slice().sort((x, y) => {
      if (x.op !== y.op) return x.op === 'upsert' ? -1 : 1;
      const ix = ORDER.indexOf(x.table), iy = ORDER.indexOf(y.table);
      return x.op === 'upsert' ? ix - iy : iy - ix;
    });
  }

  /* ============================================================
     3. Queue — survives reload and offline
     ============================================================ */

  function readJSON(k, dflt) {
    try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; }
  }
  function writeJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full or private mode */ }
  }

  let queue = readJSON(QKEY, []);
  let synced = readJSON(SKEY, null);

  /* What each role is allowed to write, read straight off the policies
     in supabase/02_security.sql. Anything else is dropped before it is
     ever queued.

     Without this a shop's browser queued the whole local blob — rates,
     vendors, margins, settings, every shop's packing — because the
     first render happens before anyone has signed in, when the baseline
     is empty and every default therefore looks like new work. The push
     that followed was refused by the database, correctly, and the badge
     read "Sync problem" for work the shop had never done.

     null means no limit. An unknown role writes nothing, which is what
     the moment before sign-in should queue. */
  const WRITABLE = {
    owner: null,
    admin: null,
    ho:    ['indents', 'indent_lines'],
    shop:  ['indents', 'indent_lines', 'shipments'],
    /* vendor_order_lines is Velora's: a shop asks for a quantity, it
       does not decide what is bought */
  };
  let WHO = { role: '', shop: '' };

  function mayWrite(table) {
    if (!WHO.role) return false;
    const list = WRITABLE[WHO.role];
    if (list === null) return true;
    return !!list && list.indexOf(table) > -1;
  }

  /* Told by the app as soon as whoami() answers. Also prunes anything
     already waiting that this role may not send — a device that queued
     the wrong rows before this existed clears itself on the next open
     rather than retrying every fifteen seconds for ever. */
  function setWho(role, shopId) {
    WHO = { role: role || '', shop: shopId || '' };
    const kept = queue.filter(o => mayWrite(o.table));
    if (kept.length !== queue.length) { queue = kept; writeJSON(QKEY, queue); }
    return queue.length;
  }

  function record(DB) {
    if (!enabled()) return 0;
    const now = flatten(DB);
    /* the baseline still moves for rows this role may not send, so a
       change it is not allowed to make is dropped once, not every time */
    const ops = diff(synced || {}, now).filter(o => mayWrite(o.table));
    if (!ops.length) {
      if (synced !== now) { synced = now; writeJSON(SKEY, synced); }
      return 0;
    }
    queue = collapse(queue.concat(ops));
    writeJSON(QKEY, queue);
    synced = now;          // optimistic: rolled back if the push fails
    writeJSON(SKEY, synced);
    schedule();
    return ops.length;
  }

  /* ============================================================
     4. Auth
     ============================================================ */

  let auth = readJSON(AKEY, null);

  function headers(extra) {
    const h = Object.assign({
      'apikey': CFG.anonKey,
      'Content-Type': 'application/json',
    }, extra || {});
    if (auth && auth.access_token) h['Authorization'] = 'Bearer ' + auth.access_token;
    return h;
  }

  async function signIn(email, password) {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email, password: password }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || 'Sign in failed');
    auth = j; writeJSON(AKEY, auth);
    return j;
  }

  /* Shop staff sign in with a phone number, not an address. The login id
     is built from the phone the same way it was built when the account
     was created, so nothing has to be looked up first — which matters,
     because nothing can be looked up before signing in.

     Older accounts carry the shop code or the role in front of the
     digits. Those shapes are tried in turn if the plain one is refused,
     so a login made last week still opens. */
  function shopLoginIds(phone, shopIds) {
    const d = String(phone || '').replace(/[^0-9]/g, '');
    const at = '@shop.velorafresh.in';
    const ids = ['p' + d + at];
    (shopIds || []).forEach(s => ids.push(String(s).toLowerCase() + '.' + d + at));
    ['shop', 'admin', 'ho', 'owner'].forEach(r => ids.push(r + '.' + d + at));
    return ids;
  }

  async function signInShop(phone, password, shopIds) {
    const ids = shopLoginIds(phone, shopIds);
    for (let i = 0; i < ids.length; i++) {
      try { return await signIn(ids[i], password); }
      catch (e) { /* wrong shape or wrong password — try the next shape */ }
    }
    throw new Error('That phone number and password do not match. '
                  + 'Check them, or ask the office to reset your password.');
  }

  /* Creating the account. Safe to leave open: an account with no
     invite gets no app_users row, and every policy then resolves to
     false — it can sign in and see nothing at all. The invite, not the
     signup, is what grants access. */
  async function signUp(email, password) {
    const r = await fetch(CFG.url + '/auth/v1/signup', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email, password: password }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Could not create the account');
    // a session comes back only when email confirmation is switched off
    if (j.access_token) { auth = j; writeJSON(AKEY, auth); return { signedIn: true }; }
    return { signedIn: false, needsConfirmation: true };
  }

  /* ---------- email codes and recovery ----------
     Owner, admin and head office have real email addresses, so Supabase
     can do all of this itself: a six digit code to sign in, a link to
     reset a forgotten password, and setting a new one afterwards.
     Nothing here needs a provider account. Supabase's built-in mail is
     rate limited though, so a real SMTP has to be configured before
     this carries daily use. */

  async function sendLoginCode(email) {
    const r = await fetch(CFG.url + '/auth/v1/otp', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email, create_user: false }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Could not send the code');
    return true;
  }

  async function verifyLoginCode(email, code) {
    const r = await fetch(CFG.url + '/auth/v1/verify', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ type: 'email', email: email, token: code }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'That code did not work');
    auth = j; writeJSON(AKEY, auth);
    return j;
  }

  async function sendRecovery(email) {
    const r = await fetch(CFG.url + '/auth/v1/recover', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email: email }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error_description || j.msg || j.message || 'Could not send the reset email');
    }
    return true;
  }

  /* The recovery link comes back with a session in the url fragment.
     Adopting it lets the new password be set, and nothing else — the
     app still checks app_users before letting anyone in. */
  function adoptRecoverySession() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h || h.indexOf('access_token=') < 0) return null;
    const q = new URLSearchParams(h);
    const type = q.get('type');
    const at = q.get('access_token');
    if (!at) return null;
    auth = { access_token: at, refresh_token: q.get('refresh_token') || '', token_type: 'bearer' };
    writeJSON(AKEY, auth);
    // strip it from the address bar so the token is not left in history
    history.replaceState(null, '', location.pathname + location.search);
    return type || 'recovery';
  }

  async function setOwnPassword(password) {
    if (!signedIn()) throw new Error('This reset link has expired. Ask for a new one.');
    const r = await fetch(CFG.url + '/auth/v1/user', {
      method: 'PUT', headers: headers(),
      body: JSON.stringify({ password: password }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Could not set the password');
    return true;
  }

  async function refresh() {
    if (!auth || !auth.refresh_token) return false;
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ refresh_token: auth.refresh_token }),
    });
    if (!r.ok) { auth = null; writeJSON(AKEY, null); return false; }
    auth = await r.json(); writeJSON(AKEY, auth);
    return true;
  }

  function signOut() {
    auth = null; writeJSON(AKEY, null);
    WHO = { role: '', shop: '' };   /* nothing is queued until somebody is back */
  }

  const signedIn = () => !!(auth && auth.access_token);

  /* ============================================================
     5. Push
     ============================================================ */

  let pushing = false, timer = null;
  const listeners = [];

  function on(fn) { listeners.push(fn); }
  function emit(state, detail) { listeners.forEach(f => { try { f(state, detail); } catch (e) {} }); }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(push, ms === undefined ? 800 : ms);
  }

  /* ---------- indent lines ----------
     The app thinks in days and shops. The database keys an indent line
     by the id of its header row: indent_lines is (indent_id,
     product_code, qty) and has no trade_date or shop_id at all.

     Every push carrying a line was therefore handed columns the table
     does not have and refused — and a shop's only work IS indent lines,
     so a shop could never sync anything. The mock accepted whatever it
     was sent, which is exactly why the tests never saw it.

     The header's id is looked up here, once per day and shop, and the
     rows are rewritten before they go. sortOps puts the indents upsert
     ahead of its lines in the same batch, so the header is always there
     to be found. */
  const indentIds = new Map();

  async function indentIdFor(date, shop) {
    const k = date + '|' + shop;
    if (indentIds.has(k)) return indentIds.get(k);
    const r = await fetch(CFG.url + '/rest/v1/indents?select=id'
      + '&trade_date=eq.' + encodeURIComponent(date)
      + '&shop_id=eq.' + encodeURIComponent(shop), { headers: headers() });
    if (!r.ok) throw await httpError(r, 'indents');
    const rows = await r.json();
    if (!rows.length) {
      throw new Error('indent_lines: no indent for ' + shop + ' on ' + date
                      + ' — the day it belongs to has not been saved yet');
    }
    indentIds.set(k, rows[0].id);
    return rows[0].id;
  }

  async function asLineRows(rows, isDelete) {
    const out = [];
    for (const row of rows) {
      let id;
      try {
        id = await indentIdFor(row.trade_date, row.shop_id);
      } catch (e) {
        /* removing a line from a day that is no longer there is already
           what was wanted; only a save needs the header to exist */
        if (isDelete) continue;
        throw e;
      }
      out.push({ indent_id: id, product_code: row.product_code, qty: row.qty });
    }
    return out;
  }

  async function send(table, rows, isDelete, keyCols, depth) {
    depth = depth || 0;
    if (table === 'indent_lines') {
      rows = await asLineRows(rows, isDelete);
      keyCols = ['indent_id', 'product_code'];
      if (!rows.length) return;
    }
    if (isDelete) {
      // one request per row: the filter is a conjunction of its key columns
      for (const row of rows) {
        const qs = keyCols.map(c => c + '=eq.' + encodeURIComponent(row[c])).join('&');
        const r = await fetch(CFG.url + '/rest/v1/' + table + '?' + qs, {
          method: 'DELETE', headers: headers(),
        });
        if (!r.ok && r.status !== 404) throw await httpError(r, table);
      }
      return;
    }
    // Postgres refuses to let ON CONFLICT DO UPDATE touch the same row
    // twice in one statement — it raises cardinality_violation, which
    // PostgREST returns as 409. collapse() dedupes by operation key,
    // which is not always the same thing as the database conflict key,
    // so the payload is deduped again here on the columns that actually
    // decide the conflict. Later rows win, matching last-write-wins.
    const byKey = new Map();
    rows.forEach(row => byKey.set(keyCols.map(c => String(row[c])).join('\u0000'), row));
    const unique = Array.from(byKey.values());

    const r = await fetch(
      CFG.url + '/rest/v1/' + table + '?on_conflict=' + encodeURIComponent(keyCols.join(',')),
      {
        method: 'POST',
        headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(unique),
      });
    if (!r.ok) {
      const e = await httpError(r, table);
      /* A project a version behind this build does not have every column
         yet. PostgREST names the one it could not find, so it is dropped
         and the rest of the row is sent — the day's work goes up, and
         only the new field waits for the migration. Bounded, so a
         genuine fault cannot spin here. */
      const miss = missingColumn(e);
      if (miss && depth < 4 && unique.some(row => miss in row)) {
        unique.forEach(row => { delete row[miss]; });
        if (typeof console !== 'undefined') {
          console.warn('[VFSync] ' + table + '.' + miss + ' is not in this project yet — '
                       + 'sent without it');
        }
        return send(table, unique, false, keyCols, depth + 1);
      }
      throw e;
    }
  }

  /* "Could not find the 'accepted_at' column of 'indents' in the schema
     cache" — the column, not the table, so the row is worth retrying. */
  function missingColumn(e) {
    const b = e && e.body;
    const msg = (b && b.message) || (e && e.message) || '';
    if (!/column/i.test(msg)) return '';
    const m = msg.match(/'([a-z0-9_]+)' column/i);
    return m ? m[1] : '';
  }

  /* A project that has not been given the newest schema yet answers
     "relation does not exist" for a table this build knows about. That
     is not a failure of the day's work: everything else still goes, and
     these rows wait in the queue until the migration is run. */
  function isMissingTable(e) {
    const b = e && e.body;
    if (b && (b.code === 'PGRST205' || b.code === '42P01')) return true;
    return !!(e && /does not exist|schema cache/i.test(e.message || ''));
  }

  async function httpError(r, table) {
    let body = null;
    try { body = await r.json(); } catch (e) { /* empty or non-JSON */ }
    // PostgREST puts the real cause in message/details/hint; without it a
    // failure is just a number and cannot be diagnosed from a screenshot
    const detail = body
      ? [body.message, body.details, body.hint].filter(Boolean).join(' — ')
      : r.statusText;
    const e = new Error((table ? table + ': ' : '') + 'HTTP ' + r.status + ' ' + detail);
    e.status = r.status;
    e.table = table;
    e.body = body;
    if (typeof console !== 'undefined') console.error('[VFSync]', e.message, body || '');
    return e;
  }

  async function push() {
    if (!enabled() || pushing || !queue.length) return;
    if (!navigator.onLine) { emit('offline', queue.length); return; }
    if (!signedIn()) { emit('signed-out', queue.length); return; }

    pushing = true;
    emit('pushing', queue.length);
    const batch = sortOps(queue);

    const held = [];        // ops for a table this project does not have yet
    try {
      // group consecutive ops of the same table and direction
      let i = 0;
      while (i < batch.length) {
        const t = batch[i].table, isDel = batch[i].op === 'delete';
        const rows = [], ops = [];
        while (i < batch.length && batch[i].table === t && (batch[i].op === 'delete') === isDel) {
          rows.push(batch[i].row); ops.push(batch[i]); i++;
        }
        try {
          await send(t, rows, isDel, CONFLICT[t].split(','));
        } catch (e) {
          if (!isMissingTable(e)) throw e;
          if (typeof console !== 'undefined') {
            console.warn('[VFSync] ' + t + ' is not in this project yet — '
                         + ops.length + ' row(s) held back until it is');
          }
          held.push.apply(held, ops);
        }
      }
      queue = held; writeJSON(QKEY, queue);
      emit('synced', held.length);
    } catch (err) {
      if (err.status === 401 && await refresh()) { pushing = false; return push(); }
      // keep the queue; the next attempt retries it
      emit('error', err.message);
      schedule(15000);
    } finally {
      pushing = false;
    }
  }

  /* ============================================================
     6. Pull
     ============================================================
     Rebuilds the nested blob from the server. Used on first sign-in and
     when a device has been away. Anything still queued locally is
     pushed afterwards, so unsent local work is never lost. */

  async function get(table, select, filter) {
    const r = await fetch(CFG.url + '/rest/v1/' + table + '?select=' + (select || '*')
                          + (filter ? '&' + filter : ''), { headers: headers() });
    if (!r.ok) throw await httpError(r, table);
    return r.json();
  }

  /* ---------- one day, on demand ----------
     A shop submits on its own phone; the office is looking at a screen
     that was drawn before that happened. The lorry leaves the office;
     the shop is looking at a screen drawn before that. Rather than make
     somebody press reload — and rather than pull the whole history every
     half minute — this reads just the day on screen and merges it in:
     the indents, what was packed, and where the lorry is.
     Returns true when something actually changed, so the caller only
     redraws when there is a reason to. */
  async function refreshIndents(DB, date) {
    if (!enabled() || !signedIn() || !date) return false;
    const before = JSON.stringify([DB.indents[date] || {}, DB.days[date] || {}]);
    let inds;
    try {
      inds = await get('indents', '*', 'trade_date=eq.' + encodeURIComponent(date));
    } catch (e) { return false; }        /* offline, or a slow moment */
    const ids = inds.map(i => i.id).filter(Boolean);
    let lines = [];
    if (ids.length) {
      try {
        lines = await get('indent_lines', '*', 'indent_id=in.(' + ids.join(',') + ')');
      } catch (e) { lines = []; }
    }
    const byId = {};
    const day = DB.indents[date] = DB.indents[date] || {};
    /* only the shops the server answered for: a draft being typed here
       and not yet sent must not be wiped by a read */
    inds.forEach(i => {
      byId[i.id] = i.shop_id;
      day[i.shop_id] = {
        status: i.status, lines: {},
        submittedAt: i.submitted_at || null,
        acceptedAt: i.accepted_at || null,
        acceptedBy: i.accepted_by_name || null,
        late: !!i.late,
      };
    });
    lines.forEach(l => {
      const shop = byId[l.indent_id];
      if (shop && day[shop]) day[shop].lines[l.product_code] = Number(l.qty);
    });
    /* packing and the lorry, so a shop sees "out for delivery" the
       moment the office marks it, and the packing screen picks up a
       weight entered on another device */
    const D = DB.days[date] = DB.days[date] ||
              { rates: {}, packed: {}, ship: {}, sent: {} };
    try {
      const pk = await get('packed', '*', 'trade_date=eq.' + encodeURIComponent(date));
      pk.forEach(r => {
        (D.packed[r.shop_id] = D.packed[r.shop_id] || {})[r.product_code] = Number(r.qty);
      });
    } catch (e) { /* leave what is on this device */ }
    try {
      const sh = await get('shipments', '*', 'trade_date=eq.' + encodeURIComponent(date));
      sh.forEach(r => { D.ship[r.shop_id] = r.state; });
    } catch (e) { /* same */ }

    const changed = JSON.stringify([day, D]) !== before;
    if (changed) { synced = flatten(DB); writeJSON(SKEY, synced); }
    return changed;
  }

  async function pull(DB) {
    if (!enabled() || !signedIn()) return DB;

    const [inds, ilines, rates, pk, ship, vo, vol, invs, ivl, pays, vend, vbank, mc, ms, st] =
      await Promise.all(['indents', 'indent_lines', 'day_rates', 'packed', 'shipments',
                         'vendor_orders', 'vendor_order_lines', 'invoices', 'invoice_lines',
                         'payments', 'vendors', 'vendor_bank', 'margin_comm', 'margin_selling',
                         'settings'].map(t => get(t).catch(() => [])));

    const indById = {};
    inds.forEach(i => {
      indById[i.id] = i;
      const d = DB.indents[i.trade_date] = DB.indents[i.trade_date] || {};
      d[i.shop_id] = { status: i.status, lines: {},
                       submittedAt: i.submitted_at, acceptedAt: i.accepted_at || null,
                       acceptedBy: i.accepted_by_name || null, late: !!i.late };
    });
    ilines.forEach(l => {
      const hdr = indById[l.indent_id];
      if (!hdr) return;
      const rec = (DB.indents[hdr.trade_date] || {})[hdr.shop_id];
      if (rec) rec.lines[l.product_code] = Number(l.qty);
    });

    const day = d => (DB.days[d] = DB.days[d] ||
                      { rates: {}, packed: {}, ship: {}, sent: {} });
    rates.forEach(r => { day(r.trade_date).rates[r.product_code] = Number(r.rate); });
    pk.forEach(p => {
      const D = day(p.trade_date);
      (D.packed[p.shop_id] = D.packed[p.shop_id] || {})[p.product_code] = Number(p.qty);
    });
    ship.forEach(s => { day(s.trade_date).ship[s.shop_id] = s.state; });
    vo.forEach(o => { day(o.trade_date).sent[o.group_name] = true; });
    vol.forEach(l => {
      const D = day(l.trade_date);
      (D.order = D.order || {})[l.product_code] = Number(l.qty);
    });

    const invById = {};
    invs.forEach(v => {
      invById[v.id] = v;
      const d = DB.invoices[v.trade_date] = DB.invoices[v.trade_date] || {};
      d[v.shop_id] = { id: v.id, no: v.bill_no, date: v.trade_date, shopId: v.shop_id,
                       total: Number(v.total), roundOff: Number(v.round_off), lines: [] };
    });
    ivl.sort((a, b) => a.line_no - b.line_no).forEach(l => {
      const h = invById[l.invoice_id];
      if (!h) return;
      const rec = (DB.invoices[h.trade_date] || {})[h.shop_id];
      if (!rec) return;
      rec.lines.push({ code: l.product_code, name: l.name, tamil: l.tamil, unit: l.unit,
                       qty: Number(l.qty), net: Number(l.net_kg), rate: Number(l.rate),
                       amount: Number(l.amount), sell: Number(l.sell) });
    });

    DB.payments = pays.map(p => ({ id: p.id, date: p.paid_on, amount: Number(p.amount),
                                   mode: p.mode, ref: p.ref }));

    vend.forEach(v => {
      const rec = DB.vendors[v.group_name] = DB.vendors[v.group_name] ||
        { bank: { acName: '', acNo: '', ifsc: '', upi: '' } };
      rec.name = v.name; rec.phone = v.phone; rec.contact = v.contact;
      rec.address = v.address; rec.notes = v.notes;
    });
    // empty for every role but owner — RLS returns no rows rather than an error
    vbank.forEach(b => {
      const rec = DB.vendors[b.group_name];
      if (rec) rec.bank = { acName: b.ac_name, acNo: b.ac_no, ifsc: b.ifsc, upi: b.upi };
    });

    mc.forEach(m => { DB.master.comm[m.shop_id] = Number(m.pct); });
    ms.forEach(m => {
      (DB.master.selling[m.shop_id] = DB.master.selling[m.shop_id] || {})[m.product_code] =
        Number(m.pct);
    });
    if (st.length) DB.settings.anytime = !!st[0].anytime;

    // the server is now the baseline; anything still queued is local work
    synced = flatten(DB);
    writeJSON(SKEY, synced);
    return DB;
  }

  /* ============================================================
     7. Who is signed in
     ============================================================
     The role comes from the database, never from the browser. The
     read_self policy returns exactly one row — the caller's own — so
     nobody can ask for somebody else's tag. A signed-in account with
     no app_users row returns nothing, which is the intended default
     for an uninvited signup. */

  /* The id Supabase signed us in as, read out of the token itself. No
     request needed: the middle third of a JWT is the claims, and `sub`
     is the auth user id. Only used to ask for our own row. */
  function myUid() {
    if (!auth || !auth.access_token) return '';
    try {
      const part = auth.access_token.split('.')[1];
      if (!part) return '';
      const claims = JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/')));
      return claims.sub || '';
    } catch (e) { return ''; }
  }

  async function whoami() {
    if (!enabled() || !signedIn()) return null;
    /* Asked for by id. An owner may read every row in the client, so an
       unfiltered select would hand back whoever happens to sort first and
       the app would wear someone else's role. */
    const uid = myUid();
    if (!uid) return null;              // rather than guess at whose row this is
    const r = await fetch(
      CFG.url + '/rest/v1/app_users?select=id,full_name,role,client_id,shop_id,active'
              + '&id=eq.' + encodeURIComponent(uid),
      { headers: headers() });
    if (r.status === 401 && await refresh()) return whoami();
    if (!r.ok) throw await httpError(r, 'app_users');
    const rows = await r.json();
    const me = rows.filter(u => u.active)[0];
    if (!me) return null;
    // the app's own notion of a role: a shop user *is* their shop
    me.appRole = me.role === 'shop' ? me.shop_id : me.role;
    return me;
  }

  /* ============================================================
     8. People
     ============================================================
     Thin wrappers over the functions in supabase/06_users.sql. Every
     one of them re-checks is_owner() server side, so a browser that
     calls them without the right role is refused by the database
     rather than by the interface. */

  /* What a shop will be billed per kilo. The market rate is Velora's
     cost base and a shop may not read it (02_security.sql, read_rates),
     so its own screens have nothing to work from and every amount on
     them came out as zero. purchase_rate() is SECURITY DEFINER for
     exactly this: it hands back the resulting rate without exposing the
     margin behind it. Answers null for a product with no rate yet, and
     that is shown as "rate not set" rather than as nothing owed. */
  async function purchaseRateFor(shopId, code, date) {
    if (!enabled() || !signedIn()) return null;
    try {
      const r = await fetch(CFG.url + '/rest/v1/rpc/purchase_rate', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ p_shop: shopId, p_code: code, p_date: date }),
      });
      if (!r.ok) return null;
      const v = await r.json();
      return (v === null || v === undefined || v === '') ? null : Number(v);
    } catch (e) { return null; }
  }

  /* Every rate that shop was charged on that day, in one request. A
     project that has not been given the function yet answers 404, and
     the caller falls back to asking product by product. */
  async function purchaseRatesOn(shopId, date) {
    if (!enabled() || !signedIn()) return null;
    try {
      const r = await fetch(CFG.url + '/rest/v1/rpc/purchase_rates_on', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ p_shop: shopId, p_date: date }),
      });
      if (!r.ok) return null;
      const rows = await r.json();
      if (!Array.isArray(rows)) return null;
      const out = {};
      rows.forEach(x => { out[x.product_code] = Number(x.rate); });
      return out;
    } catch (e) { return null; }
  }

  /* ---------- clearing a day, for testing ----------
     Everything the day is made of, off the server. Tables this project
     does not have yet are skipped rather than failing the lot; a row
     that is already gone is not an error either. Invoice lines and
     indent lines go with their headers, on delete cascade. */
  const DAY_TABLES = ['indent_lines', 'indents', 'day_rates', 'packed', 'shipments',
                      'vendor_order_lines', 'vendor_orders', 'invoices'];

  async function wipeDay(date) {
    if (!enabled() || !signedIn()) return { cleared: [], skipped: [] };
    const cleared = [], skipped = [];
    for (const t of DAY_TABLES) {
      /* indent_lines is keyed by its header, so it has no date of its
         own; deleting the headers takes the lines with them */
      if (t === 'indent_lines') continue;
      try {
        const r = await fetch(CFG.url + '/rest/v1/' + t
                              + '?trade_date=eq.' + encodeURIComponent(date),
                              { method: 'DELETE', headers: headers({ 'Prefer': 'return=minimal' }) });
        if (r.ok || r.status === 404) cleared.push(t);
        else {
          const e = await httpError(r, t);
          if (isMissingTable(e)) skipped.push(t); else throw e;
        }
      } catch (e) {
        if (isMissingTable(e)) skipped.push(t); else throw e;
      }
    }
    /* the day is gone: forget it was ever synced, so what is left on
       this device is not read as new work and pushed straight back */
    queue = queue.filter(o => JSON.stringify(o.row || {}).indexOf(date) < 0);
    writeJSON(QKEY, queue);
    return { cleared: cleared, skipped: skipped };
  }

  async function rpc(fn, args) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: headers(),
      body: JSON.stringify(args || {}),
    });
    if (r.status === 401 && await refresh()) return rpc(fn, args);
    if (!r.ok) throw await httpError(r, fn);
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  const listPeople      = ()             => rpc('list_people');

  /* Create the login outright, password and all, instead of waiting for
     the person to sign up. Runs in an edge function because it needs the
     service_role key. Throws NOT_DEPLOYED if the function is not there,
     so the caller can fall back to an invite. */
  /* A new password for someone who forgot theirs. Same function, same
     owner check — shop staff have no email, so there is no reset link
     to send them and the owner hands the new one over instead. */
  async function resetPassword(userId, password) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    let r;
    try {
      r = await fetch(CFG.url + '/functions/v1/create-user', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ action: 'reset', user_id: userId, password: password }),
      });
    } catch (e) {
      const err = new Error('NOT_DEPLOYED'); err.notDeployed = true; throw err;
    }
    if (r.status === 404) { const e = new Error('NOT_DEPLOYED'); e.notDeployed = true; throw e; }
    if (r.status === 401 && await refresh()) return resetPassword(userId, password);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ('Could not reset (' + r.status + ')'));
    return body;
  }

  /* Removing somebody for good. The edge function takes both halves —
     the row that grants access and the account that can sign in. If it
     is not deployed the row can still be removed here, because an owner
     may write app_users directly; the sign-in survives that, which is
     why the caller is told which of the two happened. */
  async function removePerson(userId) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    let r;
    try {
      r = await fetch(CFG.url + '/functions/v1/create-user', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ action: 'delete', user_id: userId }),
      });
    } catch (e) {
      const err = new Error('NOT_DEPLOYED'); err.notDeployed = true; throw err;
    }
    if (r.status === 404) { const e = new Error('NOT_DEPLOYED'); e.notDeployed = true; throw e; }
    if (r.status === 401 && await refresh()) return removePerson(userId);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      /* A deployment that predates the delete action does not recognise
         it, falls through to the create path and asks for an email
         address — which is nonsense in answer to "remove this person",
         and it stopped the delete outright. Anything a deployment says
         it cannot do is treated as "this one cannot delete", and the
         caller falls back to removing the access on its own. The one
         real refusal, deleting yourself, is passed through. */
      const why = String(body.error || '');
      if (/your own/i.test(why)) throw new Error(why);
      if (r.status === 400 || r.status === 404 || r.status === 405) {
        const e = new Error('NOT_DEPLOYED'); e.notDeployed = true; e.said = why; throw e;
      }
      throw new Error(why || ('Could not delete (' + r.status + ')'));
    }
    return body;
  }

  /* the fallback: access goes, the sign-in stays */
  async function removeAccess(userId) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/app_users?id=eq.' + encodeURIComponent(userId), {
      method: 'DELETE', headers: headers({ 'Prefer': 'return=minimal' }),
    });
    if (!r.ok) throw await httpError(r, 'app_users');
    return { id: userId, deleted: true, accessOnly: true };
  }

  async function createUser(o) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    let r;
    try {
      r = await fetch(CFG.url + '/functions/v1/create-user', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({
          email: o.email, password: o.password || '', full_name: o.name || '',
          role: o.role, phone: o.phone || null,
          client_id: o.clientId || null, shop_id: o.shopId || null,
          /* no password means invite them by email instead; the link has to
             come back to wherever this app is being served from */
          action: o.password ? null : 'invite',
          redirect_to: location.origin + location.pathname,
        }),
      });
    } catch (e) {
      const err = new Error('NOT_DEPLOYED'); err.notDeployed = true; throw err;
    }
    if (r.status === 404) { const e = new Error('NOT_DEPLOYED'); e.notDeployed = true; throw e; }
    if (r.status === 401 && await refresh()) return createUser(o);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ('Could not create the login (' + r.status + ')'));
    return body;
  }

  /* A new branch. Written straight through rather than queued: every
     indent, packed line and margin row carries a foreign key to shops,
     so the shop has to exist on the server before anything referencing
     it can be pushed. RLS lets only an owner do this. */
  async function addShop(shop) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/shops?on_conflict=id', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ id: shop.id, client_id: CFG.clientId,
                              name: shop.name, prefix: shop.prefix }]),
    });
    if (r.status === 401 && await refresh()) return addShop(shop);
    if (!r.ok) throw await httpError(r, 'shops');
    return true;
  }
  const setPersonRole   = (id, role)     => rpc('set_person_role',   { p_user: id, p_role: role });
  const setPersonActive = (id, active)   => rpc('set_person_active', { p_user: id, p_active: active });
  const cancelInvite    = (id)           => rpc('cancel_invite',     { p_invite: id });
  const invitePerson    = (o) => rpc('invite_person', {
    p_role: o.role, p_full_name: o.name || '',
    p_phone: o.phone || null, p_email: o.email || null,
    p_client_id: o.clientId || null, p_shop_id: o.shopId || null,
  });

  /* ============================================================
     9. Catalogue
     ============================================================
     The 241 products are compiled into index.html, which is the right
     default: the app opens fully stocked with no network. But a product
     added later must outlive a reload and reach every device, so the
     database is the truth and the build is only the seed.             */

  async function addProduct(p) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const r = await fetch(CFG.url + '/rest/v1/products?on_conflict=code', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ code: p.code, name: p.name, tamil: p.tamil || '',
                              unit: p.unit, unit_weight_kg: p.wt || null,
                              alias: p.alias || '' }]),
    });
    if (r.status === 401 && await refresh()) return addProduct(p);
    if (!r.ok) throw await httpError(r, 'products');

    // the group mapping is a second row, and the product must exist first
    const g = await fetch(CFG.url + '/rest/v1/product_groups?on_conflict=product_code', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ product_code: p.code, group_name: p.group }]),
    });
    if (!g.ok) throw await httpError(g, 'product_groups');
    return true;
  }

  /* A new vendor. The group row has to land before the vendor row —
     vendors.group_name references it — and before any product can be
     mapped to it. Queued writes would not hold that order, so both go
     straight through. */
  async function addVendorGroup(g) {
    if (!enabled() || !signedIn()) throw new Error('Not signed in');
    const grp = await fetch(CFG.url + '/rest/v1/vendor_groups?on_conflict=name', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ name: g.name, manual: !!g.manual, sort_ord: g.sort || 50 }]),
    });
    if (grp.status === 401 && await refresh()) return addVendorGroup(g);
    if (!grp.ok) throw await httpError(grp, 'vendor_groups');

    const ven = await fetch(CFG.url + '/rest/v1/vendors?on_conflict=group_name', {
      method: 'POST',
      headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ group_name: g.name, name: g.vendorName || g.name,
                              phone: g.phone || '', contact: '', address: '', notes: '' }]),
    });
    if (!ven.ok) throw await httpError(ven, 'vendors');
    return true;
  }

  /* Everything the catalogue is made of, for merging over the build. */
  async function fetchCatalogue() {
    if (!enabled() || !signedIn()) return null;
    const [products, groups, mapping] = await Promise.all([
      get('products', 'code,name,tamil,unit,unit_weight_kg,alias').catch(() => []),
      get('vendor_groups', 'name,manual,sort_ord').catch(() => []),
      get('product_groups', 'product_code,group_name').catch(() => []),
    ]);
    return { products: products, groups: groups, mapping: mapping };
  }

  /* ============================================================
     10. Bill numbers — issued by the database, never locally
     ============================================================ */

  async function nextBillNo(shopId, date) {
    if (!enabled() || !signedIn()) return null;
    const r = await fetch(CFG.url + '/rest/v1/rpc/next_bill_no', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ p_shop: shopId, p_date: date }),
    });
    if (!r.ok) throw await httpError(r, 'next_bill_no');
    return r.json();
  }

  /* ---------- retry when the connection comes back ---------- */
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', () => schedule(300));
  }

  return {
    enabled, signIn, signUp, signOut, signedIn, refresh, pull, push, record, setWho,
    refreshIndents, purchaseRateFor, purchaseRatesOn, wipeDay,
    sendLoginCode, verifyLoginCode, sendRecovery, adoptRecoverySession, setOwnPassword,
    signInShop, _shopLoginIds: shopLoginIds,
    whoami, nextBillNo, on, queueLength: () => queue.length,
    listPeople, invitePerson, createUser, resetPassword, setPersonRole, setPersonActive, cancelInvite,
    removePerson, removeAccess,
    addShop, addProduct, addVendorGroup, fetchCatalogue,
    // exported for the tests
    _flatten: flatten, _diff: diff, _collapse: collapse, _sortOps: sortOps,
    _uuidFor: uuidFor, _mayWrite: mayWrite,
    _conflictFor: t => (t === 'indent_lines' ? 'indent_id,product_code' : CONFLICT[t]),
    _reset: function () { queue = []; synced = null; WHO = { role: '', shop: '' }; },
  };
})();

/* Inlined into the app's single script block, so `const` alone would keep
   this out of reach of the tests and the console. */
if (typeof window !== 'undefined') window.VFSync = VFSync;


/* ============================================================
   Sign in
   ============================================================
   With no anon key configured VFSync.enabled() is false, the gate
   never shows, and the role dropdown works as it always has. Once a
   key is present the dropdown is replaced by the role the database
   reports for the signed-in account — the browser never chooses it.
   ============================================================ */

function gateEl(){ return document.getElementById('gate'); }

function showGate(msg){
  const g = gateEl(); if(!g) return;
  g.classList.remove('hidden');
  document.getElementById('gateErr').innerHTML =
    msg ? '<div class="err">' + esc(msg) + '</div>' : '';
}
function hideGate(){ const g = gateEl(); if(g) g.classList.add('hidden'); }

/* ============================================================
   The gate
   ============================================================
   Four things happen here, and which one depends on GATE_MODE:

     in      email and password
     code    a six digit code emailed instead of a password
     forgot  ask for a reset email
     set     choose a new password, after following a reset link
     up      create an account against an invite

   Owner, admin and head office have real email addresses, so Supabase
   sends all of this itself. Shop staff do not — their login is derived
   from their phone and the owner hands the password over on WhatsApp,
   so the code and reset options simply will not reach them. That is
   why the wording says "if you have an email".
   ============================================================ */

let GATE_MODE = 'in';
let CODE_SENT_TO = '';

const GATE_TEXT = {
  in:     { hint: 'Sign in to the supply desk.',                       btn: 'Sign in' },
  code:   { hint: 'We will email you a six digit code.',               btn: 'Email me a code' },
  forgot: { hint: 'We will email you a link to set a new password.',   btn: 'Send the link' },
  set:    { hint: 'Choose a new password.',                            btn: 'Save password' },
  up:     { hint: 'Create your account with the email the owner added.',btn: 'Create account' },
};

/* the wording on the button, which for the code screen depends on
   whether the code has gone out yet */
function gateBtnLabel(){
  if(GATE_MODE === 'code' && CODE_SENT_TO) return 'Sign in with the code';
  return (GATE_TEXT[GATE_MODE] || GATE_TEXT.in).btn;
}

/* Who is signing in decides what is asked for. A shop has no email at
   all — they sign in with the three things the office gave them, name,
   phone and password — while everyone else has a real address and gets
   the emailed code and the reset link with it.

   Always blank when the page opens, on purpose and not for want of
   remembering: the card is meant to greet a person by name and one
   question, and a device left on yesterday's answer would show a shop
   form to whoever picks the phone up next.

   'office' is still accepted, from when this was two buttons. */
let GATE_WHO = '';

function isShopWho(w){ return w === 'shop'; }

function setGateWho(w){
  GATE_WHO = (w === 'office') ? 'admin' : (w || '');
  const sel = document.getElementById('gateWho');
  if(sel && sel.value !== GATE_WHO) sel.value = GATE_WHO;
  setGateMode('in');
}

function show(id, yes){
  document.getElementById(id).className = yes ? 'f' : 'f hidden';
}

function setGateMode(m){
  GATE_MODE = m;
  /* a reset link knows who it belongs to, so the question does not apply */
  const asked  = (m === 'set') || !!GATE_WHO;
  const shop   = isShopWho(GATE_WHO) && m !== 'set';
  const t = GATE_TEXT[m] || GATE_TEXT.in;
  /* the greeting belongs to the empty card only — once a role is picked
     the hint below the dropdown says what to type, and the reset screen
     writes its own welcome */
  document.getElementById('gateWelcome').className = asked ? 'hint hidden' : 'hint';
  document.getElementById('gateHint').textContent =
    !asked ? ''    /* the welcome above says it, and the dropdown is labelled */
           : shop ? 'Your name, phone number and password.' : t.hint;
  document.getElementById('gateBtn').textContent = gateBtnLabel();

  const showPass = asked && (m === 'in' || m === 'up' || m === 'set');
  const showCode = asked && (m === 'code' && CODE_SENT_TO && !shop);
  show('gateWhoWrap',   m !== 'set');
  show('gateNameWrap',  asked && shop);
  show('gatePhoneWrap', asked && shop);
  show('gateEmailWrap', asked && !shop && m !== 'set');
  show('gatePassWrap',  showPass);
  show('gateCodeWrap',  showCode);
  document.getElementById('gateBtn').className = asked ? 'btn pri' : 'btn pri hidden';
  document.getElementById('gatePass').setAttribute('autocomplete',
    (m === 'up' || m === 'set') ? 'new-password' : 'current-password');

  const links = document.getElementById('gateLinks');
  if(m === 'set' || !asked){ links.innerHTML = ''; }
  else if(shop){
    /* no code, no reset link: there is no address to send either to.
       The office resets it and sends the new one on WhatsApp. */
    links.innerHTML = '<span style="opacity:.8">Forgotten it? Ask the office to reset it '
      + 'and send you a new one on WhatsApp.</span>';
  }
  else if(m === 'in'){
    links.innerHTML = '<a href="#" id="gateCodeLink" onclick="setGateMode(\'code\');return false">Email me a code instead</a>'
      + ' &middot; <a href="#" id="gateForgot" onclick="setGateMode(\'forgot\');return false">Forgot password</a>'
      + '<br><span style="opacity:.8">First time here?</span> '
      + '<a href="#" id="gateSwap" onclick="setGateMode(\'up\');return false">Create your account</a>';
  }else{
    /* the same id, so the one link toggles both ways */
    links.innerHTML = '<a href="#" id="gateSwap" onclick="setGateMode(\'in\');return false">Back to password sign in</a>';
  }
  document.getElementById('gateErr').innerHTML = '';
}

/* kept for the older call sites */
function swapGateMode(ev){
  if(ev) ev.preventDefault();
  setGateMode(GATE_MODE === 'up' ? 'in' : 'up');
}

function gateNote(html){
  document.getElementById('gateErr').innerHTML = '<div class="notice">' + html + '</div>';
}

/* Two people can share a phone at a shop, and the office writes the name
   down its own way. Compared on the letters alone: case, spaces, dots and
   initials are not what anyone is trying to check here. */
function sameName(a, b){
  const tidy = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  return tidy(a) !== '' && tidy(a) === tidy(b);
}

async function shopSignIn(name, phone, pass){
  /* the phone finds the account, the password opens it, and the name has
     to match the one the office saved against it */
  await VFSync.signInShop(phone, pass, SHOPS.map(s => s.id));
  const me = await VFSync.whoami();
  if(!me){
    VFSync.signOut();
    showGate('That login works, but the office has not given it a shop yet. Ask them to check it.');
    return;
  }
  if(!sameName(name, me.full_name)){
    VFSync.signOut();
    showGate('That name does not match the one saved for this phone number. '
           + 'Ask the office which name they entered for you.');
    return;
  }
  await afterSignIn(me);
}

async function doSignIn(ev){
  ev.preventDefault();
  const btn   = document.getElementById('gateBtn');
  const email = document.getElementById('gateEmail').value.trim();
  const pass  = document.getElementById('gatePass').value;
  const code  = document.getElementById('gateCode').value.trim();
  const name  = document.getElementById('gateName').value.trim();
  const phone = document.getElementById('gatePhone').value.replace(/[^0-9]/g, '');
  const mode  = GATE_MODE;

  if(isShopWho(GATE_WHO) && mode !== 'set'){
    if(!name)              { showGate('Enter your name.'); return; }
    if(phone.length < 10)  { showGate('Enter the ten digit phone number the office saved.'); return; }
    if(!pass)              { showGate('Enter your password.'); return; }
    btn.disabled = true; btn.textContent = 'Please wait...';
    try{ await shopSignIn(name, phone, pass); }
    catch(e){ showGate(e.message || 'That did not work'); }
    finally{ btn.disabled = false; btn.textContent = gateBtnLabel(); }
    return;
  }

  if(mode !== 'set' && !email){ showGate('Enter your email address.'); return; }
  if((mode === 'up' || mode === 'set') && pass.length < 8){
    showGate('Choose a password of at least 8 characters.'); return;
  }
  if(mode === 'in' && !pass){ showGate('Enter your password.'); return; }

  btn.disabled = true; btn.textContent = 'Please wait...';
  try{
    if(mode === 'forgot'){
      await VFSync.sendRecovery(email);
      /* said the same way whether or not the address exists, so this
         cannot be used to find out who has an account */
      setGateMode('in');
      gateNote('If that address has an account, a reset link is on its way. '
             + 'Shop staff have no email &mdash; ask the owner to reset yours.');
      return;
    }

    if(mode === 'code'){
      if(!CODE_SENT_TO){
        await VFSync.sendLoginCode(email);
        CODE_SENT_TO = email;
        setGateMode('code');
        gateNote('Code sent to ' + esc(email) + '. It is good for a few minutes.');
        return;
      }
      if(!/^[0-9]{6}$/.test(code)){ showGate('Enter the six digit code from the email.'); return; }
      await VFSync.verifyLoginCode(CODE_SENT_TO, code);
      CODE_SENT_TO = '';
    }else if(mode === 'set'){
      await VFSync.setOwnPassword(pass);
      /* they followed an emailed link, so they are office side whatever
         the tab was set to before */
      setGateWho(GATE_WHO && !isShopWho(GATE_WHO) ? GATE_WHO : 'admin');
      gateNote('Password saved. Sign in with it.');
      return;
    }else if(mode === 'up'){
      const r = await VFSync.signUp(email, pass);
      if(!r.signedIn){
        setGateMode('in');
        gateNote('Account created. Check your email for the confirmation link, then sign in.');
        return;
      }
    }else{
      await VFSync.signIn(email, pass);
    }
    await afterSignIn();
  }catch(e){
    showGate(e.message || 'That did not work');
  }finally{
    btn.disabled = false;
    /* worked out again rather than remembered, because a successful
       reset or code request has already moved us to another screen */
    btn.textContent = gateBtnLabel();
  }
}

function doSignOut(){
  VFSync.signOut();
  location.reload();
}

async function afterSignIn(known){
  /* the shop path has already read the row to check the name against it */
  const me = known || await VFSync.whoami();
  if(!me){
    VFSync.signOut();
    BOOTING = false;
    showGate('Your account works, but the owner has not given it access yet. Ask them to add this email under Master > Users.');
    render();
    return;
  }
  ME = me;
  ROLE = me.appRole;
  BOOTING = false;   /* the role is known: the right screen can be drawn */
  /* and the sync layer stops queueing rows this role may not write —
     before this it queued the whole local blob, which the database
     refused and the badge reported as a sync problem */
  VFSync.setWho(me.role, me.shop_id);
  /* now that the role is known, honour what the url asked for */
  if(BOOT_TAB && tabsFor().filter(t=>t.id===BOOT_TAB).length) TAB = BOOT_TAB;
  BOOT_TAB = null;
  try{
    const cat = await VFSync.fetchCatalogue();
    mergeCatalogue(cat);
  }catch(e){ /* offline: the compiled catalogue still stands */ }
  try{ await VFSync.pull(DB); }catch(e){ /* offline: carry on with local data */ }
  hideGate();
  const so = document.getElementById('signOutBtn');
  if(so) so.classList.remove('hidden');
  /* The role now comes from the database, so the dropdown would be a
     lie — it cannot change what the server will allow. */
  const rs = document.getElementById('roleSel');
  if(rs) rs.classList.add('hidden');
  const who = document.getElementById('whoami');
  if(who){
    const label = {owner:'Owner', admin:'Manager', ho:'Head office'}[me.role]
                || ((shopById(me.shop_id) || {}).name || me.shop_id);
    const tone  = me.role === 'owner' ? 'p-green' : me.role === 'admin' ? 'p-blue' : 'p-grey';
    who.innerHTML = '<b>' + esc(me.full_name || 'Signed in') + '</b>'
                  + '<span class="pill ' + tone + '">' + esc(label) + '</span>';
    who.classList.remove('hidden');
  }
  render();
  VFSync.push();
}

let ME = null;

/* "Sync problem" on its own cannot be acted on, and the reason was only
   ever in the browser console — which nobody at a shop is going to open.
   The last one is kept and the badge hands it over when tapped. */
let SYNC_ERR = '';

function showSyncErr(){
  if(!SYNC_ERR){ alert('Everything has been saved to the server.'); return; }
  alert('The last thing that could not be saved:\n\n' + SYNC_ERR
        + '\n\nIt is still on this device and will be tried again. '
        + 'Read this out to whoever set the app up.');
}

function syncBadge(state, detail){
  const el = document.getElementById('syncState');
  if(!el) return;
  if(state === 'error'){ SYNC_ERR = String(detail || ''); }
  else if(state === 'synced'){ SYNC_ERR = ''; }
  el.style.cursor = 'pointer';
  el.title = state === 'error' ? String(detail || '') : '';
  el.onclick = showSyncErr;
  el.classList.remove('hidden','busy','bad','off');
  const label = el.lastElementChild;
  if(state === 'pushing'){ el.classList.add('busy'); label.textContent = 'Saving ' + detail; }
  else if(state === 'synced'){ label.textContent = 'Saved'; }
  else if(state === 'offline'){ el.classList.add('off'); label.textContent = 'Offline ' + detail + ' waiting'; }
  else if(state === 'signed-out'){ el.classList.add('bad'); label.textContent = 'Not signed in'; }
  else if(state === 'error'){ el.classList.add('bad'); label.textContent = 'Sync problem'; }
}

/* True from the moment the page opens with a session already stored,
   until whoami() has answered. The screen is held blank for that
   moment: the role is not known yet, so the first render would paint
   the dashboard — a tab every role can reach — and then jump to where
   you actually were as soon as the answer came back. */
let BOOTING = false;

if(typeof VFSync !== 'undefined' && VFSync.enabled()){
  VFSync.on(syncBadge);

  /* A reset link, or the invite sent when the owner creates an account
     without a password, lands here carrying a session in the url. It is
     good for setting a password and nothing else — afterSignIn still
     checks app_users before anyone gets in. */
  const recovered = VFSync.adoptRecoverySession();
  if(recovered === 'recovery' || recovered === 'invite' || recovered === 'signup'){
    showGate('');
    setGateMode('set');
    if(recovered !== 'recovery'){
      document.getElementById('gateHint').textContent =
        'Welcome to Velora Fresh. Choose the password you will sign in with.';
    }
  }else if(VFSync.signedIn()){
    BOOTING = true;
    afterSignIn().catch(() => {
      BOOTING = false;
      showGate('Could not reach the server. Sign in again.');
      render();
    });
  }else{
    showGate('');
    setGateWho('');
  }
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(n, dp){ dp = dp===undefined?2:dp; return (Math.round((n||0)*Math.pow(10,dp))/Math.pow(10,dp)).toString(); }
function shopById(id){ return SHOPS.filter(s=>s.id===id)[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- pricing ---------- */
function commOf(shopId){
  const v = DB.master.comm[shopId];
  return v===undefined || v===null || v==='' ? 0 : parseFloat(v)||0;
}
/* Rates the server was asked for, because this device may not hold the
   market rate itself. Keyed by the day and the shop, so yesterday's is
   never shown against today. */
const RATEASKED = {};

function purchaseRate(shopId, code, date){
  const d = date || DATE;
  const day = DB.days[d];
  const mk = day && day.rates ? day.rates[code] : null;
  if(mk!==undefined && mk!==null && mk!=='') return (parseFloat(mk)||0) * (1 + commOf(shopId)/100);
  /* a shop has no market rates of its own — see askRates() */
  const got = RATEASKED[d+'|'+shopId+'|'+code];
  return (got === undefined || got === null) ? null : got;
}

/* A shop is not allowed to read the market rate, so its own screens had
   nothing to price with: every amount came out as zero and the last
   price on the indent stayed blank. The rate it was actually charged is
   asked of the server instead — a whole day in one request where the
   project has that function, product by product where it does not —
   and kept for the rest of the visit.

   The days asked for are the days something was last bought on, which
   in practice is one or two, not two hundred. */
let ASKING = 0;
const ASKED_DAYS = {};

async function askRates(shopId, date, codes){
  if(typeof VFSync === 'undefined' || !VFSync.enabled() || !VFSync.signedIn()) return;
  const want = codes.filter(c=>RATEASKED[date+'|'+shopId+'|'+c] === undefined);
  if(!want.length) return;
  const dayKey = date+'|'+shopId;

  if(ASKING > 2) return;              /* never more than a few at once */
  ASKING++;
  try{
    /* the whole day at once, if this project knows how. Once a day has
       been read there is nothing more to ask about it: anything it did
       not carry has no rate that day, and asking product by product
       would only be a slower way of hearing the same thing. */
    /* a request for this day is already in the air; it will redraw when
       it lands, and asking again product by product would double it */
    if(ASKED_DAYS[dayKey] === 'asking') return;
    if(ASKED_DAYS[dayKey] === 'done'){
      want.forEach(c=>{ RATEASKED[date+'|'+shopId+'|'+c] = null; });
      render();
      return;
    }
    if(!ASKED_DAYS[dayKey]){
      ASKED_DAYS[dayKey] = 'asking';
      const all = await VFSync.purchaseRatesOn(shopId, date);
      if(all){
        ASKED_DAYS[dayKey] = 'done';
        Object.keys(all).forEach(c=>{ RATEASKED[date+'|'+shopId+'|'+c] = all[c]; });
        want.forEach(c=>{ if(RATEASKED[date+'|'+shopId+'|'+c] === undefined)
                            RATEASKED[date+'|'+shopId+'|'+c] = null; });
        render();
        return;
      }
      ASKED_DAYS[dayKey] = 'single';    /* this project has no such function */
    }
    /* otherwise one at a time, and not the whole catalogue */
    const some = want.slice(0, 40);
    const got = await Promise.all(some.map(c=> VFSync.purchaseRateFor(shopId, c, date)));
    some.forEach((c,i)=>{ RATEASKED[date+'|'+shopId+'|'+c] = got[i]; });
    render();
  }catch(e){ /* offline: the lines say the rate is not set, which is true */ }
  finally{ ASKING--; }
}

/* The price on the day something was last bought. Asked for per day,
   because that is how few days are involved. */
function askLastPrices(shopId, date, codes){
  const byDay = {};
  codes.forEach(c=>{
    const l = myLastFor(shopId, c, date);
    if(!l || l.rate) return;                  /* never had it, or the bill knows */
    (byDay[l.date] = byDay[l.date] || []).push(c);
  });
  Object.keys(byDay).forEach(d=> askRates(shopId, d, byDay[d]));
}
function sellMargin(shopId, code){
  const s = DB.master.selling[shopId];
  if(s && s[code]!==undefined && s[code]!==null && s[code]!=='') return parseFloat(s[code]);
  const e = CAT[code];
  return (e && e.margin!==null && e.margin!==undefined) ? e.margin : null;
}
function sellingPrice(shopId, code){
  const p = purchaseRate(shopId, code);
  const m = sellMargin(shopId, code);
  if(p===null || m===null) return null;
  return p * (1 + m/100);
}

/* ---------- indent state helpers ---------- */
function indentOf(date, shopId){
  DB.indents[date] = DB.indents[date] || {};
  if(!DB.indents[date][shopId]) DB.indents[date][shopId] = {status:'draft', lines:{}, submittedAt:null, late:false};
  return DB.indents[date][shopId];
}
function dayOf(date){
  DB.days[date] = DB.days[date] || {rates:{}, packed:{}, ship:{}, extra:{}};
  const d = DB.days[date];
  d.rates = d.rates || {}; d.packed = d.packed || {}; d.ship = d.ship || {}; d.extra = d.extra || {};
  return d;
}
/* every product any shop has an accepted indent for, plus anything added at packing */
function uniqueCodes(date){
  const set = {};
  const day = dayOf(date);
  Object.keys(DB.indents[date]||{}).forEach(sid=>{
    const ind = DB.indents[date][sid];
    if(ind.status==='accepted' || ind.status==='packed' || ind.status==='shipped' || ind.status==='billed')
      Object.keys(ind.lines).forEach(c=>{ if(ind.lines[c]) set[c]=1; });
  });
  Object.keys(day.packed).forEach(sid=>{
    Object.keys(day.packed[sid]||{}).forEach(c=>{ set[c]=1; });
  });
  return Object.keys(set).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
}
/* Accepted is final. The day's order has gone to the vendors on the
   strength of it, the shop has been told what it is getting, and a
   quantity that moves afterwards makes the bill disagree with the
   packing slip. Every screen and every function asks this rather than
   testing the status itself, so there is one answer and not six. */
function indentLocked(date, shopId){
  const st = (indentOf(date, shopId) || {}).status;
  return st !== 'draft' && st !== 'submitted';
}

function windowState(){
  if(!WINDOW_ON) return 'open';      /* no hours are enforced — see WINDOW_ON */
  if(DB.settings.anytime) return 'open';
  const n = new Date(); const h = n.getHours() + n.getMinutes()/60;
  if(h >= OPEN_H && h < CLOSE_H) return 'open';
  if(h >= CLOSE_H && h < LATE_H) return 'late';
  return 'closed';
}

/* ---------- shell ---------- */
function setRole(r){ ROLE = r; TAB = tabsFor()[0].id; render(); }
function setDate(d){ DATE = d; writeHash(); render(); }
/* The screen lives in the address bar, so a refresh comes back to the
   same place, back and forward work, and a link can be shared. The date
   rides along when it is not today, because "the rates I was looking
   at" usually means a particular day. */
function go(t, keepHash){
  TAB = t;
  /* the menu follows where you went, so a screen reached from anywhere
     else — a link, a button, the address bar — shows under its group */
  const holds = grpHolding(t);
  if(holds) OPENGRP = holds;
  toggleSide(false);
  if(!keepHash) writeHash();
  render();
}

function writeHash(){
  const d = (DATE && DATE !== todayISO()) ? '/' + DATE : '';
  const want = '#' + TAB + d;
  if(location.hash !== want){
    /* replace, not push: switching screens should not stack up entries
       the back button has to walk through */
    history.replaceState(null, '', want);
  }
}

function readHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return null;
  const bits = raw.split('/');
  const tab  = bits[0];
  const date = bits[1];
  if(date && /^\d{4}-\d{2}-\d{2}$/.test(date)) DATE = date;
  return tab || null;
}

window.addEventListener('hashchange', function(){
  const t = readHash();
  if(t && t !== TAB){ TAB = t; render(); }
});

function menuFor(){
  if(MENU[ROLE]) return MENU[ROLE];
  return MENU.shop;                    /* ROLE is a shop id */

/* Flat list of reachable screen ids — the permission check the views
   rely on, kept separate from how the menu is drawn. */
function tabsFor(){
  const out = [];
  menuFor().forEach(g=>{
    if(g.id) out.push({id:g.id, t:g.t});
    (g.kids||[]).forEach(k=> out.push({id:k.id, t:k.t}));
  });
  return out;

/* ============================================================
   Product list  —  the catalogue, read-only
   ============================================================ */
/* Fold what the server holds over the compiled catalogue. The build is
   the seed; anything added later lives only in the database, so without
   this a new product would vanish on reload and never reach anyone
   else's device. */
function mergeCatalogue(cat){
  if(!cat) return 0;
  let added = 0;
  (cat.products || []).forEach(r=>{
    const known = !!CAT[r.code];
    CAT[r.code] = {
      code: r.code, name: r.name, tamil: r.tamil || '',
      full: r.name + (r.tamil ? ' / ' + r.tamil : ''),
      unit: r.unit || 'kg',
      wt: parseFloat(r.unit_weight_kg) || 0,
      margin: known ? CAT[r.code].margin : null,
      alias: r.alias || '',
    };
    if(r.alias) ALIAS[String(r.alias).toUpperCase()] = r.code;
    if(!known){ CODES.push(r.code); added++; }
  });
  (cat.groups || []).forEach(g=>{
    if(!GROUPS[g.name]) GROUPS[g.name] = [];
    /* a group added on another device has no vendor record here yet, and
       the vendor screen reads its name straight away */
    if(!DB.vendors[g.name]){
      DB.vendors[g.name] = {name:g.name, phone:'', contact:'', address:'', notes:'',
                            manual:!!g.manual, bank:{acName:'',acNo:'',ifsc:'',upi:''}};
    }
  });
  (cat.mapping || []).forEach(m=>{
    const was = CODE2GROUP[m.product_code];
    if(was === m.group_name) return;
    if(was && GROUPS[was]){
      const i = GROUPS[was].indexOf(m.product_code);
      if(i > -1) GROUPS[was].splice(i, 1);
    }
    CODE2GROUP[m.product_code] = m.group_name;
    (GROUPS[m.group_name] = GROUPS[m.group_name] || []).push(m.product_code);
  });
  /* keep the menu order stable and put anything unmapped in Manual order */
  GROUPNAMES.length = 0;
  Object.keys(GROUPS).forEach(g=> GROUPNAMES.push(g));
  CODES.forEach(c=>{
    if(!CODE2GROUP[c]){
      CODE2GROUP[c] = UNGROUPED;
      (GROUPS[UNGROUPED] = GROUPS[UNGROUPED] || []).push(c);
    }
  });
  return added;
}
